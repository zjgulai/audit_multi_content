cards:

  # ══════════════════════════════════════════════════════════════════
  - id: SCH-001
    目标skill: kb-l0-feishu
    目标层: L0
    主题: 日更台账要自洽到能对外交代
    作者声明: {predictive: 2, non_obvious: 2}
    条目:
      - 类: 可执行动作
        动作: 日更正文必须写明「本次对齐的是哪两侧」（DSH 知识库 L0 ↔ 飞书侧内容治理源侧数据），不许只报条数
        依据:
          - case_id: SC-5d4ac26591c85950
            anchor: session-2931d1ad-106a-4365-99f1-02d5b2cac66d:534431
            quote: 刚看到推送的日更了，这个日更信息不完整
            反例可用作: 人当场列出了台账缺的四项 —— 缺项清单本身就是「完整台账」的定义
      - 类: 可执行动作
        动作: 逐类说明每种素材（文案/图片/视频/文档/链接）跑没跑；没跑的必须写原因，并说明哪些可以补跑
        依据:
          - case_id: SC-5d4ac26591c85950
            anchor: session-2931d1ad-106a-4365-99f1-02d5b2cac66d:534431
            quote: 2.视频/文档/链接为什么不跑？
            反例可用作: 被追问的正是「没跑的那几类」，说明逐类交代是该做的
      - 类: 可执行动作
        动作: 指标（如「新鲜度」）必须写出口径与时间范围，不许只给一个词
        依据:
          - case_id: SC-5d4ac26591c85950
            anchor: session-2931d1ad-106a-4365-99f1-02d5b2cac66d:534431
            quote: 3.新鲜度这次没写明是什么意思？什么时间范围的新鲜度
            反例可用作: 追问口径 = 口径本该写出来
      - 类: 禁止动作
        动作: 不许只报「命中 N 条」而不给**知识库侧依据**（命中了哪一条、依据是什么）
        依据:
          - case_id: SC-5ebf932851413067
            anchor: session-54eb3671-ff0a-4ce4-a0b8-6027cf4e0ae8:76125
            quote: 截图写了知识库侧命中了一条，没写知识库侧依据这些
          - case_id: SC-f6dabed0ec2588dd
            anchor: session-54eb3671-ff0a-4ce4-a0b8-6027cf4e0ae8:106449
            quote: 是命中知识库后，依据后面带飞书源链接
      - 类: 风险点
        动作: 同一个 skill 留多份副本 ⇒ 读取者会读到旧版本，且它自己不知道读错了
        依据:
          - case_id: SC-3db63696ec030b11
            anchor: session-5f17a512-3ed6-4ca3-ab90-dc55498e68bc:462209
            quote: L0 层skill目前是最新版本吗？把其他的副本都可以删除了，免的你读错了

  # ══════════════════════════════════════════════════════════════════
  - id: SCH-002
    目标skill: kb-repair
    目标层: L4（跨层：修复入口）
    主题: 修复必须「落库 + 有执行点」，否则必然复现
    作者声明: {predictive: 2, non_obvious: 2}
    条目:
      - 类: 可执行动作
        动作: 动手修之前，先查**上一次同类修复有没有落进知识库/落进自证** —— 没落库就等于没修
        依据:
          - case_id: SC-14bf793ed6225158
            anchor: session-f2838897-5881-4662-a4a0-95fc241d4c04:608476
            quote: 先查修复记录是否没落知识库
            反例可用作: 人把「先查上一次落没落库」定为修之前的动作 —— 这是他的原话，不是我推的
          - case_id: SC-d84b615458073496
            anchor: session-62e7d8b8-f5f0-4f52-bb14-a92f70df368a:117618
            quote: 你上面修复的格式问题落库了吗？一定要落库，避免重复修复
            反例可用作: 同一句里给了理由（避免重复修复）
      - 类: 可执行动作
        动作: 修完之后要能指出**是哪一行代码/哪一条断言在拦它**；指不出来就还只是「改过了」
        依据:
          - case_id: SC-a135880a9582c398
            anchor: session-54eb3671-ff0a-4ce4-a0b8-6027cf4e0ae8:756810
            quote: 守衡的回复是错误的，检查下你的修复没生效：
            反例可用作: 该怎么做
      - 类: 禁止动作
        动作: 不许带着已知问题往下跑（「先修复再跑」）—— 带病跑出来的读数不能当依据
        依据:
          - case_id: SC-3dd1216e3999e818
            anchor: session-8f7baccd-0e2f-4eb8-b523-8f135c72f323:15
            quote: 有问题要先修复再跑
      - 类: 风险点
        动作: 同一症状反复出现（「怎么又复现了」）说明上一次修的是**现象**，不是执行点
        依据:
          - case_id: SC-a2fcee847a9bcb92
            anchor: session-54eb3671-ff0a-4ce4-a0b8-6027cf4e0ae8:284595
            quote: 早上就修复了这个问题，怎么又报同样的提示
          - case_id: SC-5244978276af4ebb
            anchor: session-54eb3671-ff0a-4ce4-a0b8-6027cf4e0ae8:871024
            quote: 库忙的问题，下午解决了呀，怎么又复现了

  # ══════════════════════════════════════════════════════════════════
  - id: SCH-003
    目标skill: 内容审查总控
    目标层: 评审链
    主题: 三态结论的形态与依据，必须与 PRD §5.3 一致且跨模态一致
    作者声明: {predictive: 2, non_obvious: 1}
    条目:
      - 类: 可执行动作
        动作: 出结论一律按 PRD §5.3 的三态格式（三态 + 问题数 + 完整清单链接），文档与群消息同一形态
        依据:
          - case_id: SC-14bf793ed6225158
            anchor: session-f2838897-5881-4662-a4a0-95fc241d4c04:608476
            quote: 同时参考prd5.3输出3态格式
            反例可用作: 人直接给了正确形态的出处（PRD §5.3），不需要我从反面推
          - case_id: SC-d84b615458073496
            anchor: session-62e7d8b8-f5f0-4f52-bb14-a92f70df368a:117618
            quote: 查看完整问题清单与修改建议
            反例可用作: 这是人引用的**正确形态样例**，说明该带上清单链接
      - 类: 可执行动作
        动作: 每一条命中都要在依据后面带**飞书源链接**，让业务同事能点回原文
        依据:
          - case_id: SC-f6dabed0ec2588dd
            anchor: session-54eb3671-ff0a-4ce4-a0b8-6027cf4e0ae8:106449
            quote: 我问的是图片的，不是报告链接，是命中知识库后，依据后面带飞书源链接
            反例可用作: 人逐字说出了要什么（依据后面带飞书源链接）
      - 类: 禁止动作
        动作: 不许**同一个链、同类输入却输出两种报告形态**（文案对、图片/视频不对）
        依据:
          - case_id: SC-d84b615458073496
            anchor: session-62e7d8b8-f5f0-4f52-bb14-a92f70df368a:117618
            quote: 为什么发图片和视频给守衡，输出的报告就不对了？
      - 类: 风险点
        动作: 「覆盖缺口」不是「内容有问题」—— 不写清它是**库没有可依据的条款**，就会被读成素材踩线
        依据:
          - case_id: SC-f6dabed0ec2588dd
            anchor: session-54eb3671-ff0a-4ce4-a0b8-6027cf4e0ae8:106449
            quote: 这里的覆盖缺口是什么？

  # ══════════════════════════════════════════════════════════════════
  - id: SCH-004
    目标skill: kb-recall
    目标层: L6
    主题: 回答「能不能做」之前先查证现状，不许凭印象
    作者声明: {predictive: 2, non_obvious: 2}
    条目:
      - 类: 可执行动作
        动作: 给建议之前先跑三样：知识库现状、守衡侧现状、已有 skill 与工具清单 —— 三者都读了再开口
        依据:
          - case_id: SC-ae0c8aca3b649ccb
            anchor: session-2931d1ad-106a-4365-99f1-02d5b2cac66d:76265
            quote: 你要先去查知识库现状，守衡侧回复现状，已有的skill和工具
            反例可用作: 人逐字列出了「先查哪三样」
      - 类: 禁止动作
        动作: 不许在没核对的情况下断言**部署形态/架构**（把「守衡跑在本机」说成要过桥）
        依据:
          - case_id: SC-c5577205f7433180
            anchor: session-5f17a512-3ed6-4ca3-ab90-dc55498e68bc:238422
            quote: 你下面说错了，守衡在本机中运行，你重新检查：
      - 类: 风险点
        动作: 凭印象给出的否定结论（「没有这个能力」「要另外加东西」）会被现状当场推翻 —— 而否定结论的输入必须**所有通道都自证活着**
        依据:
          - case_id: SC-ae0c8aca3b649ccb
            anchor: session-2931d1ad-106a-4365-99f1-02d5b2cac66d:76265
            quote: 我今天问了守衡视频，守衡是可以回答的

  # ══════════════════════════════════════════════════════════════════
  - id: SCH-005
    目标skill: kb-pipeline
    目标层: 编排
    主题: 改真源不改投影；批次要比得动才叫验证
    作者声明: {predictive: 2, non_obvious: 1}
    条目:
      - 类: 可执行动作
        动作: 版本唯一 —— 同一 skill 只保留一个最新版；要改就改**真源**，不保留并行副本
        依据:
          - case_id: SC-3db63696ec030b11
            anchor: session-5f17a512-3ed6-4ca3-ab90-dc55498e68bc:462209
            quote: 肯定改真源呀，只保留一个最新版本的skill
            反例可用作: 人逐字给了做法（改真源、只留一个最新版）
      - 类: 禁止动作
        动作: 不许动飞书侧源表 —— 它是只读的；库这一侧要分「内容类型/渠道」是**库的任务拆解**问题，不是源表缺字段
        依据:
          - case_id: SC-766da7ca92a2f556
            anchor: session-3ab2360e-a497-4b69-aea2-1ad28663d141:529148
            quote: 飞书侧源表是不能改的，知识库为什么一定要分 内容类型/渠道？
      - 类: 风险点
        动作: 部分重跑会让前后读数**不可比** —— 「先验证 10 个、再重跑 80 个」等于把两批不同口径的数放在一张表里
        依据:
          - case_id: SC-a19367c5a0e4554b
            anchor: session-5a714c57-886e-4f06-80ed-c226eb701eaa:476272
            quote: 既然都是要重新跑，为什么不是80个一起跑？你前期的验证有什么意义？

  # ══════════════════════════════════════════════════════════════════
  - id: SCH-006
    目标skill: 飞书审查流转
    目标层: 出口
    主题: 发出去之前先自查「发的是什么」
    作者声明: {predictive: 1, non_obvious: 2}
    条目:
      - 类: 可执行动作
        动作: 批量送审前逐件核对**发出去的内容本身**（有没有重复、有没有发错对象），再发
        依据:
          - case_id: SC-37daa78b24c45901
            anchor: session-8f7baccd-0e2f-4eb8-b523-8f135c72f323:32578
            quote: 我看到你发给守衡的3张图片都是一样的，你要确定不要发错了
            反例可用作: 该怎么做
      - 类: 禁止动作
        动作: 不许让同一条素材在批量里重复出现（对方会以为收到 3 件不同的东西）
        依据:
          - case_id: SC-37daa78b24c45901
            anchor: session-8f7baccd-0e2f-4eb8-b523-8f135c72f323:32578
            quote: 我看到你发给守衡的3张图片都是一样的，你要确定不要发错了
      - 类: 风险点
        动作: 发错输入 ⇒ 对方的判定建立在错的素材上，而报告本身看起来完全正常（**错的输入不会被任何闸门拦住**）
        依据:
          - case_id: SC-37daa78b24c45901
            anchor: session-8f7baccd-0e2f-4eb8-b523-8f135c72f323:32578
            quote: 我看到你发给守衡的3张图片都是一样的，你要确定不要发错了
