# Schema 卡片 v1 —— 会话蒸馏的**成品**
#
# 生成方式：正文由起草人（DSH agent，2026-10-15）按证据逐条写；
#           **每一条依据都由 `s5_schema.py` 机械回验**（case_id 在表里 / anchor 对得上 /
#           引文逐字出现在那条案例的原文里）。回验不过的条目会被剔除并报红。
#
# 三件必须一起看的东西：
#   · 本文件（卡片正文）      · `回验报告-v1.md`（哪条指针过、哪条不过）
#   · `../入库候选-v1.ndjson`（卡片引用的案例本体）
#
# ★ E 级上限 = **E2（草稿级、可审查、未获批）**。本轮不写库、不改 skill。
# ★ 每条 `动作` 都必须挂 `依据`；挂不上的不许写进来（契约 §一 must_not_include ①）。
# ★ 反例可以支撑「禁止动作」与「风险点」；要拿反例支撑「可执行动作」，
#   必须显式标 `反例可用作: 该怎么做`，说明这个反例反过来定义了正确做法。

