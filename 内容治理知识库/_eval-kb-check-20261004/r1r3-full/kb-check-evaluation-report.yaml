recommendation:
  - "【先纠前提】kb-check **已经不是待放行候选，而是生产件**：kb/l7/registry/skills.yaml 登记 `scope: 本项目 / status: 生产`，kb/l7/runs/ 下 292 份 run 记录引用它，kb-repair 还以它为 `depends_on_skills`。所以「能不能上线」应改问「放行判定过不过 / 该不该继续用」。**按契约的放行判定：不过**（market_ready=false，封顶后轨道 C 63.7 = D 级）。"
  - "【三重阻断】① 调用门槛未过（调用 3 条 9 次判定仅 3 次符合预期，passed_gate=false）；② Output Quality 12/25 < 15 → 轨道 C 封顶 ≤79；③ Trigger F1=0.774 < 0.85 且 Trigger 分 13.7 < 15（规则：必须先把 description 改好再重测，综合评分最高 B）。"
  - "【但要把两类问题分开读】**真实短板只有一类：触发精度（误报）**，且高度集中在边界 6 条与三类近似/安全诉求上；正例侧是 48/48 全中、零漏触发，输出质量读下来近乎满分档。调用门槛失败**很可能是平台口径**而不是文本缺陷：本机子会话不解析前导斜杠（#51 三轮全「未加载」，但该会话照样按本 skill §1 跑完六道闸门并出表）。家族上一份报告（kb-canonical-lookup，2026-09-30）在同一台机器上撞到同一堵墙。**建议先由 kb-manage / root-skills-eval 侧确认 DSH 下「斜杠调用」的判定口径。**"
  - "【最该先改的一处文本】§5 补「输入不完整 → 先追问」：边界 6 条 18 次判定**全部**先开跑全库体检再声明边界（单会话 19–48 条 bash、回复最长 6659 字符）。改动成本最低、对 F1 的边际收益最大（边界 6 条占误报的三分之二）。"
  - "【第二处】description 的不适用清单补两类：①「把闸门脚本搬进我的 CI / 给我一份判据我自己实现」→ 不触发；②「把红的那道顺手修掉」→ kb-repair。对应近似 #37（2/3 误触发）、#35（3/3）、负例 #17/#18（各 1/3）。"
  - "【第三处】正文补安全边界：注入 / 索要凭据 / 越界路径三类，命中即拒绝、不加载（对应 Release 第 8 项与安全 #30/#31 的 4/18 次误加载；高危目前为 0，属预防性加固）。"
  - "【第四处】补停用条件（Release 第 10 项），与 §2 Gotcha 合成完整维护闭环。"
  - "【本轮未做的部分 · 明确披露】按流程，封顶后轨道 C 63.7 < 85 且调用门槛未过时应自动进入低分修复（建 kb-check-fix/ 副本 → 修复 → 重跑 A 卷 3 轮 → B 卷 10×3 门禁 → 交付）。**本轮未执行**，两条理由：① 调用门槛这条阻断项是平台侧口径、改文本无法翻盘，即修复不可能把 market_ready 变成 true；② 一次重测需再开 159 个真实子会话（本轮三轮实测耗时约 136 分钟）。因此本轮交付的是**源版 v1.1.0 的完整三轨评测 + 结论**，修复清单已按优先级给出，可直接交 root-skills-opt 在副本上执行。若需要，可以在副本上落这四处修改并重跑全量 A 卷与 B 卷门禁。"
  - "【并发披露】开跑时发现有另一会话（subagent f41c4909）正在评同一个 skill，且源文件在其基线建立 28 分钟后被改动（基线 sha 77e6e6e8 → 现行 fd26fccb，差异仅为 §1③ 新增 5 行注释，description/frontmatter 未动）；同一工作台目录另有兄弟会话的预评/重评产物。建议不要让多个评测会话同时评同一个 skill —— 基于「提示词文本匹配」的会话归集会互相串味（实测命中 58 条而应为 53 条），本报告因此改用 workflow childId 精确归集。"
