  evaluated_at: "2026-10-04"
  evaluator: "root-skills-eval v3.19.1（双轨版）· 本会话 92c12bd1"
  source_sha256: "fd26fccb0f79fc28a48a04eec6f8efcf78cd13bd96e1b1c197aa7eab47d70bb8"
  premise_correction: |
    「能不能上线」这个问题本身的前提不成立 —— **kb-check 已经是生产件，不是待放行候选**：
      · kb/l7/registry/skills.yaml 里它的登记为 `scope: 本项目` / `status: 生产`（已核，见该文件 kb-check 条目）；
      · kb/l7/runs/ 下有 **292** 个 run 记录文件引用了 kb-check；
      · 它已被 kb-repair 登记为 `depends_on_skills: ["kb-check"]`，即修复链以它为前置。
    ⇒ 正确的问法是「**放行判定过不过 / 该不该继续用 / 要不要修**」，而不是「能不能上线」。
    本报告仍按契约给出 market_ready（放行判定）结论，但请把它读作「当前版本是否达到放行线」，
    而不是「能不能开始用」。
  conclusion_rule: |
    口径 A（主口径，load-based，契约口径；本报告 track_b/track_c 用此口径）：
      触发 = 该会话用 skill 工具加载了 kb-check（或注入了 <skill_content name="kb-check">）；
      不触发 = 未加载本 skill（含加载了别的 skill、含以追问收尾）；调用类记 加载 / 未加载。
    口径 B（行为口径，只改「边界情况」6 条；见 before_after）：
      边界行按「是否以追问澄清收尾」判 —— 末尾以问句/追问收尾即记追问（加载了 skill 也算）。
    ★ 平台限制（必须与口径一并读）：本轮被测会话全部是**被委派的子会话，无交互通道**，
      ask_user_question 会被运行时拒绝（R1#50 原文：「我这个会话是被委派的子会话，没有交互通道（提问被运行时拒绝）」）。
      因此「应先追问」这一预期在本平台上**只能**以「最终回复是否以追问收尾」代理测量，
      口径 A / 口径 B 的差额（F1 0.774 → 0.808）全部来自这一处代理。

