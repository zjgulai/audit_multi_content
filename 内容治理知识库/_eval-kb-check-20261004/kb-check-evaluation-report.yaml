track_a:
  total: 93.9
  status: excellent
  dimensions:
    schema_compliance:
      score: 100
      basis: "name `kb-check` 与目录逐字一致且 ASCII kebab-case；description 结构完整（功能+何时用+触发词+何时不用）；无 XML 标签；complexity=standard 合法；compatibility 声明 8 个宿主"
    frontmatter_quality:
      score: 100
      basis: "description 686 字符（200-1024）；触发短语具体（跑一遍所有闸门/闸门过没过/登记表对不对/信封闸门过一遍/skills_check 跑一下）；覆盖同义词+变体+隐含；明确写出 5 个不适用邻居（kb-repair/kb-pipeline/kb-l0-feishu/kb-review/root-skills-eval）"
    body_quality:
      score: 88.7
      basis: "正文 3071 字符、全篇祈使语态（「你/您/应该/可以」0 次）；§1 六道闸门每条「命令+判据+警告」可操作；扣分：正文无独立的 When to Use / When Not to Use 节（全文 0 命中）、无 Error Handling 章节（错误处理散在 §2/§3/§5）"
    methodology_audit:
      score: 100
      basis: "同质化命中 0：不是教科书流程，是本库私有的六道闸门 + 退出码口径 + 判据缺陷台账；竞争壁垒 2 项以上：私有数据（闸门清单与三色口径）+ 失败案例（§2 expanduser 误报台账、§4④ 并发写入者实测）"
    quality_gate:
      score: 100
      basis: "单一职责（只报不改）✓ 差异化 ✓ 有明确触发词与何时用 ✓ 可测试（命令+退出码可复跑，本会话实跑 5 项）✓ 可打包（无无效文件）✓"
    directory_structure:
      score: 40
      basis: "只有 SKILL.md；references/ examples/ scripts/ 三项不存在。属口径产物（runtime 是库自带 kb/l7|8/scripts/*.py），仍按细则记 40"

