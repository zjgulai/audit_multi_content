issues:
  - id: KBCHK-01
    severity: error
    field: "双副本不一致 / scripts/ references/ examples/ 缺失"
    message: "DSH 实际加载的宿主副本 ~/.dsh/skills/kb-check/ 只有 SKILL.md v1.1.0（7024B），**没有** references/ examples/ scripts/ 三个目录；而正文 §1 唯一可执行步骤 python3 <skill 目录>/scripts/preflight.py 实测退出码 2（No such file or directory）。§2 §3 §5.1 三处 references/examples 引用同时失效。工作区权威副本 v1.2.0 完整（8941B + 4 目录），但 DSH 会话读到的是宿主那份。"
    fix_type: "同步：把 v1.2.0 完整目录（含 references/ examples/ scripts/）落到宿主 ~/.dsh/skills/kb-check/，或反向确认应以哪一份为准并删除另一份"
  - id: KBCHK-02
    severity: error
    field: "调用门槛 / description 斜杠契约缺失"
    message: "斜杠 /知识库体检 三轮均加载 kb-check（预期不应加载）。description 只列了中文触发词「知识库体检」，没有声明「本 skill 没有中文斜杠名，/知识库体检 不是本 skill」。"
    fix_type: "在 description 的「先追问」段补一行：斜杠名只有 /kb-check；/知识库体检 等中文斜杠不是本 skill，不应加载"
  - id: KBCHK-03
    severity: warning
    field: "description 长度"
    message: "description 实测 1022 字符，硬限 1024 —— 再补一个字就触发 validate-skill 的 error 级超限。本轮要加「/知识库体检 不是本 skill」的守卫，必须先腾出空间（合并两条近似触发词或删一处重复边界）。"
    fix_type: "精简：把「不适用（各自点名）」段的 5 个去向压成一行，或把「先追问」段的 5 类合并为 3 类"
  - id: KBCHK-04
    severity: warning
    field: "误触发（近似命中/边界）"
    message: "17 次 FP 集中在 6 条：38「要体检表模板」（3/3 轮误加载）、43「体检。」（3/3）、46「只打 skill 名 kb-check」（3/3）、48「只要判据不要跑」（2/3）、36「帮我看看这个库有没有问题」（1/3）、47「没指明哪个库」（1/3）。前三类正是 description 明文写「先追问、不要加载」的场景 —— 条款在，但加载判定没跟上。"
    fix_type: "把「先追问」清单从 description 挪到正文首屏（正文 3359 字符有 641 字符余量），并在 description 只留一句最强信号：「口令过短、只给名词、只打 skill 名、没指明库，先问不要加载」"
  - id: KBCHK-05
    severity: warning
    field: "边界情况判据未对齐"
    message: "第 50 条（给了库根、没说跑哪几道）预期「应触发 + 先确认跑哪几道」，实测 3/3 轮加载但未确认范围。SKILL.md §7 只写「输入欠定 → 先问清再跑」，而该条的输入并不算「欠定」——判据边界模糊。"
    fix_type: "在 §1 预检查后补一句：库根已给但未点名闸门时，默认跑体检档六道并在体检表里显式写明「本次跑的是体检档」，或先确认再跑，二者择一并写死"
  - id: KBCHK-06
    severity: info
    field: "flaky"
    message: "36 / 37 / 47 / 48 四条的 3 轮加载结论不一致（各 1 轮偏离），全部落在欠定口令上 —— 说明边界口径依赖模型即兴判断，不是稳定行为。"
