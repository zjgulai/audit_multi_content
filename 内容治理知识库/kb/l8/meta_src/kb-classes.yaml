# kb_class 枚举表（加载器 T4 闸门读它）
#
# `kb_class` = 这条知识「出自哪一类素材」。四类出自 PRD §5.8。
# 本文件由内容治理知识库 l8 批次补建（2026-09-23）。此前本库没有这个文件，
# 而加载器 `DEFAULT_KB_CLASSES.classes = {}`，任何 kb_class 值都会判 E046 ——
# 所以**必须先有本文件、再回填条目**，顺序反了就是 509 条 E046。
#
# 纪律：加类要改本文件，不许在条目里自创 —— 跨系统路由靠它对齐。
version: 1
updated_at: '2026-09-23'
owner: 刘华丽

classes:
  外部标准库: 外部法规、平台规则、行业标准的原文与条文；合规底线的来源
  内部正负样本库: 内部已判定为「该改 / 不该改」的正负样本；判定经验的来源
  措辞表达库: 内容治理规则派生出的措辞级判定条目（禁用表达、合规替代写法）
  产品描述库: 产品、品类、成分的描述素材

# ranking：只在同一问题命中多个类的条目、需要跨类排序时起作用。
# 本视图 509 条全部是同一个类，因此这里的数值目前不影响检索结果排序。
ranking:
  外部标准库: 4
  内部正负样本库: 3
  措辞表达库: 2
  产品描述库: 1

# 三个策略开关按「白名单」语义解析：**只有显式 false 才收紧**。
# require_on_new 取 false 是刻意的：本视图 509 条的 created_at（2026-09-23）是
# **派生日期**，不是人工撰写日期；且生成器 `kb/.work/gen-host-library.py` 目前不产出
# kb_class 字段（另一个工作流在维护它）。取 true 的话，下一次重新生成派生视图就会
# 当场产生 509 条 E048 —— 那是跟并发生成器互相打架，不是纪律。
# 闸门留到生成器支持 kb_class 之后再打开；本次回填已 100% 完成（509/509）。
require_on_new: false
# 允许空：不属四类的条目（项目文档 / 台账）需要能有「我判断过、不属四类」的表达
allow_empty: true
# 允许多值：一条素材同属两类是 PRD 里就有的情况
multi: true
