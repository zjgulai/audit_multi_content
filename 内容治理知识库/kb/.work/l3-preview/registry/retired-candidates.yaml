# retired-candidates.yaml —— 候选层退场名单（PRD §2.2 排除项）
#
# 谁写它：`kb/l8/retire_excluded_candidates.py --apply`（**本件由脚本生成，人手别改**）
# 谁读它：`kb/l8/check_external_standard_supply.py` 的判据 **E4**
#
# 三条纪律（照抄 `kb/l7/scripts/l4_retire.py` 的语义，它在定稿层，本件在候选层）：
#   ① **绝不删号** —— `numbering.no_reuse`：号码一经发出永久占用，不回收、不重发；
#   ② **不删证据** —— 候选行**一个字没动**（仍在 `kb/l3/candidates/scoped_clauses.jsonl` 里、
#      仍是 `status: provisional`）；本件只**另立声明**；
#   ③ **重跑零写入** —— 名单由数据现算，同样的数据跑第二次产出同一份。
#
# ★ 为什么落在这里而不是候选件里：候选件是 L3 蒸馏器的**覆盖写目标**，
#   写进去下次重跑就被抹掉，退场记录消失而无人知道。
# ★ 「下次重跑还会不会又蒸出这批」由**另一处**解决：
#   `kb/l8/l3_scope.py::exclusion_of` 的 `rule_eligible_false` 那道门（防复发）；
#   本件管**清存量**。两件事互补。

