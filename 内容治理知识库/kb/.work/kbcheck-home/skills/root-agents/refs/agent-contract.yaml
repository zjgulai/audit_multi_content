# 统一 agent 契约（模板）
# 每个被测 agent 目录必须提供 agent.yaml，字段见下。
# root-agent 的「创建」阶段据此生成，「验证」阶段据此做资格判定。

name: my-agent
version: "0.1.0"
interface: cli            # cli | http | sdk —— 统一调用方式
                          # 创建期校验取值；体检期只校验字段存在，不校验取值域
run: python agent.py      # 启动命令
input: stdin-json         # 统一输入协议
profile: general          # general | meta —— 业务 agent 填 general，
                          # 元 agent（creater/doctor/eval/opt/check）填 meta。
                          # meta 是评测器分支的判据：命中则走元 agent 专属出题集。
                          # 注意：当前**不按 profile 分档权重**（task-schema.yaml 只有
                          # weight_general 一个权重，profile 不参与算分）。
task_types:               # 该 agent 能承接的维度（说「怎么答」）
  - fact_qa               # 业务 agent 用这 6 个（取值来自 task-schema.yaml）
  - reasoning
  - multi_turn
  - instruction
  - rag
  - safety
# 业务 agent（被测包）也可以声明**自己领域的** task_type（评测器按它分派出题集，
# 并在维度分解里单列；取值需在本文件登记，否则 check-contracts.py 报枚举漂移）。
# 这两个是本家族用过的业务维度取值，元素在家族根之外，家族根不预置业务样例包：
#   classification  —— 工单/内容分类
#   drafting        —— 回复草稿撰写
# 元 agent 用自定义 task_type（评测器按它分派出题集）：
#   generate_agent / check_agent_package / eval_agent / optimize_agent / grow_agent
deliverables:             # 该 agent 交出去的东西（说「交什么」）。至少 1 个。
  - id: report            # 必填。小写字母开头的小写+下划线，包内唯一
                          # 创建期（creater）硬校验格式与唯一性；
                          # 体检期（doctor）只校验「存在 + 唯一」，不查格式
    name: 分析报告         # 必填。业务同事看得懂的名字，不写内部代号
    format: md            # 必填。交付形态：docx | xlsx | md | json | state | text
    fields:               # 选填。硬性字段或章节清单，验收时逐个查
      - 结论
      - 依据
    acceptance: 可直接发给业务方，不需要再编辑   # 必填。业务语言写的验收标准
tools:                    # 工具清单（资格判定：case.required_tools ⊆ tools）
  - name: search
    description: 检索知识库
    schema: {}
skills: []                # 选填。该 agent 干活时真正会加载的 skill 名。
                          # 评测报告「skill」列直接取它，逐条列出「这条用例命中了哪个 skill」；
                          # **不加载 skill 的 agent 必须是空数组**，不许为了列上有东西而编名字，
                          # 也不许把「参考过某报告的排版」算成依赖该 skill。
env:                      # 密钥由 harness 注入，禁止硬编码
  API_KEY: ${managed}

# ── 选填节：以下六段不是上线门槛，但缺了就没法核对 ──
# doctor 的 D 组按它们做检查，分级口径写死在这里，改之前先想清楚：
#   fail    —— 缺陷：引用的文件不存在、占位符没替换、硬编码个人路径、无界循环
#   warn    —— 声明缺项：缺它不影响包能不能跑，只在 warnings 里提示
#   skipped —— 能力不适用：无状态 / 单 agent —— 不扣分，也不假装查过
#
# 第 12 节 work_scenarios 是**选填**：不写就用「交付物 × 事件框」推导场景，
# 推导不出来（没有 deliverables）才退回通用兜底场景池——用兜底那一轮，
# 产物与报告会如实标注「本轮题目不贴合该包职责」。
#
# work_scenarios:           # 第 12 项选填：真实工作场景（最贴合职责的一份）
#   - id: payday            # 场景标识（出题时进用例 id）
#     label: 发薪日核对      # 给人看的场景名
#     asker: 薪酬专员        # 谁在问
#     occasion: 发薪前一天   # 什么时候
#     material: true        # 手上有没有材料
#     difficulty: L2        # L1/L2/L3
#     situation: 明天发薪，财务要我先核对一遍本月薪资核算表。   # 场景原话
#     task: 把核对过程和结论写清楚。                          # 这一问要他做什么
#     deliverable_id: salary_sheet                          # 对应哪件活
# 也可以放包根或 tests/ 下的 scenarios.json：{"scenarios": [ ...同上... ]}
#
# 第 10、11 两节**按实际能力启用**：doctor 先在包里找状态与协作的证据
# （本节声明 / 模块级常量 / 真实路径引用），找到才检查对应配置。
# 无状态、不派子 agent 的包不会因为「没写记忆配置」被判缺陷。
scope:                    # 第 3 项：管什么 / 不管什么。缺 → warn
  does:                   # 处理范围，业务语言
    - 分析报告
  not_for:                # 明确不做的事（不得与 deliverables 撞名）
    - 代发邮件
routing:                  # 第 3 项：参与路由才要写。不声明 → skipped（不扣分）
  when:                   # 什么情况下该把活派给它
    - 需要一份可发给业务方的报告
limits:                   # 第 8 项：终止预算。缺 → warn
  timeout_s: 120          # 单次运行的墙钟上限
  max_iterations: 3       # 循环/重试上限（没有重试就写 1）
deps: {}                  # 第 7 项：第三方依赖清单（也可用 requirements.txt 代替）
state:                    # 第 10 项：有状态才写。无状态 → skipped（不扣分）
  path: memory/state.json # 状态放哪
  scope: 家族级           # 与谁共享：家族级 / 单用户 / 单任务
  key: run_id             # 隔离键：不同用户或任务怎么分开
  cleanup: 不自动清理，换 run_id 即开新一轮   # 何时清、旧状态何时失效
  concurrency: 单进程追加写，并发由调用方串行化  # 并发写入怎么约定
handoff:                  # 第 11 项：派子 agent 才写。单 agent → skipped（不扣分）
  to: root-agent-eval     # 交接对象（同级包名或路径；外部服务名不校验）
  input:                  # 交给对方什么
    - 修复后的副本目录
  output:                 # 从对方拿回什么
    - evals/score.json
  bounds:                 # 调用上限，防无界相互调用
    max_depth: 1
health:                   # 选填。等价于 Dockerfile 的 HEALTHCHECK
  input: {}               # 体检探针负载。医生探针优先级：
                          #   声明的 health.input > 契约默认的 question 探针 > {} 退化探针
                          # 注：「工具型 agent 必须声明」是**约定而非强制**——当前没有
                          # 任何检查会因为缺 health 判 unhealthy，只是探针会退化。

# ── 输出约定（stdout-json）──
# 所有 agent 的 stdout 是 JSON。除了各自的业务字段，**元 agent 必须带一个 `reply`**：
#
#   reply: 回复用户的原话（自然语言，一到三句）。ok:false 时写清为什么拒绝。
#
# 为什么要有它：评测报告「Agent 原文回复」列直接取它。没有这个字段时，
# 报告只能把 stdout 的接口字段原样贴上去，读起来像代码而不像回复。
#
# 取值优先级（评测器不改写，只挑选）：
#   业务 agent → `answer`（交付内容本身）；元 agent → `reply`（对用户说的话）
#   两者都没有 → 回退到原始 stdout（保底，保证任何情况下都有原文可看）
#
# ── 过程字段（选填，报了就统计，没报就记「未上报」）──
# 这三个字段是评测报告「工具调用次数 / tools / skill / 自主步数 / 参数正确性」
# 几列的数据来源：
#
#   tool_calls: 本轮真实发生的工具调用，形如 [{"name": "search", "args": {...}}]。
#               没有 tool-calling 循环的 agent 不写这个字段——不要写空数组冒充
#               「调用了 0 次工具」，那和「没有工具」是两回事。
#               **args 要如实填**：评测器按它判「参数填对没有」（关键片段包含匹配）。
#   steps:      本轮的自主步数，两种写法都认：
#                 steps: [{"n": 1, "action": "read", "tool": "search", "summary": "..."}]
#                 step_count: 5
#               一步 = 一次「想一下 → 动一下」的完整回合：一次工具调用算一步，
#               一次不带工具的模型往返也算一步。**轮数不算步数**——轮数是评测器
#               跑了几遍，不是 agent 走了几步。没上报就不判，记「未上报」。
#   skills_used: 本轮实际加载的 skill 名列表，同上，没有就不写。
#
# 契约不强制这三个字段：缺了只会让报告该列显示「未上报」，不影响判定与得分。
# 但**报了什么就要对得上**：用例声明了步数 / 次数 / 参数期望时，上报值会被逐条比对。

# ── deliverables 与 task_types 的关系 ──
# task_types 说「怎么答」（事实问答 / 推理 / 多轮 / 指令 / 检索 / 安全），
# deliverables 说「交什么」（一份稿子 / 一张名单 / 一份周报）。两者正交。
# 一个 agent 可以只有 1 件活却横跨全部 6 个维度。
# 禁止用 task_types 的条数当活儿数——照着数一定数多。
#
# ── 数活儿的判据（**给 agent 与人看的判据，非代码校验**）──
# 代码里没有任何「数活儿」的实现：评测器按**场景与交付物的对应关系**分配
# deliverable_id（出题期由场景决定，定不下来才按文本匹配，最后才轮转兜底），
# 活儿数由出题方（人或出题 agent）按下面规则判定。
# - 交出去的东西不一样 → 两件活；交出去的东西一样 → 一件活
# - 工具不算活（「会搜索」不是活，「用搜索写出一份竞品报告」才是）
# - skill 不算活（skill 是干活的说明书，可能几个 skill 支撑一件活）
# - 行为约束不算活（安全、不编造、标来源——它们约束产出，自己不产出）
# - 变体不算活（换标题、导 Excel、翻英文，交的还是同一份东西）
# - 硬校验：每件活都要能写出一条工作流（输入 → 步骤 → 交付物）。
#   写不出的，说明它是加工动作或行为约束，不算独立活
