skill:
  name: root-skills-creator
  version: "4.1.3"
  structure_version: "1.0"
  created_at: "2026-04-01"
  updated_at: "2026-08-31"
  description: "创建生产级 Agent Skill，整合 Iron Law Testing、CSO 优化、设计边界、真实运行验证（对比评测）、意图对话、模式分级与输出契约"

directories:
  scripts:
    exists: true
    count: 3
    files:
      - validate-skill.py
      - eval-skill.py
      - convert-for-model.py
    description: "工具脚本（验证/评测编排/模型转换）"
  references:
    exists: true
    count: 15
    files:
      - step-by-step-guide.md
      - iron-law-testing.md
      - eval-loop.md
      - schemas.md
      - intent-dialogue.md
      - operating-modes.md
      - output-contract.md
      - cso-optimization.md
      - skill-design-boundaries.md
      - pre-launch-checklist.md
      - skill-types.md
      - best-practices.md
      - troubleshooting.md
      - cross-model-adaptation.md
      - universal-skill-schema.md
    description: "详细指南和文档（含新增评测/对话/模式/契约/上线前审查清单）"
  examples:
    exists: true
    count: 0
    description: "使用示例"
  assets:
    exists: true
    count: 3
    items:
      - templates/minimal-skill/
      - templates/standard-skill/
      - templates/complex-skill/
    description: "模板资源（minimal/standard/complex）"
  tests:
    exists: true
    count: 0
    description: "测试用例"

dependencies:
  tools:
    - name: validate-skill.py
      path: scripts/validate-skill.py
      required: true
    - name: eval-skill.py
      path: scripts/eval-skill.py
      required: false
    - name: convert-for-model.py
      path: scripts/convert-for-model.py
      required: false
  skills:
    - name: root-skills-eval
      relation: "六维度质量评估 + 触发评测（家族版，双轨）"
      required: true
    - name: root-skills-opt
      relation: "基于评估报告的自动优化（家族版，副本修复）"
      required: false

compatibility:
  claude:
    status: "native"
    tested: true
    notes: "完整功能支持"
  cursor:
    status: "native"
    tested: true
    notes: "通过 Claude API 原生支持"
  kimi:
    status: "native"
    tested: true
    notes: "完整功能支持"
  gpt:
    status: "bridge"
    tested: false
    limitations:
      - "渐进式披露需模拟"
      - "需要 Function Calling 支持"
  minimax:
    status: "bridge"
    tested: false
    limitations:
      - "需中文优化"
  dsh:
    status: "native"
    tested: true
    notes: "dsh 会话内已验证加载"
  codex:
    status: "native"
    tested: true
    notes: "发现实测通过（codex gpt-5.4-mini 会话 5/5 可见）；功能工作流实测待跑"

workflow:
  input: user-request-to-create-skill
  output: standardized-skill-folder + evaluation-evidence
  steps:
    - "入口判断（repeated use + 输出契约，否则 no-skill）"
    - "意图对话（每轮1个核心问题，最多2轮）"
    - "选择模式（explore / release）"
    - "需求分析"
    - "设计边界审查"
    - "架构设计"
    - "Iron Law RED（真实运行 without 基线）"
    - "编写 SKILL.md"
    - "Iron Law GREEN（真实运行 with，断言 PASS/FAIL）"
    - "添加资源"
    - "验证（validate-skill.py）"
    - "Iron Law REFACTOR（压力场景真实运行）"
    - "评估优化（eval 评分；未达标则 opt 只改副本，源只读）"
    - "跨模型适配（可选）"

framework:
  family: root-skills
  manager: root-skills-manage
  peers:
    - root-skills-manage（家族管理器）
    - root-skills-doctor（诊断，家族版）
    - root-skills-eval（家族版评估，active）
    - root-skills-opt（家族版优化，active）
