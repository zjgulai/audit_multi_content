# ── §5.3.2 正文的「SUGGEST 规则」段（rev 107 新增到正文里，不在表内）───────────────
#   出处：docx raw_content 第 170–172 行（快照 `_prd-20261022/prd-raw_content-20261022.txt`）
suggest_rule:
  source: 'PRD §5.3.2 正文「SUGGEST 规则」'
  text:
    - '仅由 P3 层级（措辞与表达）或 P2 中轻微瑕疵触发。'
    - '飞书/系统回复时，在 PASS 结论下单独列一段“优化建议”。'
  why_it_matters: >
    rev 107 把「SUGGEST 由谁产」与「它长在哪」写进了正文：产者是 P3（＋ P2 轻微瑕疵），
    形状是「PASS 结论下单独一段」。这两句与表里 PASS 行「可附带 SUGGEST」是同一件事，
    也正是 `tiering.decide_effect(["P3"]) → none` 与 `render_summary("PASS", …)` 追加附段的原文依据。

# ── 标签语义（三版合一后的**判据锚**）────────────────────────────────────────────
#   为什么必须有这一段：96 与 101、101 与 107 的差都**只在语义/形状层**（都还叫「四态」），
#   光看「态齐不齐」三种读法都过得去。这一段把「三值 ＋ 标签 ＋ 四桶」钉成机器可读的形状，
#   `kb/l8/prd532_check.py` 的 A6–A9 逐条核它；删掉它，「三值/四态混着用」会当场红。
label_semantics:
  why: >
    §5.3.2 rev107：SUGGEST 不进「主状态」列，只作 PASS 的「附属信息」（可附带 SUGGEST）；
    §6.3 执行规则4「只有 SUGGEST 时，**最终状态为 PASS**（附 SUGGEST 建议），不阻断流转」；
    §10.1 `decision`：PASS / REVIEW / BLOCK；§11.2「准确率 = **三态**结论一致数 ÷ 总审查数」；
    §10.2 注「SUGGEST **随 PASS 流转**，不计入人工复核工单，但可在多维表中查看」。
    五处同向 ⇒ `decision` 三值 ＋ 一个标签。
  decision_values: [PASS, REVIEW, BLOCK]
  non_prd_extra: [NEEDS_INPUT]                 # 拒答态（fail-closed），**不是 PRD 的态**
  label_state: SUGGEST                         # 只作标签，不进 decision，**也不占主状态行**
  label_not_a_row: true                        # rev 107：它已经从表里那一行降成 PASS 的一格
  predicate: 'decision == PASS and suggest_count > 0'   # 「PASS＋SUGGEST」桶的判定式
  buckets: 4                                   # §10.2「汇总四态结论」= 四个统计桶
  buckets_named: [PASS, 'PASS+SUGGEST', REVIEW, BLOCK]
  produced_by:
    engine: 'review_engine.decide() → suggestions[] / suggest_count / suggest_label'
    card: 'render_summary("PASS", …) 追加「建议（不阻断，随 PASS 流转，共 N 条）：」附段'
    publish: '表行照常落 PASS；建议条数进 suggest_count 那一格（不靠多一个状态值）'

# ── §5.3.4 各状态输出模板（rev 107 现场读数；**SUGGEST 不是结论模板**）─────────────
#   注：rev 107 的 docx 里 SUGGEST 已经**没有自己的样张**了 —— 换成了「PASS + SUGGEST」那一档，
#   这正是 rev101 时期登记的 PRD 内部冲突 S1 被 PRD 侧自己修掉的地方。
templates:
  PASS: '【PASS】未发现已知底线风险。可转交 @<sign-off 责任人> sign-off。（≤50 字）'
  PASS_SUGGEST: >
    【PASS】未发现底线风险，但发现 1 处优化建议：
    【措辞表达】正文第 2 段“超级好用”偏口语。建议：改为“高效便捷”。
    可转交 @<sign-off 责任人> sign-off。（≤150 字）
  REVIEW: '【REVIEW】发现 N 处需人工确认：1.【类-子类】位置"…"。原因：…。依据：《…》第 X 条（链接）。建议转 @… 复核。（≤200 字）'
  BLOCK: '【BLOCK】发现 N 处必须修改：1.【类-子类】位置"…"。原因：…。依据：《…》第 X 条（链接）。建议：改为"…"。（≤200 字）'
  SUGGEST: >
    ⚠️ **不是结论模板**：建议以「附段」形式跟在 PASS 结论行之后
    （`建议（不阻断，随 PASS 流转，共 N 条）：` ＋ 逐条「维度 + 位置 + 建议」）。
    rev 107 起 PRD 连「PASS + SUGGEST」这一档样张都给了（见 `PASS_SUGGEST`），
    并且 §17 附录「结论模板速查」现为**空节**（2026-10-22 实测）—— 旧的字数表不再在 §17 里。

# ── 已知的 PRD 内部冲突 —— K（**rev 101/107 已消解**）──────────────────────────────
conflict_decision:
  id: K
  clash: >
    §5.3.2（rev 96）把 SUGGEST 列进**状态**并给了动作；§17 样张的结论行是 `【SUGGEST】…`；
    而 §6.3 规则 4 写「无 P0/P1/P2 明确违规，**只有 SUGGEST 时，最终状态为 PASS**」，
    §10.1 的 `decision` 字段又只写三值 ⇒ 到底 `decision` 能不能取 `SUGGEST`？
  readings:
    '①': 'decision 四值（SUGGEST 是最终态）—— 与 §6.3 规则 4 字面冲突'
    '③': 'decision 三值 ＋ 新增 suggest_count / suggestions 字段 —— 两处原文都不推翻'
  owner_ruling_20261019: >
    **当时取 ①**（`decision` 可取 `SUGGEST`）。Owner 2026-10-19 逐字：「推荐冲突 K 取 ①（decision 可取 SUGGEST，
    即四态）／按照 prd suggest:存在非强制性问题（措辞优化、轻微常识瑕疵、非核心卖点描述）」。
    该裁定曾覆盖 §6.3 规则 4。
  superseded_by: >
    PRD §5.3.2 **rev 101**（同日 Owner 改表）：「SUGGEST…**作为 PASS 的附属标签**」＋ PASS「**可包含 SUGGEST 建议**」；
    随后 **rev 107**（2026-10-22 实测）把 SUGGEST 从表行**整行删掉**、只留 PASS 的「附属信息」列
    （「可附带 SUGGEST（如措辞优化建议）」），并在正文补了「SUGGEST 规则」段（仅 P3／P2 轻微瑕疵触发、
    在 PASS 结论下单独列一段「优化建议」）。
    与 §6.3 规则4 / §10.1 三值 / §11.2 三态准确率 / §10.2「随 PASS 流转」四处同向。
  superseded_at: '2026-10-19（rev101）／2026-10-22 复核（rev107）'
  supersede_reason: >
    rev 101 把「SUGGEST 是态还是标签」在 PRD 侧写死（标签）；rev 107 又把它从「一行」降成「一格」。
    裁定 ① 是对 rev 96 的读法，PRD 一改它就没有解释对象了 ⇒ 按 AP14 留痕作废，不静默覆盖。
    当前口径 = 读法 ③ 的加强版：`decision` 三值 ＋ `suggestions[]` / `suggest_count` / `suggest_label`，
    且 SUGGEST **不占主状态行**。
  our_recommendation: '③（已采纳，rev 101 落地，rev 107 复核仍成立）'
  why_now: >
    同一天里 Owner 先问「卡片态必须是 4 态」，随后贴来 rev 101 的原文。
    两者**不矛盾**：4 态是**统计桶**（§10.2），不是 `decision` 四值。这条解释已写进 `label_semantics`。
    2026-10-22 再核一次：PRD 三处仍写「四态」（§6.3「汇总四态结论」、§11.1「整体四态准确率」），
    而取值口径仍是三值（§10.1、§11.2「三态结论一致数」）⇒ 「四态 = 统计桶」这个解释继续成立。

