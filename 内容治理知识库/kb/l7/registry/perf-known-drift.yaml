# perf-known-drift.yaml —— 性能类**未达标/判据过期**的登记处（只做分类，不给豁免）
#
# 谁读它：kb/l8/check_prd12_acceptance.py（§12 逐行落点核验）。
#         ——「声明了但代码从不读」= 散文；所以本文件**必须有读方**，且读方要把它用在判定上。
#
# 规则（与 l0-expected-diffs / l3-known-drift / l5-known-drift 同一套纪律）：
#   * 登记**不是豁免** —— 它只说明「这条已知、成因已定、处置已派给人」，
#     免得同一件事每天被当成新事故重报一遍（狼来了）。
#   * **读数不抄进本文件当结论**：每条只写 `measured_by`（判据路径），
#     现场读数由判据现读。`snapshot_*` 只记登记那一刻的读数，**会过期**，不许当现状引用。
#     （反面教材：`check_prd12_acceptance.py` 曾把「群响应观测数 0」硬写进表里，
#       而判据后来给出 6 次观测 —— 账实不符，就是这么来的。）
#   * 未登记的性能 FAIL = **新事件**，必须报出来。

meta:
  file: kb/l7/registry/perf-known-drift.yaml
  checker: kb/l8/check_prd12_acceptance.py
  created_at: "2026-10-12"
  owner: 刘华丽
  note: >
    本件因 Owner 2026-10-12 的口径裁定而建。裁定把 PRD §12「性能」三档
    从「证据层地板」（`kb/l8/perf_measure.py`，明确不含 agent 与 LLM）
    改成「**用户实际等的时间**」，于是三档的结论从「达标」翻成「未达标」——
    翻的是**量法**，不是库变慢了（证据层读数一个字没变）。

ruling:
  issued_by: Owner
  issued_at: "2026-10-12"
  verbatim: >
    「单条文字 ≤ 10 秒；图片 ≤ 20 秒；视频 ≤ 60 秒 ==》指的是飞书侧守衡回复的时间
     比如：我发文字给守衡，守衡 10s 内可以回复我结果」
  therefore: >
    §12「性能」三档 = `tIngress` → **守衡发出结果卡（reply-card）**。
    判据 = `kb/l8/measure_verdict_latency.py`（本裁定当日新建，含 15 项自证与反向对照）。
  not_this:
    - "不是证据层地板（那是 kb/l8/perf_measure.py，5.145 s，**不含 agent/LLM**）"
    - "不是回执卡时延（那是 §12「可用性 ≤5s」，kb/l8/measure_group_response.py）"
  consequence: >
    `kb/l7/reports/perf-latest.md` 原先那句「六项全部达标」在新口径下**不成立**
    —— 它量的是机制地板，而 PRD 这条问的是用户等多久。该报告已在同日加口径注记。

