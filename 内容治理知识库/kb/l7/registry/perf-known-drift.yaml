  - id: perf_text
    requirement: "PRD §12 性能：单条文字 ≤ 10 秒"
    measured_by: kb/l8/measure_verdict_latency.py
    snapshot_at_registration: "文字 n=45 ｜ min 12.0 s ｜ **中位 101.0 s** ｜ max 471.5 s ｜ 45/45 超线"
    verdict_at_registration: fail
    why: >
      瓶颈不在知识库：证据层地板 5.1 s、四层前置 ~15 s，而**模型侧生成**占大头
      （守衡日志逐字：「💬 回复 2903 字，耗时 54541ms」）。链本身很快
      （逐字：「🧭 送审链返回：跑成｜1875ms」），慢的是 **LLM 写那张卡**。
    owner_action: >
      **守衡侧**（另一仓库 `/Users/lute/Project/audit_multi_content`）压 LLM 段：
      典型手段是缩短回复、按结论分流（P0 命中直接回短卡）、或换更快的模型档。
      知识库侧**没有可动的余地** —— 证据层 4~5 s 已接近地板，砍它换不来 10 s。
    mitigation_20261012: >
      **已做（守衡侧，另一仓库 `/Users/lute/Project/audit_multi_content`）**：
      P0 命中那一路加**短卡**要求 —— `tools/agent/agent.mjs` 的 `P0_SHORT_REPLY_INSTRUCTION`
      ＋ 纯函数 `p0ShortReplyBlock()`（只在这一路生效；评审链/拒答/普通对话**一个字不加**）。
      · 判据 `node tools/agent/p0_short_reply.test.mjs` **11/11**（含反向对照 B1–B5 与变异 C1/C2）；
        守衡既有 8 个测试全绿；改前备份 `.backups/agent.mjs.bak-pre-p0short-20261012`；已重启（新 pid 76147，四项就绪）。
      · **覆盖只有 16.3%** —— 按守衡日志实测：送审单 129 ｜ P0 命中 21 ⇒ 这一步只救 P0 那一路。
      · ★ **效果待观测，现在不许当达标**：中位数在一次真实 P0 命中送审之后才会动，
        且**中位本身预期不动**（P0 单占不到一半）—— 见本文件 `perf_text` 的 `why`。
    expected_effect: >
      P0 命中单：结果卡从 **2903 字 / 54.5 s** 压到 ≤300 字 / ≤10 s。**这是目标，不是实测** ——
      要等下一次真实 P0 命中送审，由 `kb/l8/measure_verdict_latency.py` 自动纳入。
    status: open

