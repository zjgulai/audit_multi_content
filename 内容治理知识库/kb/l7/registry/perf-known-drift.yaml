  # ── L5 的 1MB 余量用例：判据 FAIL，但**没有任何周期闸门看它** ─────────────────────
  - id: p0_response
    requirement: "PRD §12 P0 层响应 ≤ 1 秒（PRD 原文**未限定输入规模**）"
    measured_by: kb/l5/benchmark.json（`verdict` 字段；由 kb/.work/l5_bench.py 产出）
    snapshot_at_registration: >
      11 条模式 ｜ 1MB 用例中位 **1229 ms**（`under_1s: false`）⇒ `verdict = FAIL`；
      真实送审形态三档 0.04 / 0.95 / 154 ms 全部 ≤1s。
    verdict_at_registration: fail
    why: >
      **判据过期，不是算法劣化**（2026-10-10 定性件 `定性-L5性能FAIL是否回归-20261010.md`）：
      每模式耗时四次测量恒定 102.9–105.3 ms，而模式表从 7 条扩到 11 条（补 H01/H03/H08/M03）
      ⇒ 1132→1229 ms 是**线性于模式数**。1MB ≈ 37 万字符 ≈一本书，而真实送审是单条文案/一张图 OCR。
    evidence: >
      跳变时刻可钉死：`m03-p0-20261009`（7 模式，730.884 ms，PASS）→
      `daily-20261010-1010-L5`（11 模式，1132.333 ms，FAIL）。
      消费方现状：`grep -rn benchmark kb/l8 kb/l7/scripts ci tools` = **0 命中**
      ⇒ 只有 `kb/.work/l5_report.py` 读它来写 L5 落章 verdict（今天 2026-10-12 16:52 的落章仍是 FAIL），
      **闸门不看、日报不提、未达标说明没写**。本登记补的就是这一格。
    owner_action: >
      二选一，**要 Owner 点头**（属口径变更）：
      ① 判据分级 —— 真实送审形态仍须 <1s，1MB 余量用例改判「**每模式 ≤ 120 ms**」
         （超过 120 才说明真劣化）；
      ② 优化 matcher 保住 1MB <1s（代价：另一工时；已做过两轮优化，再压 30% 不便宜）。
      改 `kb/.work/l5_bench.py` 前**必须先备份 `kb/l5/benchmark.json`**（它不解析 argv、无干跑档，一跑无条件覆写）。
    status: resolved
    resolution: >
      **Owner 2026-10-12 同意走 ①（判据分级）**，已落地：
      · `kb/.work/l5_bench.py` 改为分级判定 —— **真实送审形态三档硬门槛 <1000 ms 一个字没松**，
        余量用例 `large_doc_1mb` 改判**每模式中位 ≤ 120 ms**；口径写进 `benchmark.json.criterion`（**单一真源**）。
      · 判据自证 `l5_bench.py --selftest` **10/10**（含反向对照：真实形态 1000 ms ⇒ FAIL、
        余量用例 1500 ms ⇒ FAIL；**⑥ 真实形态超线时整体必须 FAIL ⇒ 分级不覆盖真实形态**）。
      · 复跑后 `kb/l5/benchmark.json`：`verdict = PASS`（真实形态 0.039 / 0.965 / 147.185 ms；
        1MB 1185.489 ms ÷ 11 模式 = **107.772 ms/模式**）。改前备份在 `kb/l5/_backups/bench-grading-20261012/`。
      · **接线**：新增复算闸门 `kb/l8/check_perf_bench.py`（只读、读 `criterion` 复算、
        并比对「记下来的 verdict」与「复算 verdict」）⇒ 挂进 `ci/run_gates.py` 的 **CORE_GATES（blocking）**。
        自证 **9/9**。这是补上原来的缺口：**此前全库没有任何周期闸门读 benchmark.json**
        （`grep -rn benchmark kb/l8 kb/l7/scripts ci tools` = 0 命中），所以那次 FAIL 一直红着没人看见。
