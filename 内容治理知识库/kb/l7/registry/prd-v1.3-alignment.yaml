      - kb/l7/registry/regression-set.yaml # 期望态集合
    disposition: recorded
    risk: >
      「PASS 误放率 ≤5%」与「REVIEW 召回率 ≥95%」是**拦漏放**的两个指标。PRD 删掉它们，
      等于不再考核"该拦的有没有漏"。本库现有回归仍按三态算，且 `fragile` 层已实测 PASS 误放
      （2026-10-15 复盘 RC-c768ef800bc4）。⇒ **建议保留本库侧这两项读数**，不随 PRD 删，
