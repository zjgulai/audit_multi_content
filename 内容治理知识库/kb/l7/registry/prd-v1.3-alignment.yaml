# ★★ PRD v1.3 自身的 6 处矛盾（「三态」与「四态」并存）—— 这是本轮**不动四态**的直接理由
# ══════════════════════════════════════════════════════════════════

prd_internal_conflicts:
  summary: >
    v1.3 在 6 处定义四态（§5.3.2 / §6.2 / §6.3 / §10.2 / §15 / §17），
    却在另外 6 处仍写"三态"。**这不是我的解读差异，是 PRD 原文并存。**
    知识库现在按三态跑，恰好与这 6 处一致、与那 6 处不一致。
  items:
    - {loc: "§1.2 目标", text: "分流：PASS / REVIEW / BLOCK 三态结论，自动转交对应负责人。"}
    - {loc: "§4 核心流程", text: "PASS / REVIEW / BLOCK"}
    - {loc: "§5.1 方式一", text: "输出三态结论（详见 5.3 输出规范）。", note: "它指向的 §5.3 已经是四态"}
    - {loc: "§5.1 方式二", text: "支持按 PASS / REVIEW / BLOCK 筛选、导出、统计。"}
    - {loc: "§10.1 记录要求", text: "`decision`：PASS / REVIEW / BLOCK", note: "而 §10.2 要「四态分布 PASS / SUGGEST / REVIEW / BLOCK」"}
    - {loc: "§11.2 评估方式", text: "准确率 = 三态结论一致数 ÷ 总审查数。", note: "而 §11.1 要「整体四态准确率 ≥ 90%」"}
  # ★★ 第八条是 2026-10-17 做 §12 归因时**新发现**的，性质比前六条更硬：
  #    前六条是"同一个词两种写法"，这一条是"**同一个字段两种语义**" —— 定不下来就没法落四态。
  definition_level_conflict:
    id: K
    where: ["§5.3.2 SUGGEST 动作", "§6.3 执行规则 4", "§10.1 decision 字段", "§10.2 四态分布"]
    verbatim:
      - "§5.3.2 SUGGEST：存在非强制性问题（措辞优化、轻微常识瑕疵、非核心卖点描述）／ 提示内容方，不阻断流程，随 PASS 一起进入下一步"
      - "§6.3 规则 4：无 P0、P1、P2 明确违规，只有 SUGGEST 时，最终状态为 PASS（附 SUGGEST 建议），不阻断流转。"
      - "§10.1：`decision`：PASS / REVIEW / BLOCK"
      - "§10.2：四态分布｜PASS / SUGGEST / REVIEW / BLOCK 数量及占比｜各状态数量 ÷ 已审内容数"
    clash: >
      按 §6.3 规则 4，**只有 SUGGEST 时最终状态是 PASS** ⇒ `decision` 到底能不能取 `SUGGEST`？
      若能 ⇒ 与"最终状态为 PASS"直接矛盾；若不能 ⇒ §10.2 的「四态分布」里 SUGGEST 那一格从哪来？
    three_readings:
      "①": "SUGGEST 是可取的最终态（decision 四值） ⇒ 与 §6.3 规则 4 矛盾"
      "②": "SUGGEST 只是标签（decision 仍三值） ⇒ 与 §5.3.2/§10.2 的「四态」字面矛盾，但内部自洽"
      "③": "decision 三值 ＋ 新增 suggest_count/suggestions 字段；§10.2 拆成「最终态分布 ＋ SUGGEST 计数」"
    our_recommendation: "③" 
    why_3: >
      §6.3 规则 4 已把"只有 SUGGEST ⇒ 最终 PASS"定死，那 SUGGEST 就不是能"最终停留在"的状态，
      而是 PASS 上的附加信息。两个字段分别表达，两处原文都不用推翻，只改措辞。
    cost_if_3: "§5.3.2 的「四态」标题要改口；§10.2 指标从 1 项变 2 项；下游报告/统计按新字段读"
    blocks: "A + C + J（四态贯通整批）"
  ask: >
    PRD 作者统一二～七那六处「三态」，**并且**就上面这条 definition_level_conflict 定一个读法
    （我们推荐 ③）。两者都定下来，本库才能启动 A/C/J。
    清单已整理成可直接转发的《反馈单》：feedback_doc 字段。
  feedback_doc: 反馈单-PRD-v1.3-给作者-20261017.md
  feedback_status: "已出单，待转给作者（2026-10-17）"

