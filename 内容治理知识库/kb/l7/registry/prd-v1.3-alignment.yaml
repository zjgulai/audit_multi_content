# prd-v1.3-alignment.yaml —— PRD 升到 v1.3 后，**知识库跟了哪几条、没跟的为什么**
#
# 一句话：这是「PRD 改版 → 知识库落点」的**逐条对账件**，不是判据。
# 它存在的理由（2026-10-17 立）：PRD 改了 10 处、其中 6 处与会签结论方式直接相关，
# 但 PRD 自己还有 6 处「三态」残留没改齐。**没有这份件，谁都不知道我们跟到了哪一版、
# 哪几条是故意没跟的** —— 于是「知识库与 PRD 不一致」会被反复当成 bug 重新发现一遍。
#
# 边界（写清楚，免得被误用）：
#   · 本件**只登记差异与处置**，不改任何行为；判定口径仍在原落点文件里。
#   · 本件不参与 L0–L7 数据链路，不改变任何层的 inputs / outputs。
#   · 唯一被代码读取的段落是 `section_12`（由 `kb/l8/check_prd12_acceptance.py` 的
#     `V13_ROWS` / `v13` 字段体现，本件与那边**必须一致**）；其余段落人工维护。
#
# 登记时间 2026-10-17（PRD v1.3 落地当天）。
# 2026-10-19 更新：PRD 已升到 **v1.4**（rev 248）；v1.4 的实质变化只有 2 处（见 `v14_delta`），
#   另把 10-19 当天按 Owner 口头口径落地的那批（四态/§17/§5.3.3/卡片字段）补登进 `batch_20261019`。

