# ══════════════════════════════════════════════════════════════════
# 十处实质变化（逐条带出处；disposition = 本轮处置）
#   followed  = 已按 v1.3 落
#   partial   = 部分落（落哪半、留哪半，写在 note 里）
#   recorded  = 只登记、不动代码（本轮不跟，理由写明）
# ══════════════════════════════════════════════════════════════════

changes:

  - id: A
    title: 新增第四态 SUGGEST（三态 → 四态）
    where: ["§5.3.2", "§6.2 输出映射", "§6.3 执行规则 3/4", "§10.2", "§15", "§17"]
    old: "PASS / REVIEW / BLOCK（三态）"
    new: >
      PASS / SUGGEST / REVIEW / BLOCK（四态）。SUGGEST 定义：「存在非强制性问题
      （措辞优化、轻微常识瑕疵、非核心卖点描述）」，动作：「提示内容方，**不阻断流程**，
      随 PASS 一起进入下一步」。§6.2 里 P3 的输出映射 = 「强制 SUGGEST（不阻断）」；
      §6.3 规则 4：「无 P0、P1、P2 明确违规，只有 SUGGEST 时，最终状态为 PASS（附 SUGGEST 建议）」。
    kb_landing:
      - kb/l7/review-engine/core/review_engine.py   # DECISIONS = {PASS,REVIEW,BLOCK,NEEDS_INPUT}
      - kb/l7/review-engine/core/feishu_publish.py  # STATUS_PASS = {PASS,REVIEW,BLOCK}
      - kb/l5/p0_fastpath.py                        # §5.3 逐条块与结论行
      - kb/l7/review-engine/core/tiering.py         # P3 = 只出建议、不改结论
      - kb/l7/registry/regression-set.yaml          # 100 条期望态：BLOCK44/REVIEW23/PASS13/拒答20
    disposition: recorded
    why_not_this_round: >
      ① **单方面落会断链**：守衡侧 `agent/prd53.mjs` 的 `STATES` 只认三态、
      `LINE_RE` 只匹配 `【审查结论：(PASS|REVIEW|BLOCK)】`；知识库一旦输出 SUGGEST，
      守衡判「没拿到三态结论」⇒ 进补发队列重跑、表行记「未判」。
      ② PRD 自己还有 6 处写"三态"（见 `prd_internal_conflicts`），现在落四态等于把矛盾固化进代码。
      ③ SUGGEST 的典型类别是「措辞表达」，正落在 Owner 划给另一会话的 §5.3.1 范围内。
    unblock_when: "PRD 内部统一为四态 + 守衡侧同一批改（本件 next_batches.丙）"
    risk_if_skipped: "四态过渡期，措辞建议类问题仍落 REVIEW —— 比 PRD 严一档，不构成漏放"

  - id: B
    title: 置信度阈值与低置信度语义
    where: ["§6.6"]
    old: "≥0.90 直接出结论（PASS/BLOCK）｜0.70–0.89 输出 REVIEW｜<0.70 输出 REVIEW"
    new: "≥0.85 直接出结论（BLOCK/SUGGEST/PASS）｜0.60–0.84 输出 REVIEW｜**<0.60 未命中 P0 ⇒ 输出 PASS**"
    kb_landing:
      - kb/l7/registry/confidence-policy.json       # thresholds = 0.90 / 0.70
      - kb/l7/review-engine/core/confidence_flow.py # direct / confirm / focus 三档
    disposition: followed
    followed_at: "2026-10-17（Owner：「置信度问题按照 prd 来做」）"
    did:
      - "kb/l7/review-engine/core/confidence_flow.py：DEFAULT_THRESHOLDS 0.90/0.70 → **0.85/0.60**；"
      - "  `focus` 档 effect 由 `force_review` → **`pass`**（未命中 P0 ⇒ PASS），annotate 置空（v1.3 不再要求标注）；"
      - "  `route()` 新增 `fail_open` / `warning`：**放行必须留 machine-readable 痕迹**（不上屏、不进摘要）；"
      - "kb/l7/registry/confidence-policy.json：thresholds + bands + prd_ref 全部换 v1.3；原 `prd_v13_delta`（写着「本轮不跟」）→ `applied_20261017_prd13`（写着「已跟 ＋ 引擎实测边界」）"
      - "kb/l7/review-engine/tests/test_tiering.py：focus 档用例按 v1.3 改（PASS + 留痕），"
      - "  并把「非 P0 置信度不会掉进 focus」那条守卫的线从 0.70 改成 **0.60**（守卫的线必须跟着政策走）"
    engine_delta_measured:
      only_real_change: "REVIEW 单里 0.85–0.89 那一段**不再被标注「建议人工确认」**（结论仍是 REVIEW）"
      correct_my_earlier_statement: >
        ⚠️ 更正：本件首次登记时我写过「19 单会从转人工变直接出结论」—— **那句是错的**。
        实测引擎对 REVIEW 的置信度截断在 [0.70,0.89]，那些单**本来就是 REVIEW**；
        改阈值只让它们**少一句标注**，状态不变。
      focus_unreachable: >
        `<0.60` 档**当前不可达**：引擎按结论截断（BLOCK/PASS→[0.90,0.99]、REVIEW→[0.70,0.89]）⇒ 最低 0.70。
        规则已按 PRD 落好，但**不许把「规则已落」说成「这条规则在生效」**。
      p0: "不受影响（P0 override 在上游先判，不分流）"
    risk_recorded: >
      `<0.60 ⇒ PASS` 是 **fail-open**：一条非 P0 的 BLOCK 若置信度掉到 0.60 以下**会被改写成 PASS**。
      本库照 PRD 落地、不自行收紧；但用 `warning` 留痕，并在 confidence-policy.json 的
      `bands.focus.danger` 里逐字写明后果。要不要接受，是 PRD 的产品决策。
    validation: "confidence_flow --selftest **35/35**（含 ③b2 钉住「focus 会把非 P0 的 BLOCK 改成 PASS」、①g 钉住旧边界已失效）｜review-engine pytest **101 passed**"

  - id: C
    title: 结论行模板前缀
    where: ["§5.3.4 各状态输出模板"]
    old: "`【审查结论：PASS】…` / `【审查结论：REVIEW】共发现 N 处需人工确认。`"
    new: "`【PASS】…` / `【SUGGEST】…` / `【REVIEW】…` / `【BLOCK】…`；问题 ≥3 的汇总用 `【状态】共发现 X 处问题。`"
    kb_landing:
      - kb/l5/p0_fastpath.py                          # 结论行逐字写 【审查结论：BLOCK】
      - kb/l7/review-engine/core/review_engine.py     # 「措辞逐字照 PRD」
      - kb/l7/review-engine/core/confidence_flow.py   # annotate_summary 里也写死
      - 守衡 agent/prd53.mjs                          # LINE_RE / STATES / conforms()
    disposition: recorded
    why_not_this_round: "与 A 同因：改前缀会让守衡的 `conforms()` 判整行不合规（它是逐字正则）"
    coupling: "必须与 A 同批、跨仓改"

  - id: D
    title: 输出字数与格式硬约束（首次成文）
    where: ["§5.3.3"]
    old: "v1.2 无此节（§5.3.4 只讲「阈值 3」的设计依据）"
    new: >
      单条：描述 ≤50 字、原因 ≤50 字、修改建议 ≤30 字。位置必须精确到
      「图 N 第 X 处」/「视频 00:12」/「正文第 X 段」。依据必须写「《文档名》第 X 条」或
      「规则 ID」，**禁止写「相关法规」**。语言客观指令式，禁止"可能/建议可以考虑"。
    kb_landing:
      - kb/l5/p0_fastpath.py                        # 逐条块版式（位置/依据行）
      - kb/l7/review-engine/core/review_engine.py   # render_summary
    disposition: recorded
    why_not_this_round: >
      本轮**没有**新增字数校验器 —— 它是新判据，按本库纪律必须同时给反向对照，
      属独立一小块工程；且一旦校验生效，存量报告可能成片超标（会红）。
      先登记，不偷偷加一道会红的闸门。
    next: "第二批可加 `check_prd53_wordlimits.py`（只读、非阻断、带 --selftest）"

  - id: E
    title: §5.4 结构化 JSON 规范 —— **整节删除**
    where: ["§5.4（v1.2）→ 无"]
    old: >
      v1.2 §5.4 定义 review_id / content_id / decision / confidence / issue_count /
      issue_summary_by_category / report_url / risk_items[priority_tier, severity, …]；
      §15 验收里还有一项「JSON 输出｜字段完整」。
    new: "v1.3 **没有 §5.4**；§15 验收里「JSON 输出」一项也删了。"
    kb_landing:
      - kb/l7/registry/conclusion-destination.yaml   # 拿 §5.4「每条审查生成一份 JSON」当"每单一行"的依据
      - kb/l7/registry/report-output-contract.yaml   # JSON 字段契约
    disposition: recorded
    disposition_note: >
      **契约保留、撤掉 PRD 锚**（D3 推荐）。下游（报告、结论表、统计）都在读这些字段，
      按 PRD 删字段 = 断链。⇒ 后续应把结论去向件里那句「依据：PRD §5.4…」改注为
      「本地契约，沿用 v1.2 字段；PRD v1.3 已删除 §5.4」。
    why_not_this_round: "改登记件措辞本身无风险，但会同时牵动 report-output-contract 的多处 prd_ref，留到第二批成批改（免得半改）"

  - id: F
    title: §12 非功能需求 9 行 → 6 行
    where: ["§12"]
    old: "性能｜并发｜可用性｜P0 层响应｜报告生成 ≤30s｜记录｜权限｜安全｜可扩展（9 行）"
    new: "性能｜响应｜批量｜记录｜权限｜安全（6 行）；**删掉「报告生成 ≤30s」「可扩展」**"
    kb_landing:
      - kb/l8/check_prd12_acceptance.py
    disposition: followed
    did: >
      按 v1.3 六行重排：`row` 一律改用 v1.3 原词（并发→批量、可用性/P0 层响应→响应）；
      新增 `v13` 字段区分在册 / 已删除；`report_gen` 与 `extensible` 标 `removed`
      ⇒ **照旧跑、照旧打印**（⬜），但**不进结论口径**；新增 `V13_ROWS` 六行覆盖率判据
      （任一行没有在册落点 ⇒ 判红）。自证 17/17（含新造的反向对照 ⑤/⑤b/⑧/⑧b）。
    note: >
      ⚠️ **这不是豁免**：移出的两条在输出里单列一段，且 `--selftest` ①f/⑤ 钉着
      「已删除的仍在输出里」「无落点判据不是恒绿」。

  - id: G
    title: §14 里程碑（1 个月试用）—— 整节删除
    where: ["§14"]
    old: "W1–W4 逐周目标 / 关键动作 / 输出"
    new: "节标题被改成「14. 已删除」，正文为空"
    disposition: recorded
    needs_confirmation: >
      疑似**删除后又留了个空标题**。若不打算保留，应把 §14 整节去掉（或改回有内容的里程碑）；
      现在是"标题写着已删除、正文空白"，任何人读 PRD 都会在这里卡一下。**这条要 PRD 作者裁。**
    kb_landing: []

  - id: H
    title: §15 验收标准重写（11 行 → 8 行）
    where: ["§15"]
    old: >
      飞书群 @Agent｜批量扫描｜**三态结论**｜问题 ≥3 汇总｜规则分层｜**JSON 输出**｜准确率｜
      人工复核｜Sign-off｜记录｜上线（11 行）
    new: "四态输出｜字数约束｜位置精度｜依据明确｜问题 ≥3｜P0 规则｜统计｜准确率（8 行）"
    kb_landing:
      - kb/l8/check_prd12_acceptance.py   # §12 那件不核 §15；§15 目前无判据
    disposition: recorded
    why_not_this_round: "§15 的验收项与 A/C/D 重叠，落它必然先落四态；随第二批走"

  - id: I
    title: §11 指标删减（三态→四态，且删掉三项）
    where: ["§11.1", "§11.2"]
    old: >
      整体三态准确率 ≥90%｜BLOCK 精确率 ≥95%｜**PASS 误放率 ≤5%**｜
      **REVIEW 召回率 ≥95%**｜**人工复核负担降低 ≥50%**
    new: >
      整体**四态**准确率 ≥90%｜BLOCK 精确率 ≥95%｜P0 漏报率 = 0｜
      SUGGEST 不纳入硬性准确率考核（但需控制误报量）｜评估以人工复核和抽检为准。
