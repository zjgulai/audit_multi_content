  - kb/l1/{1_外部标准库,2_内部正负样本库,3_措辞表达库,4_产品描述库,9_未归类}/<resource_id>.json
  - kb/l1/media/<resource_id>/img_NN.ext + ocr.json
  - kb/l1/media/<run>.manifest.json
  - kb/l1/index/l1.jsonl
  - kb/l1/sources/<run>.md
  - kb/l1/manifest_l1.jsonl
  - kb/l1/runs/<run_id>.json
  idempotency_key: (resource_id, extractor_version, source_sha256)
  gate: kb/l7/scripts/l1_gate.py（**判定档**：把上面的函数门槛落到真实数据上——遍历 kb/l1/media/_cache/*.json 逐条调用 kb/.work/kb_ocr_gate.py::ocr_cache_reusable；缓存里只要有一条不达标，命中它的图就会把坏 OCR 灌进 L1）
  cwd: '{kb_root}'
  python: ${KB_PYTHON}
  envelope: required
  write_mode: append_then_archive
  dry_run: true
  notes: '★ 本层落章引擎 = kb/l8/align_l1_manifest.py（**有** --apply 档；预演写 kb/l1/runs/<RUN>-dryrun.json）。 另注：kb/l8/apply_ocr_to_l1.py 落章用的 run_id 是 `sys.argv[2]`（L1_RUN），与编排器 RUN 可能不同名。 ★ 写通道坑（本层高发）：kb/l1/** 的 .md 一律不许 python 落盘（会变 4096 字节信封）； 既有正确写法见 kb/l8/fill_drill_failures.py：「python 写 .md.tmp → /bin/cp → 首字节断言」。 锚点铁律：锚点必须来自原文物理位置，不得编造；定位不到就进报告清单（kb/l1/README.md:52）。 anchor 规范版本 anchor-1.0；引用锚点必须同给 source_sha256（kb/l1/registry/l1.json → anchor_sha256_binding）。 ★ 干跑档（P0-3 / P0-3d，2026-09-29 补），两者实测闸门均早于第一个副作用： kb/l8/ocr_attachments.py（:54 APPLY → :75–79 退出 → 首个副作用 :81 os.makedirs）、 kb/l8/drill_links_2levels.py（:59 APPLY → :70–75 退出 → 首个副作用 :77 os.makedirs；写 kb/l1/sources）。 --purge-images 仍是更激进的删除开关，不是预演。

    '
