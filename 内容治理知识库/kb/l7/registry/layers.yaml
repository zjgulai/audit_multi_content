meta:
  file: kb/l7/registry/layers.yaml
  sync_note: "写档编排（P2，2026-09-30）：`kb/kbpy l7/scripts/kb_pipeline.py --sync --only L2` （**默认预演**；加 `--apply` 才落盘）。三条红线写在代码里，不靠人记： ① **先归档再写** —— 写 L3 前把 kb/l3/rejected.jsonl 复制到 kb/l3/_archive/rejected-pre-<run>.jsonl\n   并校验 sha（实测该台账 2026-09-29 被重建过，历史只能从 _archive 捞）；归档失败即拒绝写；\n② **编排器自己持 kb/.work/.kb.lock** —— 且把锁分成四态（不存在 / 持有者活着 / 已宣布释放的陈旧锁 /\n   pid 没了但没宣布释放），陈旧锁只在预演档放行并告警；**不自动撬锁**；\n③ **遇红闸门即停** —— 每层写之前先跑该层闸门，红就不写这一层、也不往下走。 写档白名单目前只有 L2（两周只读观察期的口径）；越界要点名 `--allow-beyond-policy`。 演练台：`kb/l7/scripts/_sync_drill.py`（在夹具库上真跑 --apply，真库 sha256 前后复核）。\n"
  checker: kb/l7/scripts/layers_check.py
  skill_binding_note: '**「到某一层调哪个 skill」的唯一真源就是本表各层的 `skill:` 字段**（2026-09-30 加）。 它回答的问题与三张姊妹表不重叠：skills.yaml 答「有哪些成员」、routes.yaml 答「这句话该谁接」、 本表答「链路怎么跑」——而现在「跑」是**逐层调该层 skill**（kb-pipeline 是编排者， 引擎由该层 skill 按本表 `engine` 跑，不在别处复制引擎清单）。 三个配套字段：`skill_write`（该 skill 有没有写档档位）、`skill_note`（限档 / 已知缺口 / 红线）。 `skill_write: false` 的层是**显式登记的缺口**，不是漏填 —— 见各层 skill_note。 判据在 kb/l7/scripts/skill_conformance.py 的 C7（层 ↔ skill 双向对账）。

    '
  cwd_note: "29 个 kb/l8/*.py 用 \"kb/...\" 相对路径 → **cwd 必须是「本次库根」**。 ★ 批次23 起本文件各层 `cwd` 写作占位符 `{kb_root}`，由编排器按**本次库根**替换\n  （`KB_ROOT` 环境变量 → 否则按编排器脚本自身位置推）。\n  **不再是固定的 `~/.dsh/Momcozy知识库`** —— 那个写死值曾导致「副本跑」静默失效\n  （真库与副本同实体时，写死路径让引擎永远落在真库；见 ledger-read-contract.yaml\n   的 `replica_isolation_silently_fails`）。\n每层都写 cwd，就是为它而设。cwd 写错 = 工程错，不是数据错。\n"
  python_note: '受管 external-tools python **缺 numpy / fastembed**，而 L6 召回两者都要 （kb/l6/retriever.py:245 np.load(matrix.npy)、:249 from fastembed import TextEmbedding）。 唯一合格解释器写在 kb/.kb-python（/usr/bin/python3）。一律用 `kb/kbpy <kb 内相对路径> [args]`， 或显式 `KB_INTERP_OK=1 /usr/bin/python3 <脚本>`。**不合格就报错退出，不静默降级。**

    '
  envelope_note: '信封闸门判据 = 同一路径 **Python os.path.getsize** 与 **node fs.statSync().size** 差值恒 4096 即为信封态。成因：python 写 .py/.txt/.md 在这台机器上落成 4096 字节信封 （宿主 Electron 侧 readFileSync 会读成乱码）。规定通道： 「python 生成内容 → 写到**无扩展名**临时件 → cp 落到目标」。 每层产物都必须过闸门；kb/l8/envelope_census.py **只扫 .md**，.py/.txt 另用 tools/envelope_gate.py。

    '
  dry_run_note: '外层 `dry_run` 是本层**整体**是否可预演。逐脚本口径（2026-09-29 读 argparse / sys.argv 实测， 同日 P0-3 补齐后更新）： **干跑档 = `--apply` 开关**：不带 `--apply` 即预演，一个字节都不落盘。 **闸门位次判据（P0-3 定稿）**：闸门必须早于本脚本的**第一个副作用** —— ① 建目录 ② 下网络/调模型 ③ 写缓存 ④ 写库内文件；干跑的第一承诺是零副作用，预览是第二位的。 **已有干跑档的库数据写脚本（8 个）**：kb/l8/reconcile_l0_feishu.py、kb/l8/ocr_attachments.py、 kb/l8/l3_distill_run.py、kb/.work/l4_article.py、kb/.work/l5_prep.py、kb/.work/l5_export.py、 kb/.work/l6_build.py、**kb/l8/drill_links_2levels.py**（写 kb/l1/sources，P0-3d 补）；另有 kb/l8/l2_split_run.py 等 18 个脚本本就带 --apply（多为对账/补台账类）。 **只读+只报告、不需要干跑档**：kb/l8/align_l0_feishu.py（写 kb/l8/_stage 快照 + kb/l8/runs 报告， docstring 明写「不改 kb/l0 任何文件」）、kb/l8/workflow_check.py（写 /tmp 沙箱 + kb/l8 报告）、 kb/l8/projection_reconcile.py（只读对账器，仅 --json-out 时写报告）、kb/l8/l2_staleness_audit.py。 ⚠ **本字段自己出过一次错，留痕**：早前版本把 align_l0_feishu.py 写成「带 --apply」（实测无此开关）， P0-1 的 P0-3 清单照那条错注释排范围，于是漏掉了真正会写库数据的 kb/l8/drill_links_2levels.py（写 kb/l1/sources）—— 已于 P0-3d 补齐（现共 8 个）。 **A3 口径（2026-09-29 收窄）**：`tools/skills_ready_check.py` 的 A3「写操作有干跑档」只对 **真改库数据**的引擎要求闸门；只写报告/台阶段/沙箱的引擎豁免（豁免理由写进判据 why）， 且「写点无法分类」一律仍按旧口径要闸门（收窄不能顺手放宽）。 实测：A3 通过 11/24 → 12/24（kb-pipeline 转正），其余 23 个 skill 判定一字未变。 **零写自证**：tools/dryrun_audit.py（AST 级：闸门须在顶层、闸门体内不得有写调用、 闸门之前不得有写点）+ tools/applypath_probe.py（把写调用换成内存叠加层，真跑 --apply 分支 但不落盘，核对写目标与改动前基线一致）。2026-09-29 实测：8 个干跑可达且全库 17,561 文件零变化； --apply 分支写目标与改动前基线逐条一致。

    '
  known_checker_defects:
  - kb/l7/scripts/skills_check.py 第 4/5 类判 depends_on_engine / selftest 路径**不做 expanduser**（第 1001–1002、1018–1019 行）→ 凡 `~` 开头的路径都会被误报「不存在」。这两个字段一律写库根相对路径。
  - kb/l8/workflow_check.py 第 ② 段用「权威库未被改动」的**冻结基线** → 活库模式下变红是**合法**的，不等于坏了。
  - kb/l8/envelope_census.py **只扫 .md**；.py/.txt 要另用 tools/envelope_gate.py。
layers:
- layer: L0
  depends_on: []
  skill:
  - kb-l0-feishu
  skill_write: true
  skill_note: '调用时**限档**：只许 `--check` / `--sync`；**禁 `--full`** —— 该档会越层重跑 下游 L1→L2→L3（阶段 9）与 L6（阶段 9.5），与「每层调该层 skill」重复执行。

    '
  engine:
  - kb/l8/align_l0_feishu.py
  - kb/l8/align_l0_schema.py
  - kb/l8/reconcile_l0_feishu.py
  - kb/l8/emit_l0_manifest_reconcile.py
  - kb/l8/fetch_video_bytes.py
  - kb/l8/extract_video_keyframes.py
  - kb/l8/drill_links_2levels.py
  - kb/l8/verify_l0_urls.py
  - kb/l8/verify_l0_nonrecord2.py
  inputs:
  - 飞书侧（lark-cli，全程只读）：entry Base GnRZbIuXraCzf0sGr2UcmZ62nfc
  - kb/l8/_stage/feishu-compare/feishu-材料收集.ndjson
  - kb/l8/_stage/feishu-compare/fields-材料收集.json
  outputs:
  - kb/l0/manifest.jsonl
  - kb/l0/index/l0.jsonl
  - kb/l0/registry/kb.json
  - kb/l0/records/<表名>/<record_id>.json
  - kb/l0/snapshots/<resource_key>@<sha256>.md
  - kb/l0/links/graph.jsonl
  - kb/l0/runs/<run_id>.json
  - kb/l0/_archive/**
  idempotency_key: (resource_key, observed_at)
  gate: kb/l7/scripts/l0_gate.py（**判定档**：读 kb/l7/registry/l0-expected-diffs.yaml，把原始差异分成 预期内 / 真差异，只有真差异才判红；底下的原始事实仍由 kb/l8/align_l0_feishu.py --check 报，不抹掉）
  cwd: '{kb_root}'
  python: ${KB_PYTHON}
  envelope: required
  write_mode: append_then_archive
  dry_run: true
  notes: '★ 本层落章引擎 = kb/l8/reconcile_l0_feishu.py（**有** --apply 档；预演写 kb/l0/runs/<RUN>-dryrun.json）。 注意其预演档**不执行采集/对账阶段**（干跑闸门早于任何联网与写入），故那条落章只证明「引擎被跑过」。 L0 只做两件事：登记源侧对象 + 算确定性指纹；不解析正文、不切分、不判业务域（kb/l0/README.md:3-5）。 指纹统一 sha256 但必须写明 sha256_input ∈ {doc_text, record_files, record_fields, file_bytes, url_text, structure}；读不到内容时 sha256=null 且写 sha256_state（kb/l0/README.md:49-52）。 ★ 飞书侧零改动：只有读调用，无 create/update/delete/move/permission 写调用（kb/l0/README.md:43-45）。 ★ 未核实：L0 没有**单一权威扫描器入口**——实际是 kb/.work/build2.py（建模型）+ kb/.work/emit2.py（写盘） 两段，另被 batch3_run.py / batch4_run.py / l0_supplement.py 多批覆盖式补跑；哪一支是在产入口，库里没写。 ★ 干跑档（P0-3，2026-09-29 补）：kb/l8/reconcile_l0_feishu.py —— APPLY = "--apply" in sys.argv（:58），不带 --apply 时于 :64–68 打印预演说明并 sys.exit(0)； **实测闸门早于第一个副作用**（首个副作用在 :96 json.dump 写缓存）。唯一入参仍是位置参数 run_id。

    '
- layer: L1
  depends_on:
  - L0
  skill:
  - kb-ingest-extractor
  - kb-media-extractor
  skill_write: true
  skill_note: '**本层不是「一个 skill 跑完」**：3 个引擎横跨两个 skill —— `extract_l1_new_resources.py` 归 `kb-ingest-extractor`， `ocr_attachments.py` / `apply_ocr_to_l1.py` 归 `kb-media-extractor`。 调 `kb-ingest-extractor` 时**只做 L1 抽取**，不许顺手跑 `l2_split_run.py`（L2 归 L2 那一步）。

    '
