  dry_run: true
  notes: '干跑写法：`kb/kbpy l8/l2_split_run.py`（**不带 --apply**）→ 只预演不落盘（:102-108）。 ⚠️ 脚本打印的「去掉 --dry-run 或加 --apply 即落盘」是**措辞误导**：`--dry-run` 这个字符串 从未被 argparse 解析，干跑是由「缺 --apply」触发的（它走 sys.argv 判断，没有 import argparse）。 ★ 并发写入者：实测 kb/l2/units.jsonl 在本 agent 未写的情况下从 10551 行涨到 10650 行 → **任何「L2 已跑完」的结论必须带 run_id + 时间戳**，不能只看文件状态。 ★ 事故留痕：kb/l2/runs/20260929-1754-l2-unscheduled-run.json（一次「意外对照运行」真实改写了 units.jsonl， 正是本轮补 --apply 的起因）。 ★ index/l2.jsonl 是**部分投影**（units 10551 行 / index 10100 行 / gap 451，全为 clause 单元，属历史覆盖缺口）。

    '
