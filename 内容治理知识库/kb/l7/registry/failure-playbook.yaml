  - id: finding.engine_import_reexecs_full_engine
    symptom: >
      **`import review` 会跑起整条评审引擎（2026-10-10 实测，已污染过活目录）**：
      `kb/l7/skills/kb-content-review/scripts/review.py:21-40` 有个**解释器守卫** ——
      `KB_INTERP_OK` 未设时，它按 `kb/.kb-python` 找到合格解释器后用 **`os.execve()` 把自己重新 exec 成脚本**。
      进程映像被替换 ⇒ 末尾的 `if __name__ == "__main__": main()` **照样成立**，
      于是 `import review` 触发一次**无参 `main()`**：拿空 `--text` 出一份 `NEEDS_INPUT` 拒答报告，
      写 `kb/l7/reports/<run>.json` + `.md`、写 `kb/l7/runs/<run>.json`、追加 `kb/l7/runs/index.jsonl`，
      并顺带走一遍新鲜度闸门（`review_freshness_gate.py`，它自己也会落 run 记录）。
      **只 grep `main()` 是发现不了的** —— 那一行确实只在 `__main__` 守卫下；真因在模块**顶部**的守卫里。
    evidence:
      - "review.py:39 `_os.execve(_want, [_want, _os.path.abspath(__file__)] + _sys.argv[1:], dict(_os.environ))`"
      - "AST 列模块级语句：唯一的顶层 `main()` 在 1955-1956 行的 `if __name__ == '__main__':` 下 ⇒ 执行来自 execve，不是 import"
      - "实测症状：`KB_ENTRY=selftest` 下 import ⇒ 打印拒跑说明、退出码 2（未设 KB_INTERP_OK）；再加 `KB_INTERP_OK=1` ⇒ 跑完整条引擎、退出码 3、落盘 2 报告 + 1 run + 1 index 行"
      - "污染归档：kb/l8/_archive/accidental-engine-run-20261010-1413/（含 NOTE.md 与逐条复原核对）"
      - "该次**没有**发飞书：报告 JSON 里不存在 `publish` 键、`report_url=None`、content_id=text-e3b0c44298fc（空串 sha256）—— NEEDS_INPUT 被拒发，闸门生效"
    owner: 评审链（kb-content-review）维护者
    do: >
      要复用引擎的判据函数（如 `resolve_anchor` / `verify_excerpt`）时，
      **必须同时设 `KB_INTERP_OK=1` 与 `KB_ENTRY=selftest` 再 import**，且 import 完立刻还原环境变量。
      已在 `kb/l8/citation_integrity.py::_import_engine()` 落地，并配**零写入哨兵**：
      跑前跑后对 `kb/l7/reports/` 与 `kb/l7/runs/` 做文件清单快照，不一致就退出码 4 大声失败。
    command: >
      自证（不碰真库）：`python3 kb/l8/citation_integrity.py --selftest`
      零副作用复核：跑 `python3 kb/l8/citation_integrity.py` 前后比 `ls kb/l7/reports/*.json | wc -l`
    forbidden: >
      不许为了「能 import」去改 review.py 的解释器守卫（那是活链同款防御，多家脚本共用）；
      不许在未设 `KB_INTERP_OK` 的情况下 import review；
      不许把「检查器 import 了引擎」当无害 —— 它会写活目录
    reopen_when: >
      review.py 把判据函数拆进独立的无副作用模块，使 import 不再触发执行

  - id: finding.bad_cite_not_implemented_conflates_declared_gap
    symptom: >
      **§11.2 的验收线「引用完整性 bad_cite=0」此前全库没有实现**（`bad_cite` 一词只出现在一处归档里），
      于是它既没被量过、也没被证伪过。2026-10-10 补上检查器后实测：朴素实现会把
      **引擎已声明的缺口**当成坏引用 ⇒ 报出「引用完整性 8.7% 不合格」，而真相是**静默坏引用 0**。
      差异来自 `review.py:860-905` 一处**两条硬闸门撞车的裁决**：
      「红线不得因依据不能逐字回源而降级为消失」—— P0 正则/关键词/等价说法命中时源侧本就没有那句逐字原文，
      引擎**照旧出 BLOCK**，但显式标 `verbatim_verified=False` + `evidence_gap`，
      出处退到 P0 模式自身声明的 anchor / source_sha256。
    evidence:
      - "全量实测（234 份报告 / 665 条引文实例 / 78 条去重）：ok 63 ｜ declared_gap 5 ｜ silent_bad 1 ｜ unresolvable 9 ｜ no_anchor 0"
      - "唯一的 silent_bad 来自 2026-09-30 的 6 份 `*-aggregate.decision|payload.json` 旧产物（摘录被拼上『边界：』标签前缀）；当前 review.py 里『边界：』命中 0 次、全库无该产物的生成器 ⇒ 历史遗留，非活缺陷"
      - "现役口径（--since 2026-10-01，228 份报告）：silent_bad = **0** ⇒ §11.2 的 bad_cite=0 在现役引擎上成立"
      - "declared_gap 5 条全是 regex/keyword 命中，例：「\\bmimic(s|king)?\\b[^.]{0,30}\\bbaby\\b」在该规则证据单元里无逐字原文（regex 命中）"
      - "缺口**浮到人眼前**：kb/l7/reports/*.review.md 245 份中 69 份含「- 原文出处：**无逐字出处** —— …」原话（渲染在 review.py:1366）"
      - "★ 读者陷阱：`kb/l7/reports/<run>.md` 这一形态**不含** evidence_gap（实测 0 命中），只有 `<run>.review.md` 含 —— 两类别混读会误判成「缺口没披露」"
      - "unresolvable 9 条全是 `#正面和负面样本/recvXXX/原文反馈` —— 该表 201 件只有元数据、没有 fields，resolve_anchor 必然返回 None（既有登记类；`_l0_entry_url()` 正是为它而设）"
    owner: 评审链 + 验收口径维护者
    do: >
      `bad_cite` 只算 **silent_bad**（验不过、且报告没标 `verbatim_verified=False`）。
      分四桶报：ok / declared_gap / silent_bad / unresolvable ——
      **不许把 unresolvable 并进 bad_cite**（「取不到」不等于「引错了」），**也不许把它当 0**。
      历史产物与现役产物**分开报**（`--since`），但**不许把历史产物从扫描里排除** —— 那是拿答案调尺子。
    command: >
      全量：`python3 kb/l8/citation_integrity.py`
      现役口径：`python3 kb/l8/citation_integrity.py --since 2026-10-01`
      判据自证：`python3 kb/l8/citation_integrity.py --selftest`（11/0）
      变异自证：`python3 kb/l8/citation_integrity.py --selftest --mutate=treat-declared-as-silent`（必须红在 ③）
    forbidden: >
      不许把 declared_gap 算进 bad_cite（会把已披露的缺口读成隐瞒）；
      不许为了让数好看而排除 `*-aggregate.*` 等历史产物；
      不许把 unresolvable 当 0 或当坏引用；
      不许为了消掉缺口去放宽 `verbatim_verified` 的判据
    reopen_when: >
      silent_bad 在现役口径下非 0，或 declared_gap 出现**未被 .review.md 披露**的新形态

  - id: finding.l3_row_doubling_breaks_mention_counts
    symptom: >
      **L3 的 `rules.jsonl` 每行出现两次 ⇒ 任何「提到 X 的规则有几条」的计数都会翻倍；
      裸子串匹配（如 `WHO`）还会把英文词误配进去**（2026-10-10 实测，这是一次真实误判的根因）。
      结构：1018 行 = **509 个 `rule_id` 各两次**，一次 `article_no=''`、一次带真号，
      **其余字段逐字相同**（`l4_article.py` 是 append-only，只补 `article_no`）。
      误判代价（真实发生）：据此得出「L3 有 64 行提到 AAP/WHO，而 L4 只有 9 条带号 ⇒ 存在发号缺口」，
      于是把「补 AAP/WHO 进 L4 编号」列成待办 —— **而真相是：提到 AAP/WHO 的唯一规则恰好 9 条，9 条全都有号**，
      那个「9」是**全集**，不是分子。按错误前提动手 ＝ 往 L4 塞重复内容并污染发号台账。
    evidence:
      - "结构实测：`Counter(rule_id)` 全部为 2；同一 rule_id 两行去掉 article_no 后逐字相等（实测 True）"
      - "精确计数（按 rule_id 去重 + 点名机构别名）：提及 AAP/WHO 的唯一规则 **9 条，9 条有号，0 条无号**；其中禁用表达本身就是 AAP/WHO 内容的 7 条"
      - "裸子串陷阱：用 `'WHO' in s.replace('WHOLE','')` 计出 66 行 / 33 条 —— 把英文词里的 WHO 片段也算了进来；只认 `AAP`/`世界卫生组织`/`美国儿科学会` 后是 9 条"
      - "L4 侧对照：`kb/l4/canonical/wording_revision_pair.jsonl` 里提到 AAP/WHO 的正好是这 9 条（W-2.36/40/42/49/84/122/130/228/334），**全在 canonical**"
      - "功能实测（只读跑 `layer_rules`）：输入「AAP建议母乳喂养至少持续至12个月」⇒ 命中 W-2.40 与 W-2.130（带条款号）⇒ 该主题**本来就能出带号结论**，无需补号"
    owner: L4 发号 / L3 蒸馏维护者
    do: >
      任何「有几条规则提到 X」的统计，**必须按 `rule_id` 去重**（`rules.jsonl` 是双份结构），
      且匹配式要**点名机构别名**（`AAP` / `美国儿科学会` / `世界卫生组织`），不要用裸 `WHO`。
      补 L4 编号前**先证「确实有规则没号」**：分子用去重后的数，分母用全集，并去 L4 canonical 复核一遍。
    command: >
      `python3 -c "import json,collections;rows=[json.loads(l) for l in open('kb/l3/candidates/rules.jsonl',encoding='utf-8') if l.strip()];print(collections.Counter(r['rule_id'] for r in rows).most_common(3))"`
      （预期每个 rule_id 计数为 2）
    forbidden: >
      不许用**行数**代替规则条数；不许用裸子串 `WHO`/`AAP` 做匹配（英文词会误配）；
      不许在没证实「有规则没号」之前就往 L4 补号 —— 那会重复发号并污染台账
    reopen_when: >
      `rules.jsonl` 不再是双份结构（带号行与不带号行合并），或 L4 出现真正未发号的规则
