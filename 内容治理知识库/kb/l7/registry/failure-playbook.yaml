      但权威库的政策明写核对算式是 **`valid_until = effective_from + half_life_days`**
      （`kb/l3/registry/half-life-policy.json → validation.valid_until_formula`），
      且视图**已经把 `effective_from` 带出来就是为了当场核对**。
      视图的 `created_at` 是**刻意**取「派生视图条目的生成日」（`gen-host-library.py:947-949` 有明确论证），
      与 `effective_from`（策略基线日）本就不是一回事 ⇒ 只要视图在基线日之后重生成，W014 就按条数全量报。
      2026-10-10 重出视图后实测 **W014 ×509**（旧视图 09-29 生成，两者恰好相等，所以从未暴露）。
    evidence:
      - "kb/.work/gen-host-library.py:947-949 注释原文：「created_at 是『本条目（派生视图条目）的生成日』…它随重生成更新是**对的**；有效期不由它决定 —— 由权威库的 valid_until 决定」"
      - "kb/l3/registry/half-life-policy.json → validation.valid_until_formula = 'valid_until = effective_from + half_life_days'"
      - "kb/.work/gen-host-library.py 同段注释：『也把 effective_from 带出来…带上它，effective_from + half_life_days 就能在条目上当场核对』"
      - "实测：旧视图 created_at=2026-09-29 = 基线日 ⇒ 不报；新视图 created_at=2026-10-10 ⇒ W014×509"
    owner: 体检器（~/.dsh/plugins/dsh-kb）维护者
