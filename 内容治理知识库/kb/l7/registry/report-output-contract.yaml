  owner_report_verbatim: '「刚发送了这个：Our M5 is the safest breast pump on the market and FDA approved. Totally pain-free 守衡回复我有3个问题，实际飞书文档只落一个问题，这是bug，修复下 后续两端数据必须对齐」

    '
  measured_first: '**先核事实：Owner 看到的现象是真的，但原因不是"没写进去"。** `docs +fetch` 回读那一单的云文档（`docx/AHs9daR5IohgdUxSMSZcW8ECnHu`）—— **三条都在**，是三个独立 `<p>`，`问题 1/2/3 ｜ H05/H06/H07` 齐全、3 个「建议」标签齐全。 ⇒ 是**写进去了但读不出来**。

    '
  root_cause: '**版式**。逐条块首行是 `1.【类别】…` —— `1.` **后面紧跟 `【`（没有空格）**， markdown（CommonMark）**不认成有序列表** ⇒ 三条各是**一堵整段**：实测 776 / 569 / **1127** 字， 且**没有任何标题层级**（不进文档目录）。云文档第一屏只看得见第 1 条，另两条埋在字墙里 —— 现场说「只落一个问题」完全合理。**这是渲染缺陷，不是数据缺陷。**

    '
  what:
  - 拆成「**内容一套、版式两套**」：`_item_fields()` = **唯一取值点**（码/类别/命中/原因/依据+条款号/锚点+指纹/判定/建议/L0直链）
  - '`_prd_block()` = **回执**版式，逐字照 PRD §5.3.3（`N.【类别】` + 缩进 `**原因**/依据/锚点/判定/建议`）—— 判据 ②③④ 继续盯着它'
  - '`_doc_block()` = **云文档**版式：`### 问题 N ｜ 码 ｜ 类别`（飞书 = Heading 3 ⇒ **进目录**，打开就数得出 3 条、点哪条跳哪条）+ 每格一行 `- **格**：值`（无序列表，飞书认）'
  - '报告加**索引表**（`| # | 规则码 | 类别 | 条款号 |`）——「一眼数出几条」在版式上再兜一道'
  - '**删掉 `_item_blocks()`** —— 它同时服务两种介质，正是这次事故的结构性原因'
  alignment:
    owner_ask: 「后续两端数据必须对齐」
    principle: '**值同源、计数同源、条数同源** —— 两端不许各算一次'
    single_sources:
    - 条数：两处都取 `len(findings)`（回执 `共发现 N 处` / 报告条目数 / 落表「问题数量」）
    - 计数：`_category_counts()` = **唯一计数出口**；`_summary_lines()` = **唯一汇总文本**（回执与报告共用）
    - 值：`_item_fields()` = **唯一取值出口**（两种版式只是排版）
    judges:
    - 自证 ⑥e：回执条数 == 报告条目数 == findings 数（**在 ≥3 分支上验** —— 出事的就是这条分支）
    - 自证 ⑥e2：两端分类汇总**计数之和**各自都等于 N
    - 自证 ⑥f：同一问题的六格**值**在两种版式里**逐字一致**（**在 n≤2 分支上验** —— PRD 规定 ≥3 时回执只出汇总、本来就没有逐条内容；第一版把 ⑥f 写在 ≥3 上，判据当场红）
    - 自证 ⑥f2：反向对照打在**值**上（第一版打在标题上 ⇒ 自己不红，等于没验）
    - '**运行期**（不只自证）：`tools.mjs` 比对「重渲染后的回执条数 / `issue_count` / 报告文件里 `^### 问题 N ｜` 条数」，不一致 ⇒ `align_note` ⇒ 日志 + `report_detail` ⇒ `agent.mjs` 拼进表行「问题分类汇总」，**表里看得见**'
  verified:
    selftest: '**20/0**；变异测试：把报告改成只渲染 1 条 ⇒ ⑥e 与运行期核对**都会红**（`⚠️ 两端条数对不上：结构化=3 ｜ 报告里 1`）'
    render: '同一份正文投进飞书后回读：**`<h3>`×4**（问题 1/2/3 + 溯源节）、**`<li>`×24**、`<table>`×4； 改版前是 **0 个列表、3 个段落**，最长单块 **1127 字**；改版后最长 **502 字**（且是列表中的一项，不是整段）。

      '
    user_doc_in_place: 'Owner 手上那个链接（`docx/AHs9daR5IohgdUxSMSZcW8ECnHu`）**原址整篇覆盖、链接不变**； 覆盖用**表行里取回的逐字原文**（82 字节、**结尾没有句号**）—— 第一版覆盖时我用了带句号的版本，「判定对象（逐字）」那一格就对不上，**自己发现后重刷了一次**。

      '
    other_chain: '顺手核了**评审链**那份报告（`docx/S3yMdN4k4oLtUdxrgcecPrVBnrb`）：`<h2>`×3 / `<h3>`×3（每题一个）/ `<li>`×44， 最长段落 78 字 —— **它本来就是好的**。⇒ 字墙是 **P0 渲染器独有**的缺陷，不是全链问题。

      '
    regression: 守衡侧 test_agent **114/0**、verify_cards **266/0**、7 个单测全绿；库侧 skills_check 0 / layers_check 0 / AGENTS.md 无漂移；守衡 已重启（pid 61876）
  files:
  - kb/l5/p0_fastpath.py
  - tools/agent/tools.mjs
  - tools/agent/agent.mjs
  rollback:
