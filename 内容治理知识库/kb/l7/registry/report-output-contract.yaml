  reading_of_prd_12: '§12 把「**P0 层响应 ≤1s**」与「**报告生成 ≤30s**」定成**两条各自独立的指标** ⇒ 两件事**不许互相拖累**。「先响应」由 `runSubmissionGate` 的**回执卡**满足 （`notify(ackMessage(...))` 在跑链**之前**发出），P0 判定在它之后（实测 9.8~27 ms）， 云文档在判定之后建 —— 三步各归各的预算，谁也不占谁。

    '
  what:
  - P0 快路**出报告**：本地 `.md` + 飞书**云文档**，并把真链接填进**回执**与**表行「报告链接」列**
  - 回执与报告**共用同一份渲染**（`_item_blocks` / `_provenance`）—— 同一条问题两处各写一套迟早对不上
  - 「≥3 条只出分类汇总」是 PRD 对**回执**的约束；**报告里必须是全量逐条**，否则「查看完整问题清单」这句话是假的
