    root_cause: '`layer_freshness.judge()` 需 `change_state` + `input_watermark` 做水位交叉验证，而层引擎落章里 大多没有这两字段 ⇒ 它转读 sidecar `kb/l7/registry/layer_run_freshness.json`。而 `measure()` ——sidecar 的**唯一写入者**——**全库没有任何生产调用点**（只有 `layer_freshness.py` 自己的 CLI 与 `seed_freshness_sidecar.py` 的注释）。实测：L4/L5/L6 的 sidecar 停在 **10-02 13:22** （`provenance=measured`），judge 拿它算年龄 ⇒ **31.2 小时 > 24 小时 ⇒ 永久拒答**。 `seed_freshness_sidecar.py` 早就承诺「之后每一跑都走 `measure()`，seeded 会被真观测覆盖」 —— **该承诺从未兑现**。'
    defect_4_run_at_run_age:
      what: '`layer_freshness.py` judge(): sidecar 分支**只更新 `run_age`、不更新 `run_at`** ⇒ 同一份输出里 `run_at=当天08:31` 与 `run_age=31.2h` 自相矛盾（排查时把作者本人带偏）。'
      fix: '`run_at` / `run_age` **同源更新**；另加 `run_at_source`（`落章` / `落章文件 mtime` / `sidecar 观测（provenance=measured）`）让时间来源可见。'
    defect_2_time_source:
      what: judge 无条件采信 sidecar 的 `executed_at`，而 sidecar 的 measured 条目**永不被刷新** ⇒ 旧时间压住新落章。
      fix_v1_rejected: 第一版改成「落章无条件优先」——**实测不够**：L1/L3/L5/L6 的落章本身停在 10-02 21:02（23.6h），24 分钟后照样翻红（**幂等层跑完不留新落章**）。
      fix: 改为**取较新者**：落章时间 vs sidecar 时间，谁新用谁；且**只认 `provenance=measured`** 的 sidecar 时间（`seeded_from_disk` 是补记、非观测，见 seed 脚本自述，**不认**）。
    defect_1_no_measure_caller:
      what: '`daily_sync.py` 逐层写档后**不落新鲜度观测** ⇒ 幂等层跑完不留任何『跑过』的证据 ⇒ 判据拿旧时间判陈旧。'
      fix: '`daily_sync.py` 加 `_freshness()` + `observe()`：每层**测前**取 `output_fingerprint` / `watermark_digest(current_watermark)`，`kb_pipeline --apply` 跑完**立刻调 `measure()`** 落真实观测（`provenance=measured`）。参数取法照 `layer_freshness.py` 自己的 `measure` 子命令（`:521-526`）。失败只告警、不拖垮日更。'
    new_attack_surface:
      what: '**修复2 引入的新信任面**：「取较新者」会**采信 `provenance=measured` 的 sidecar 时间** ⇒ **任何能写 sidecar 的东西，都能让 8 层瞬间「变新鲜」、绕过整道新鲜度闸门**。 实证：2026-10-03 20:38:17 有**库外**代码把 L1/L4/L5/L6 的 sidecar 写成 `provenance=measured`， note「评审链层前置补观测（本单 REV-202610031826-momcozy-pump）」（**该字符串在库内任何代码里 grep 不到**），并留备份 `layer_run_freshness.json.bak2-20261003-2038`。 ⇒ **补记被标成强档**（`measured` 的定义是「包住一次真运行测出来的」）。'
      tightening_pending: '**已做（2026-10-03 当日）**：`layer_freshness.py` 新增 `_trace_exists()` —— 采信 `provenance=measured` 的 sidecar 时间**之前**，先拿它的 `run_id` 去核对一次真运行； 核对不上 ⇒ **不采信该时间**（退回落章时间），并把 `sidecar_time_rejected` 如实写进 judge 输出。'
      tightening_criterion: 认三种**精确**形态：`kb/l7/runs/<rid>.json` ／ `kb/<layer>/runs/<rid>.json` ／ `kb/l8/runs/<rid>-l0-align.json`。 ★ **不许用通配**（第一版加过 `<rid>-*.json` 兜底，实测**把洞又打开了**：那条伪造的 `<rid>` 正好有 `kb/l7/runs/<rid>-L4.json` 这类层记账件 ⇒ 通配一匹配就放行；且它的层侧产物是 `-dryrun.json` 干跑件，而库规明写「干跑档不算跑过」）。
      tightening_verified: 实测 `_trace_exists`：伪造 rid `REV-202610031826-momcozy-pump` → **False（抓得住）**； 日更 rid `20261003-2055` → True；旧 `20261002-1330-L4` → False。 judge 八层仍全 fresh、新鲜度闸门 exit 0；L7 的旧观测被拒后**优雅退回落章**（仍新鲜）—— `daily_sync.py` 已配套改为用 `_newest_l7_run()` 取**真产物名**当 rid，避免它白落。
    verified: 修复后实测：`judge()` 8 层全 `fresh=True`；`review_freshness_gate.py` **exit 0（放行）**。 修复1 的效果须**跑一次日更**才可见（本批已触发并在跑后核 `provenance=measured` 是否逐层落地）。
    rollback: '`layer_freshness.py`：把 sidecar 分支还原为「无条件用 `_sc[''executed_at'']` 覆盖」并去掉 `run_at_source`；`daily_sync.py`：删 `_freshness()` / `observe()` 及循环内两处调用。'
  three_more_fixes_20261003:
    why: 承接 `freshness_ledger_fix_20261003`，按用户裁定把剩下的 2/3/4 三条待办做完（第 1 条的 L0 未对齐已查清并更正 —— 见 `l0_not_aligned_finding`）。
    fix2_expose_stale_copy_age:
