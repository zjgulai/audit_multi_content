    - 拿掉 P0 override ⇒ 4 条精确变红
    - 边界判成 `>` 而非 `>=` ⇒ ①a/①c/⑥b 精确变红
    - 硬编码阈值（忽略政策覆盖）⇒ ⑥a/⑥b 精确变红
    - 政策路径算错（多退一层）⇒ ⑨/⑨b 精确变红
    workflow_smoke: ★ AGENTS.md 强制尺子 `kb/l8/workflow_smoke.py` **exit 0 全绿**（S1–S5 五段契约齐；S5 只有一条黄：L7 的 skill 证据是自述档）
