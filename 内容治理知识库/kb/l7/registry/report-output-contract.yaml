fix_20261016_p0_confidence:
  at: 2026-10-16
  owner_ruling_verbatim: 'Owner 逐字（第 1 句）：「按照prd： P0 层级规则不适用置信度分流，命中即 BLOCK，置信度记为 1.0。模型侧应该也是1，最终出1」；
    （第 2 句，**以后一句为准**）：「**命中知识库P0就是block，置信度就是1. 这时候不用合并模型侧的置信度，这条修复后落库**」。

    '
  prd_verbatim: 'PRD §6.6 末句（rev141，逐字）：「**P0 层级规则不适用置信度分流，命中即 BLOCK，置信度记为 1.0。**」

    '
  case: '**同一个数，两种来源在 P0 行上顶着。** 置信度是「两侧各出一个、对外只出一个数」
    （`fix` 见 `交付-置信度两侧合并-20261015.md`）：库侧那个数由引擎算、P0 快路直接写 1.0；
    模型侧那个数由 `modelConfidenceOf` 从命中结构**派生**；合并时取更保守一档。
    P0 命中时库侧是 1.0（direct），模型侧只要有命中就是 confirm ⇒ 取保守 ⇒ **0.85**，
    于是出现「**结论 BLOCK ／ 置信度 0.85**」——与 §6.6 那句直接打架（0.70–0.89 那一档写的是 REVIEW）。
    实测（2026-10-16 全表）：15 行 P0/BLOCK 里 1 行显示 0.85（行66 是**非 P0** 的 BLOCK，另案），
    置信度台账 `confidence-merged.ndjson` 里 **8 条** 是「kb 1.0 ＋ 模型侧 confirm ⇒ 合并 0.85」。

    '
  root_cause: "**把「P0 不适用分流」只落在库侧，没落在合并层。** 引擎侧（`kb/l7/review-engine/core/confidence_flow.py::route()`）
已经明写 `P0 in tiers ⇒ applies=False`，但**合并层**（`tools/agent/dual_track.mjs::mergedConfidence`）
原先没有这一档 —— 它把两侧一律拉进「取更保守」，于是模型侧的一个**派生**档位
就能把一个**确定性匹配**（正则/关键词命中）的读数压下去。
★ 与之同类、同一天也修掉的另一处：**「1.0 只是 direct 档的一个取值」** ⇒ 下游挑不出 P0 行
（豁免、口径说明都要它）⇒ 现在 `bandOf(1) === 'p0'`，与 `direct`（0.90–0.99）分开。

"
  fix:
  - file: tools/agent/dual_track.mjs
    rule: '① `bandOf()`：**`1.0` 单独成档 `p0`**（不再与 direct 0.93 混）；`CONF_REPRESENTATIVE.p0 = 1.0`。
      ② 新增 `p0HitOf({res, kb})`：判「这一单是不是 P0 命中」——三个来源全是**引擎读数**：
      `res.p0_fastpath` ／ `kbSideOf().source === ''p0_fastpath''` ／ 引擎 JSON 的 `tier_trace.P0 > 0`
      （`review_engine.py` 明写「数**命中的**，不是数拦住的」）／ 库侧那个数本身是 1.0。
      ③ `mergedConfidence()`：**P0 那一支排在最前、且不进「取更保守」** ⇒ 值恒 **1.0**、
      `band: ''p0''`、**`model_band: null`（模型侧不参与合并）**，basis 逐字写 PRD §6.6 那句 ＋
      「不合并模型侧」。
      ④ `modelConfidenceOf({…, p0Hit})`：P0 命中时**不派生**模型侧档位，如实记「未参与」
      （**不是**记 1.0 —— 记 1.0 会让台账看起来像"模型侧也算出了一个 1"）。

      '
  - file: tools/agent/agent.mjs
    rule: '算 `const p0Hit = p0HitOf({ res, kb: kbSide })` 并传进 `mergedConfidence({…, p0Hit})`；
      双轨日志因此印成 `置信度(两侧合并)=1 [p0]（库侧 p0 / 模型侧 未参与）`。

      '
  - file: tools/agent/review_publish.mjs
    rule: '`machineNumbers()` 的 P0 口径行改成：**置信度按 1.0 记（PRD §6.6 那句逐字）｜不合并模型侧的置信度**。
      表侧原有的 `p0Exempt`（P0 不被合并数覆盖）**保留** —— 它是同一件事的第二道保险。

      '
  - file: tools/batch_review_runner.mjs
    rule: '回填改**严格模式**（`{ strict: true }`）：常规批跑**只认本轮 `publishedRowId`**，
      认不到就**不写**并出声（`--backfill` 历史补写那条老路保留"猜"）。
      依据是同一批 80 行逐字段核对抓出来的：猜行会把**另一遍/上一轮**的字段搬进采集表
      （行22 搬回上一轮的占位话术；行30/33/34/48/52 的数与本轮报告对不上）。

      '
  verify:
    judgement: node tools/agent/dual_track.mjs --selftest ｜ node tools/test_agent.mjs ｜ node tools/agent/review_publish.test.mjs
    checks: '㉕a P0 ⇒ 1.0 且**模型侧不参与**（`model_band === null`）｜㉕a1b 同一份输入换成非 P0 的 0.95 ⇒ 必须回 0.85
      ｜㉕a2/㉕a3 反向对照（这一档只在 P0 上生效；`1.0` 本身即 P0 记法）｜㉕a4 模型侧记「未参与」而不是 1.0
      ｜㉕b `bandOf(1)===''p0''` ／ `bandOf(0.99)===''direct''`｜㉕c `p0HitOf` 三来源 ｜㉕d P0＋模型侧没跑成仍 1.0
      ｜㉕e **接线**（`agent.mjs` 真把 `p0Hit` 传进去）｜Z45 端到端（真跑 `runSubmissionGate`＋桩：表行参数 `confidence === 1`；
      反向对照非 P0 的 BLOCK 仍 0.85）｜D2 口径行逐字含 PRD 那句 ＋「不合并模型侧的置信度」。
      Z46/Z47 是同一批落的两条：PASS 行格内必须是 PRD §5.3.2 结论行；回填严格模式（含反向对照）。

      '
    count: '`dual_track --selftest` **115/0 → 124/0** ＋ 抽取 **45/0**｜`test_agent` **240/0 → 247/0**｜`review_publish.test` **35/0**｜
      `scene.test` 18/0｜`ocr_claim_gate --selftest` 19/0｜`kb/l8/workflow_smoke.py` **rc=0**。'
    mutation: '把 `mergedConfidence` 的 P0 那一支删掉 ⇒ ㉕a 立刻红（回落到 0.85）；把 `modelConfidenceOf` 的
      `p0Hit` 那一支删掉 ⇒ ㉕a/㉕a4 红；把 `agent.mjs` 传参那一行删掉 ⇒ ㉕e 红。
      '
    wiring: '判据在守衡仓（`tools/agent/*.test.mjs` ＋ `tools/test_agent.mjs`），
      随 `node tools/test_agent.mjs` 一起跑；本登记件同时记进 `~/.dsh/AGENTS.md` 的「双轨合并」一节。

      '
  honest_limits:
  - '**模型侧仍然照跑照出条目** —— 这一档只是**置信度**不合并；模型侧的命中照旧进问题清单与报告
    （P0 行的「问题数」仍是并集口径：库侧命中 ＋ 模型侧命中 － 重叠）。'
  - '**非 P0 的 BLOCK 仍是 0.85**（行66 那一类）：库侧 0.93 direct ＋ 模型侧 confirm ⇒ 取保守 0.85，
    而结论是 BLOCK ⇒ 仍与 §6.6 的「0.70–0.89 出 REVIEW」字面不符。本件**只裁了 P0 那一档**，
    非 P0 的 BLOCK 要不要跟着压结论（= 降红线）或另立口径，**等 Owner 一句话**。'
  - '标定仍未接：这个数仍是 `heuristic_not_calibrated`，合并数的标定/回归尚未接
    （`kb/l8/calibrate_confidence.py --from-merged` 能读，但没按 material_sha8 回写库侧台账）。'

