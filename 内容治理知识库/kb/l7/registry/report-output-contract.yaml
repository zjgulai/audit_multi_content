  what: 把 PRD §6.3 的**四层**落进代码。改前引擎里**只有 `priority_tier == "P0"` 一条分支**，两个生产者各自就地硬编码「不是 P0 就是 P1」——`review.py::_finding_to_risk_item` 写 `"P0" if "P0" in layer else "P1"`（**看层文案里有没有「P0」二字**，不看规则的 `p_level`），`with_kb_evidence.py::_to_risk_item` 同样写法、而它拿到的 finding **根本没有 `layer` 键 ⇒ 恒为 P1（连 P0 都报 P1）**。⇒ `p_level=P2` 的 11 条、`p_level=P3` 的 4 条规则命中了也只报 P1；PRD §6.3 第二层（P1 安全准确性·语义）与第三层（P2 通识常识·多模态）**在代码里没有位置**，P3「只出建议、不改结论」也没有位置；PRD §7.2 九域里 7 个域挂 P1/P2 ⇒ 判不了。
