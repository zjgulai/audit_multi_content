    zero_slack: '**零余量**：陈旧阈值 24h（`kb/l7/scripts/daily_health.py` 第 284–286 行）， 日更每 24h 一次（03:30）⇒ **日更失败一次，次日同一时刻起必然全量降级** （2026-10-07 当天守衡 5 条评审的知识库侧全部失效，全部由模型侧单独给结论）。
