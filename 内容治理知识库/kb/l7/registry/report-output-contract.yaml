prd_contract:
  bitable_fields:
  - 内容 ID
  - 产品线
  - 渠道
  - 内容类型
  - 送审版本
  - Agent 结论
  - 置信度
  - 问题数量
  - 问题分类汇总
  - 报告链接
  - 人工复核人
  - 复核结论
  - sign-off 人
  - 发布时间
  - 状态
  bitable_status_options:
  - 待审
  - PASS
  - REVIEW
  - BLOCK
  - 已修改
  - 已发布
  bitable_note: '线上表 tblCXPQVzfFWWCon 的 15 个字段与 6 个状态选项**与本清单逐字一致** （2026-10-02 只读核对）。⇒ 表是照 PRD 建的；差错应在**值**，不在字段。

    '
  bitable_target:
    base_token: RY2UbCRjXaeeWwscUPScVN5AnQc
    table_id: tblCXPQVzfFWWCon
    view_id: vewhS7Rwx0
    wiki_token: Lntdw8XqmifewjkdEckcXYH8nOV
  report_link:
    trigger: '**问题数量 ≥ 3** 时才生成完整报告并返回链接'
    below_threshold: 问题数量 1–2 个：**逐条输出**（不生成报告链接）
    content_requirements:
    - 完整问题清单，每条包含：维度、位置、问题描述、原因、依据文档链接、修改建议
    - 按维度分组展示，便于按类别处理
    - 支持导出为飞书文档或 PDF
    - 报告链接有效期 ≥ 30 天，**存于飞书云文档**
    latency: 问题 ≥ 3 时，报告链接生成 ≤ 30 秒（验收标准表）
    retention: 所有审查记录保存 ≥ 1 年（验收标准表）
    threshold_rationale: '阈值 3 的依据：单次审查中 3 个及以上问题已超出用户可快速浏览和记忆的范围。 采用「摘要 + 钻取报告」模式。阈值支持配置，建议保留 3 作为默认值。

      '
  confidence_routing:
    kind: numeric
    bands:
    - range: '>= 0.90'
      action: 直接输出结论（PASS / BLOCK）
    - range: 0.70 - 0.89
      action: 输出 REVIEW，标注「建议人工确认」
    - range: < 0.70
      action: 输出 REVIEW，标注「不确定，建议人工重点看」
    exception: P0 层级规则不适用置信度分流，命中即 BLOCK。
  three_state_output:
    PASS: 一句话总结，说明未发现已知底线风险；动作：转交对应 sign-off 负责人。
    REVIEW:
      n_le_2: 逐条输出（维度 / 问题描述 / 原因 / 依据链接）
      n_ge_3: 只输出分类汇总（各维度问题数量）+ 报告链接 + 转对应团队
    BLOCK:
      n_le_2: 逐条输出（维度 / 问题描述 / 原因 / 依据链接 / 建议）
      n_ge_3: 只输出分类汇总（各维度问题数量）+ 报告链接 + 修改后重新提交
  issue_summary_semantics: '「问题分类汇总」按 PRD = **各维度问题数量**（验收标准表：「分类汇总（各维度问题数量）」）， 形如「合规类问题：3 个」。

    '
  version_field:
    field: 送审版本
    prd_defines_format: false
    note: 'PRD 全文只在两处出现「送审版本」：§8.2 当字段名、§9 当 sign-off 判据 （「发布版本与送审版本一致」）。**PRD 未定义其取值格式。**

      '
    adopted_rule: PRD 未定义 ⇒ 从 v1.0 起（用户 2026-10-02 裁定）
  content_id:
    prd_quote: '"review_id": "CR-20260922-0001",

      "content_id": "AD-20260922-001",

      "content_version": "v1",

      '
    prd_defines_format: false
    note: 'PRD 全文只在两处出现「内容 ID」：§5.4 这个示例 ＋ §8.2 的字段表。**PRD 没有写它怎么生成**； 但从示例读得出语义分工：`AD-<日期>-<序号>` 是**业务编号（恒定）**，`content_version: v1` 是**随内容递增的版本号** —— 只有这样 §10「审核记录绑定内容版本」才成立。

      '
    kb_side_before_20261003: '实现走的是另一套，且**同一次审查存在两个不同的「内容 ID」**：引擎 JSON = `text-<sha256 前 12 位>`（with_kb_evidence.py:210），飞书表行 = `AUTO-<content_version 前 12 位>`（feishu_publish.py:334）。两者只共享后 12 位 ⇒ 按 ID 直接对不上，只能人工比 12 位。

      '
    kb_side_after_20261003: '**前缀已统一为 `AUTO-`**：唯一生成规则落成 `with_kb_evidence.py:_auto_content_id()` （两处调用点共用，不再各写一份），`kb_api.py` 的字段说明同步。 ⇒ 引擎 JSON / 报告正文 / 飞书表行三面同值。

      '
    still_open: ID 的**语义**仍未按 PRD 走 —— 见 gaps_unresolved 的 GAP-RO-6。
