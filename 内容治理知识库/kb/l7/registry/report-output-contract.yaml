fix_20261010_c10_residue_and_l1_rechunk_rootcause:
  date: '2026-10-10'
  goal: '任务拆解 **目标 5 的根因定位** —— 顺着 C9 挡下的 1774 条切片查到根因，并提出改动单（我 2026-10-10 独立推进；Owner 硬约束「**不要影响工作流**」）'
  ★★_根因: >
    不是"料不好"，是**我们自己 2026-10-08 的一次修复造的**：
    `kb/l8/rechunk_l1_segments.py` 为解决「巨段被 L6 的 `oversize_gt_8000` 整份挡住」，
    按 `\n` 切行后重新分组到 **`TARGET = 4000`** 字符、锚点改 `#l.<起>-<止>`。
