# ══════════════════════════════════════════════════════════════════════════════
# 事故：重启掐断在跑的评审（2026-10-17 14:22）—— 已加 in-flight 闸门
# ══════════════════════════════════════════════════════════════════════════════
incident_20261017_restart_killed_inflight_review:
  date: '2026-10-17'
  severity: 高（**对外可见**：用户收到回执卡，但永远等不到答案）
  what: >-
    Owner 报「飞书的守衡怎么不回复了」。查日志：14:22 收到一条 p2p 素材（listing），
    回执卡发出、P0 快路判 BLOCK（H02,H05,M03）、建议生成跑完（6852ms），
    **然后在 `[+151.467s]` 收到 SIGTERM** —— 我在那一刻做了本轮第 12 轮改动后的重启。
    日志逐字：`本次统计：事件 2 / 已回答 0 / 已发送 0 / 跳过 1 / 失败 0 / 未捕获 0`。
    用户重发同一条 ⇒ 同一 msg id ⇒ `不回复（duplicate）` ⇒ 看起来就是「守衡死了」。
  cause: >-
    `restart_shouheng.sh` 的闸门只拦「没 --yes / 没有理由 / 凭证过期 / PID 变了 / 没先读一遍」，
    **没有一条问「现在有没有消息正在处理」**。而 `kickstart -k` 是无条件杀进程。
  fix:
    file: tools/restart_shouheng.sh
    what: >-
      新增读数与拒绝：`daemon-run.json` 的 `events > (handled+skipped+failed+uncaught)`
      ⇒ **有消息还没走完** ⇒ `--yes` 默认**拒绝**，必须显式 `--force-inflight` 才放行。
      报告里那行读数常驻（`正在处理中  无（收到 0 ／ 走完 0）`），不只在拒绝时才出现。
    why_this_formula: >-
      正常跑完时两边相等；重复消息记 `skipped`、异常记 `failed/uncaught`，
      都不会让它长期为真；重启后计数器归零，**不会留下陈旧状态**。
    verified: >-
      `bash -n` 过；`--check` 打 `正在处理中  无（收到 0 ／ 走完 0）`；
      `--yes --no-kick`（不真重启）凭证校验照常通过 —— 证明这条闸门没把正常重启流程改坏。
  still_broken_for_owner:
    - '那条素材（msg `om_x100b62050ea294a0cf902c7ff7a8d55`）**没有答复**，补发队列 0 条 ⇒ 不会自动补。'
    - '用户**重发一次**即可（新消息 = 新 msg id，不走 duplicate）；旧 msg id 重发仍会被跳过。'
  honest_limits:
  - >-
    **判据依赖 `daemon-run.json` 的计数器**，而它由守衡进程自己写。若进程整个卡死（不写状态），
    读数会停在最后一次 —— 那时 `inflight` 也可能不准确。它拦的是「正常在跑时被重启」，不是「进程假死」。
  - >-
    这条闸门**只管重启**。别的杀进程方式（`kill -TERM`、崩溃、机器重启）它一概拦不住 ——
    `kill -TERM` 那条另有一条更老的规矩（会永久静默），写在脚本头部。

