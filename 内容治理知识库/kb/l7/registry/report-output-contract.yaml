prd_12_verbatim_20261005:
  doc: 内容审查 Agent PRD v1.2
  wiki_token: NB55wAq8liEOdKkquL2cgtPEnmg
  docx_token: PXfBdjTwFokEQixtmTscqm7knNh
  revision_at_read: 36
  read_at: '2026-10-05'
  read_via: lark-cli docs +fetch --scope keyword（user 身份，刘华丽）
  table:
  - row: 性能
    text: 单条文字 ≤ 10 秒；图片 ≤ 20 秒；视频 ≤ 60 秒
  - row: 并发
    text: 支持批量扫描 100-500 条
  - row: 可用性
    text: 飞书群 @Agent 响应时间 ≤ 5 秒
  - row: P0层响应
    text: ≤ 1 秒（关键词/正则匹配）
  - row: 报告生成
    text: 问题 ≥ 3 时，报告链接生成 ≤ 30 秒
  kou_jing_verdict:
    conclusion: '**「性能」行 = 单条判定时延（拿到结论的时间），不是回执时延。**'
    basis: '同一张表里，凡是要表达「回执/响应」的行都单独写了「响应时间」（可用性行）或 「生成」（报告生成行）；「性能」行没有任何限定词，主语是单条内容本身。 ⇒ ≤10/20/60 秒指的是**从收到素材到得出三态结论**。

      '
    consequence: '这一条把问题性质定死了：**光加快回执不够**，必须让「得出判定」本身进秒级。

      '
  prd_own_architecture_quote:
    quote: 先用正则匹配敏感词（毫秒级响应），再调用 NLP 模型分析语义（秒级响应）。
    layered_flow: '第一层 P0 红线快速扫描（关键词/正则，毫秒级）→ 命中即 BLOCK； 未命中进第二层 P1 安全与准确性审查（**大模型语义理解**）→ 第三层 P2 通识常识 （大模型多模态）→ 第四层 P3 措辞建议（不影响结论）→ 汇总三态。

      '
    why_decisive: 'PRD 自己给 NLP 层的预期是**秒级响应**，不是分钟级。⇒ PRD 的指标**不是不可达**， 不可达的是**当前实现方式**：现在这一步是「spawn 一个通用 agent 让它自己探索库」 （实测 63 次工具调用、生成 259.8 s、单次全库递归 grep 42 s）， 而 PRD 要的是「一次模型调用」。差的是**执行形态**，不是判据。

      '
  correction_to_earlier_advice:
    what: '此前我把「并发 100-500 条」判成「与全局单槽认领直接冲突 ⇒ 必须重做并发模型」。 **看过原文后更正**：原文是「支持**批量扫描** 100-500 条」—— 指的是**一个批次**里 扫 100-500 条，不是 500 个素材各开一个会话。

      '
    so: '只要**一个批次在一个会话内跑完**（一次认领、一次锁），单槽与它**不冲突**， 防双计那套不动。⇒ 该项**不需要重做并发模型**，此前那条建议说过头了。

      '
  files:
  - kb/l7/registry/report-output-contract.yaml
  rollback:
  - kb/l7/_backups/report-output-contract.yaml.bak-20261005-prd12
