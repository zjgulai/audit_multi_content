decision_20261010_baseline_table:
  what: '台账里的数字必须能回源。任务详情表 G6（10/12–10/16「文字链路首次跑通」行） 同一个「评审单」先后出现过 **112 / 472 / 562**，同一个「健康分」出现过 **79.3 与 76.7（同一台引擎、只差采样时点）**，覆盖率一个报 0.92、一个报「无数据」。 ⇒ 病根**不是算错，是没有尺子就开始量**：数字没有采样时点、没有生成命令、没有指纹。

    '
  artifact:
    generator: kb/l8/baseline_table.mjs
    outputs:
    - kb/l7/reports/baseline-<YYYYMMDD-HHMMSS>.md
    - kb/l7/reports/baseline-<...>.json
    - kb/l7/reports/baseline-<...>.json.sha256
    discipline: '**只读 kb/l0…l7**，只写 `kb/l7/reports/`；**不新增计划任务**（不进 launchd / 日更编排）—— 要不要每天自动生成由 Owner 定，没定之前加自动任务 = 静默改流水线。 `.md` 走 `/tmp` → `/bin/cp` → **回读校验**（信封闸门纪律）。打不开引擎 ⇒ **退出码 3 拒答**。 **必须 import 加载器同一台引擎**（`dsh-kb/lib/kb.js::check()`）—— 另写一份实现 = 又造一把尺子，正是本产物要消灭的东西。

      '
  judges:
    A_健康分: '宿主派生视图 `kb/view`，由 `check()` 计算。**它与 `daily-health-*.md` 的 GREEN/红 不是同一把尺子**（后者判 L1–L7 流水线通不通）⇒ **两个都引、分开写**， 不许合并成一个「体检通过」。

      '
    B_评审单: '**一次评审运行 = 一单**，即 `kb/l7/runs/index.jsonl` 里 `source == review_machine` 的行数。 **数的是运行次数，不是素材数** —— 同一段文案送审三次 = 三单。 换成「一素材 = 一单」需要先给 index.jsonl 补素材 ID 字段，否则复现不出来。

      '
    C_流水线: '`kb/l7/reports/daily-health-latest.json` 的 health / gate_*。

      '
  why_time_matters: '立项当天实测：同一台引擎，12:04 采样 **76.7**、12:15 采样 **79.3**，**两次都真**。 因为 `kb/view` 是被持续重建的**派生视图**（当天实测 mtime 12:11）。 ⇒ 引这个数**必须连 `baseline_id`（采样时点）一起引**，否则下一个人对不上账。

    '
  verify:
    rule: '`node kb/l8/baseline_table.mjs --print` 只打印不写盘；落盘后 `shasum -a 256 -c baseline-*.json.sha256` 回核。'
    self_checked_20261010: 落盘 3 件、回读逐字节一致、`shasum -c` OK；宿主读取器读 `.md` 为明文（无 4096 字节信封）。
  pending_owner:
  - 「一单」是否就按「一次评审运行」定？（另两个可选口径：一素材 = 一单 / 飞书登记表一行 = 一单）
  - 两个健康分口径进表时是否分开写（建议：分开写）？
  - 本产物要不要挂进日更自动跑（建议：先不挂，人工按需跑满一周再定）？
