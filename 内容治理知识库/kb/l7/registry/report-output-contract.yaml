  measured_20261010:
    待定稿: '**2780 条**（全部是 `scoped_clause` · E-1 段 · 外部标准库；其余四形态差额为 0）'
    C1_C8通过: '**2733 条**'
    被拦: '**47 条，全部 C6**'
    与另一判据互证: '★ E4（`check_external_standard_supply.py`）独立算出**退场 47 条** —— 两条独立路径同一个数'
    定稿后行数: 'canonical scoped_clause 375 → **3108**'
  ★★_findings:
    '★★★★ 抽查单第一条就查出：**这 2733 条不是条款，是网页的定长切片** —— 结论：**不能签、不能定稿**': >
      证据（全部实测，可复算）：① **2708/2733（99.1%）来自 `url__`（抓取网页）**，只有 25 条来自飞书表；
      ② `char_count` **90.0% 落在 [3800, 4000]**（中位 3912、p10 3868、p90 4000）——定长窗口的签名；
      ③ **84.5% 两端都在词中间**、88.4% 以小写字母起头、94.7% 结尾不是句末标点；
      逐字样本：`ant seat Seborrheic dermatitis, 253, 281` ／ `a couple of trial runs. With child- care in place` ／
      `treme reac- tion of pain when the area is tapped` ／ `n fully immunized or haven't been immunized at all`。
      ④ 而它们的 `evidence_strength` 逐字写着「**实测**：自然语言条款正文（L2 clause 单元，已剥 HTML 外壳）」
      （2206 条）／「**实测**：中文自然语言条款正文」（527 条）—— **这个自述是假的**。
      ⇒ 定稿的后果：评审引擎会拿 `ant seat Seborrheic dermatitis, 253, 281` 这样的**词中间片段**当「外部标准依据」引出来。
      **那比库里没有这一类更坏。**
    '★★ 根因在上游，不在定稿这道闸': >
      1. **L2 的切分**把网页正文按**定长窗口**切开，没按句子/条款边界 —— `char_count` 那个 [3800,4000] 的尖峰就是它；
      2. `kb/l8/l3_clause_actionable.py` 把英文网页切片判成「可蒸」—— 它主要按 CJK 占比判中文，
         **对英文定长切片没有消费者**（我自己建的那个模块，**这是它的假阳性**）；
      3. **C1–C8 全都过**，因为它们只核**结构完整性**（号唯一 / 三件套 / 正文非空 / L2 可解析 / rule_eligible / v0 / 幂等），
         **不核「这段文字是不是一条款」** —— 这正是 `promotion_rule` 要求**人工抽查**的原因。
    '★ 这条链的设计是对的 —— 拦下它的正是人工那道闸': >
      定稿器干跑 → 抽查单 → 人一看就发现不对。**机器闸门全绿、人一眼看出问题** ——
      这不是闸门失效，是闸门**分工**正确。若我当初按「一条命令定稿」，2733 个切片就进库了。
  not_done:
    - '★ **没有定稿**（`--apply` 一次都没对真库跑过）：L4 三个件 sha/mtime 与开工时**逐字相同**（canonical `bb84fec296da` / l4.json `b8a9b2de73ce` / 候选件 `0e1aecde3c91`）。'
    - '★ **没修** L2 切分口径、**没修** `l3_clause_actionable.py` 的假阳性 —— 两件都要单独裁。'
  evidence:
    selftest: '`l4_promote --selftest` **18/18**（含 C1–C8 逐条反向对照 ×9、签字闸门五态 ×5、抽样确定性、C1–C8 清单逐字防改口径）'
    live_proof: '★ 真库实测：无签字件 ⇒ exit 3 拒写；签字件 sha 不符 ⇒ exit 3 拒写；**两次尝试后 L4 三件 sha 逐字未变**。★ 写路径在**临时目标**上验证：签字齐全 ⇒ 追加 **2733** 行（375→3108，全 `status: stable`）—— **与干跑预测逐条一致**，真实 canonical 未被碰。'
    gates: '`workflow_smoke` **0** ｜ `check_source_readonly` **0** ｜ `check_permission_matrix` **0** ｜ `envelope_census` **OK**（抽查单 29166 字节，宿主与 python 读数一致）｜ 引擎测试 **81 passed**'
  honest_limits:
  - '★ 「待定稿 2780 / 通过 2733」是**机器闸门**的读数；**它不是「有 2733 条可用条款」** —— 见上面那条发现。'
  - '★ 抽查单按来源**分层轮转**抽 20 条，不是随机抽样；**它足以暴露系统性形态问题，不足以估比例**（比例要另做统计抽样）。'

