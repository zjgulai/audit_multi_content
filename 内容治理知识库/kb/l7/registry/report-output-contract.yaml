applied_20261010_bitable_stats:
  date: '2026-10-10'
  goal: '任务拆解 目标 21 ——【补·PRD §8.2】多维表支持按品线 / 渠道 / 风险类型统计，并能按 PASS/REVIEW/BLOCK 筛选导出'
  what: '新增 `kb/l8/bitable_stats.py`（只读）。三条：① **统计走飞书侧云端聚合**（`base +data-query` LiteQuery，服务端在完整表范围上算）—— 这就是「多维表支持统计」那条路；本机同时复算一遍，**两条路必须逐格相等**（判据 J1）。② 三态筛选导出：服务端 `--filter-json` 谓词下推 → ndjson artifact → 本机转 CSV（UTF-8 BOM）。③ 每个统计块**必须带分母**（有值 / 未指定 / 空 三档分开），0 行标 `empty_by_data`。'
  artifacts:
    module: kb/l8/bitable_stats.py
    report_md: kb/l7/reports/bitable-stats-latest.md
    report_json: kb/l7/reports/bitable-stats-latest.json
    report_sha256: kb/l7/reports/bitable-stats-latest.json.sha256
    exports: 'kb/l7/reports/bitable-export-{REVIEW,BLOCK}-latest.csv（PASS 为 0 行 ⇒ 按 `empty_by_data` 不落空 CSV）'
  judges:
    J1: '云端聚合 与 本机复算**逐格相等** —— 不重算就没有证据证明「我报的数是飞书侧算的」而不是「拉了明细自己数的」'
    J2: '风险类型必须在**两套词表的并集**内'
    J2b: '每个报出来的类型都指得出词表出处（哪个词表、哪个文件）'
    J3: '每个统计块必须带分母（有值 / 未指定 / 空），三档之和 = 总数'
    J4: '0 行 ⇒ `empty_by_data`（**不是失败**）；非 0 行必须 `has_more=false` 才算完整'
    J5: '落盘 CSV 行数 = 服务端 `records_count`'
    J6: '散文行不得被解析成风险类型 —— **独立重扫对账**（两套实现故意不共享，共享就恒绿）'
  key_findings:
    '★★ `count` vs `count_all` 是分母陷阱': '实测同一张表同一维度：`count` → 未指定 62 ／ 吸奶器 14 ／ 空 **0**（合计 76）；`count_all` → 空 **17**（合计 93 = 全表）。`count` 数的是「该字段非空的取值个数」，空那一组恒为 0 ⇒ **用 `count` 做「按品线统计」，分母静默少 17 行**。★ 这正是 J1 第一次跑就抓到的真缺陷（**不是假想**）：本机复算数的是行，两边不等 ⇒ 立刻红。'
    '★★ 结论表**没有「风险类型」列**': '§8.2 要按风险类型统计，而表 18 列里**没有这一列**（`+field-list` 逐列核过）。唯一落点是 `问题分类汇总`（text），且**只有一部分行**是分类汇总 —— 其余是守衡写回的散文。实测 93 行：可解析 **19** ／ 散文 **57** ／ 空 **17** ⇒ **可解析覆盖率 20.4%**。⇒ 报的是「该列可解析范围内」的分布，**不是全表统计**，产物里逐字写明。'
    '★★ 风险类型**两套类目体系并存**（本件自己先错了一次）': '第一版只认 `l7.json → vocabulary.categories`（规则词表），跑真表立刻 J2 红：品牌一致性 29 / 措辞表达 10 / 原则性错误 6 / 合规红线 2「不在词表里」。**但那个红是尺子错了，不是数据错了** —— 逐条追下去，这四类**全都在** `kb/l4/canonical/sample_case.jsonl → reason_category`（反例/禁区那套类目；实测 473 行：unknown 214 / 品牌一致性 119 / 原则性错误 49 / 措辞表达 47 / 审核问题 31 / 文化禁忌 10 / 合规红线 3）。⇒ 判据改成**两套的并集**，每套各读自己的唯一真源。**不做任何归一**（把「措辞表达」并进「表述与术语准确性」看着合理，但没人裁之前合并 = 把两类风险并成一类）。'
    'PASS 导出 0 行 = 真实空': 'REVIEW 73 / BLOCK 11 / 待审 9，**表里没有一行 `状态=PASS`**。⇒ §5.1「按 PASS 筛选」这条路**通着、但当前无数据可筛**，标 `empty_by_data`。根因方向（本件未判）：引擎在「库内没有可依据条款」时 fail-closed 拒答，且「未命中 ≠ 合规」⇒ 不产出 PASS。'
    '`状态` 没有 `NEEDS_INPUT` 选项': '实测 8 行 `Agent 结论=NEEDS_INPUT` 在 `状态` 上落的是「待审」。**机制已用记录历史核实**：`after="待审"` / `operator="守衡"`（`+record-history-list` 只读）⇒ 是守衡的**有意映射**，不是静默强制。⇒ 按 `状态` 筛选分不出「真待审」与「引擎拒答/未判」；要分开得按 `Agent 结论`。'
    '品线/渠道的「有值」占比极低': '产品线 14/93（15.1%）、渠道 10/93（10.8%）—— 分布本身可信，但它描述的是**少数行**，不能当全表画像。根因：送审时常缺该字段，发布件按 PRD 兜「未指定」。**报黄，不判红。**'
    '「内容类型」中英两套写法并存': '7 种写法（image/text/video ／ 文字/视频/图片/视频/链接）—— 调用方传什么就写什么（`feishu_publish.py` 的 `a.content_type`），**没有受控词表**。⇒ 按内容类型统计会把同一类拆成几组。**本件不替它归一**（归一要先定词表，是人的决定）。'
  honest_limits:
  - '★ **只读**：只 `+data-query` / `+record-list`（lark-cli 里都是 `Risk: read`）。**不建仪表盘、不建视图、不写任何一行。** 结论表是**我们自己产出的**、不属「源只读」禁令范围，但改它的**结构**是人的决定 —— 表里那个**空仪表盘**（`blkBTSiCT1crpikn`，0 组件）要不要放三张图，本件不代劳。'
  - '★ **风险类型列缺失**是**已测出的缺口**，不是本件的实现选择。要真兑现 §8.2，得给表加一个「风险类型」列并回填（**写操作，等一句话**）。'
  - '★ `--snapshot` 离线跑时 **J1 记 `skipped_offline`**（**看得见地跳过**，不是静默变绿）。'
  - '两套词表里，**反例/禁区那套没有声明件**，只在 L4 canonical 实测得到 —— 登记为 AQ-1 等 Owner 裁。'
  evidence:
    selftest: '`bitable_stats --selftest` **28/28** —— 全离线（fixture ndjson），**一台真库都不碰**；含 10 条反向对照：J4 0 行误判 / J4 半页当全部 / J5 掉行 / J2 词表外类型 / J2 词表缺失 / J2b 无出处 / J3 缺分母 / J3 分母不自洽 / **J6 把「整行全解析」放宽成「能解析几段算几段」** / 两套词表并集的四条正例。'
    live_run: '真表核验 **exit 0**：J1 六个维度（产品线 / 渠道 / 内容类型 / 状态 / Agent 结论 / 送审版本）**逐格相等**；REVIEW 73 ／ BLOCK 11 导出 CSV 行数 74/12（含表头）= 服务端 `records_count`。'
    found_by_selftest: '★ fixture **抓出两个真 bug**（不是我后来看出来的）：① `--snapshot` 分支**忽略 states** ⇒ 离线导出的「BLOCK 筛选」其实是全表（导出物标着 BLOCK、内容却是全部，本件最不该犯的错）；② 输出目录不存在时 CSV 落盘 `FileNotFoundError`。'
    gates: '`workflow_smoke.py` **exit 0** ｜ `check_source_readonly.py` **exit 0** ｜ `check_permission_matrix.py` **exit 0** ｜ 引擎测试 **81 passed** ｜ `envelope_census.py` **OK**（顺带洗掉 1 份活路径信封件 `kb/l7/reports/2026-10-10-kb-open_issues-补丁-待并.md`，sha 前后一致）'
  open_questions:
    AQ-1: '反例/禁区类目（`sample_case.reason_category`：品牌一致性 / 原则性错误 / 措辞表达 / 审核问题 / 文化禁忌 / 合规红线）**没有声明件**，只在 L4 canonical 里实测得到；它和规则词表（`l7.json → vocabulary.categories`）是**两套还是应归一**？本件按「并集」处理、不做任何改名或合并。'
    AQ-2: '要不要给结论表加一个「风险类型」列并回填（这样 §8.2 的「按风险类型统计」才是表原生支持的，而不是从 `问题分类汇总` 反解、且覆盖率只有 20.4%）？**写操作，未做。**'
    AQ-3: '结论表里那个**空仪表盘**（`blkBTSiCT1crpikn`）要不要放三张图（按品线 / 渠道 / 风险类型）？**写操作，未做。**'

