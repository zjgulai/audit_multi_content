    （`round(float(x), 4)`）；缺省 **键不出现**（不写 null，既有调用方记录一个字节不变）；
    **非数字直接 `ValueError`**（不许静默写 null —— 一个写不进去的数比没有数更坏）。
    `with_kb_evidence.py` 传 `confidence=decision.get("confidence")` —— 只**搬运**已算好的那个值
    （2026-10-12 起引擎侧是**派生量**，带 `decision_trace.confidence_derivation`），**不另算一遍、不参与判定**。
  judge: >
    `/tmp/probe_conf_ledger.py` **16/16**：A 单元 8 例（给了就写并四舍五入／显式 None 不写／
    既有调用方不给不写／非数字报错／既有顶层键一个不少／只多 content_id+confidence 两个键／同 RUN 合并保住）；
    B 接线 5 例（真调 `run()`，用假 `run_record` 模块**截获** kwargs：捕获值 == 引擎 decision 的值、
    是 0–1 的数、content_id 一起传、三态与条数没被动到）；
    C **变异自证** 3 例（把 live 源码里那一行**真删掉**再跑 ⇒ 捕获里没有 confidence、别的照旧 ⇒ 这把尺子不是恒绿）。
    ★ 端到端：真入口跑一次 ⇒ 20:07:59 落 `REVIEW ｜ issue_count=1` ＋ **`confidence: 0.86`** ＋
    `content_id: AD-20261012-006`；全库带置信度的行 **1**，就是它。
  measured_workflow_impact: >
    `workflow_smoke` rc=0；`workflow_check` 红集与改动前**逐条相同（②③⑥⑩，本就是既有红）**，一项没多；
    引擎 pytest **101 passed**；`review_run_count --selftest` rc=0；`calibrate_confidence --selftest` 10/10；
    按素材去重的单数 **258 未变**（E2E 用的是已有素材 ⇒ 没抬高读数）。
  ★ 两处我自己踩的坑（记下来免得再犯）: >
    ① 判据取「台账多了 1 行 ⇒ 取 `new[0]`」——**错**：同一秒有 `daily_health` 也在追加
    ⇒ 拿到的是别人的行、**六例假红**。台账是**多产者追加**的，取行必须**按 source/时间筛**，不能按位置。
    ② `xml.sax.saxutils.unescape` **不解十进制实体**（xlsx 的非 ASCII 存 `&#NNNN;`）
