      mutation: '退回原始两层 glob ⇒ **E6 精确变红**（专属 6 份，拿到直链 **0 份**）； 还原 ⇒ 30/0。

        '
      lesson: '⚠️ **判据自己也要被变异验过**：E6 前后写坏过两版，**两版都在变异下全绿**（等于没测）—— 第一版按目录深度抽样（`l0/*/rec*.json`）⇒「一层 0 份」，因为带前缀那批文件名不以 `rec` 开头； 第二版虽然按形态抽了，但抽到的记录**在两种形态下都有孪生件** ⇒ 改坏任一种形态照样解析得到。 **教训：抽样的「代表性」本身是判据的一部分 —— 抽不到 = 没测。**

