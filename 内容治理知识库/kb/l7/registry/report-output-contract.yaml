  - 分流会**把 BLOCK 压成 REVIEW**（§6.6 的 0.70-0.89 与 <0.70 两档，PRD 原文都写「输出 REVIEW」）。这是 PRD 明文要求；P0 命中被排除在分流之外正是为了保住红线。原结论落在 `decision_trace.decision_before_confidence_flow`。
