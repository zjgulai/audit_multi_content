    E3: '发号总数 ↔ 定稿总数的差额必须登记，且登记里的两个数要与现算**逐字相等**（声明不许过期）'
  measured_20261010:
    外部标准库_external_standard: 'L2 5421 单元（合格 5368）｜ 规则层 **0** 条 ｜ 供给路径 **0** ⇒ ❌ **不可依据**'
    产品描述库_product_desc: 'L2 54 单元（合格 53）｜ 规则层 **0** 条 ｜ 供给路径 **0** ⇒ ❌ **不可依据**'
    措辞表达库_wording: 'L2 7661 ｜ 规则层 **1018** 条 ⇒ ✅'
    内部正负样本库_internal_sample: 'L2 1510 ｜ 2 条被复核通过的消费者（`review.py` / `selfhit_check.py` 读 `sample_case`） ⇒ ✅'
    发号与定稿: '已发号合计 **4260** ｜ canonical 合计 **1480** ｜ 差 **2780**（已登记）'
  key_findings:
    '★★ 四类知识库有两类不可依据': 'PRD §7.1 的「外部标准库」（P0+P1 那一类）与「产品描述库」在评审链上**没有任何消费者**。后果：题材只要落在它们上面（婴儿睡姿 / 乘车安全座椅 / 医学共识），引擎**必然 fail-closed 拒答**，而库里其实有 5421 个单元、6310 条候选、3155 个已发号条款。'
    '★ 段的 form 不是 canonical 文件名（第一版判据的尺子错了）': 'E3 首版按**段**比发号↔定稿，当场被自证判红 —— 而那个红是**我的尺子错了**：`numbering.issued[*].form` 实测 S-1 = `sample_case_polarity`、W-3 = `sample_case_wording_sample`，两段**共同**落在 `sample_case.jsonl`（316+157=473 ✓），而 `l4.json` 里**没有任何一处**声明「段 → canonical 文件」的映射。⇒ 改成算**总数**（零歧义、可复算）并逐段逐文件如实并报。'
    '★ 「真被读」不等于「装的是本类内容」（自证 ③ 逼出来的）': '首版只核「这个文件读那个形态」，于是**指着一个不装本类内容的形态**（拿内部样本库的 `sample_case` 冒充外部标准库）照样能变绿 —— 那不是接上了路，是换了个库。⇒ 加 E1c。'
    'AST 剔除 docstring 是必须的': '按文件名 grep 会让 `scoped_clause` 在 **9 个活文件**里"出现"，而它们**全是 gate / distiller**（生产者与检查者）。⇒ E1b 用 `ast` 取**非 docstring 的字符串字面量**判定「真的把文件名拼进了路径」。'
  evidence:
    selftest: '`check_external_standard_supply --selftest` **22/22** —— 含 10 条反向对照（谎报消费者 / 换个库冒充 / 假 rules 路径 / 缺声明 / docstring 不算读者 / 登记过期 ×2 / 无登记 / 汇总可复算 / 空声明不恒绿），以及**一条正例**（注入「四类全接上」的数据面 ⇒ 整体转绿、退出码 0 ⇒ **判据不恒红**）'
    live_mutation: '★ 真造一遍：把 `l4_gate.py`（只在 docstring 里提 `scoped_clause`）**谎报**成消费者 ⇒ **仍红**（声明 1 条 / 通过 0 条）；还原后 sha 一致。'
    real_run: '真库核验 **exit 3**（红着把缺口钉住）：外部标准库 ❌ / 产品描述库 ❌ / 措辞表达库 ✅ / 内部正负样本库 ✅'
