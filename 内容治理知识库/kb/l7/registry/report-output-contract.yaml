fix_20261014_same_problem_intersection:
  when: '2026-10-14'
  what: >
    PRD §3.2 的合并口径「**同一问题取交集、不同问题走并集**」——
    **并集那半一直 100%，交集那半一次都没成立过**：
    双轨 2026-10-06 上线至 2026-10-14 全部 123 单里，`双轨确认` 123 次全为 0、
    `冲突降 REVIEW` 123 次全为 0；恒等式 `合并 = 双轨确认+冲突+仅库侧+仅模型侧` **123/123 照样成立**；
    1324 个产出文件（留底报告／出站台账／写库台账／批跑留底）里交集标记
    （`两侧都命中（可回源）` 等）**一个都没有** ⇒ **没有任何东西会红**，只有人去数才看得出来。
  prd_verbatim: >
    「……结论在最后一步按『同一问题取交集、不同问题走并集』合并
    （对齐判据：位置相同 + 类目相同 → 视为『同一个问题』）」—— PRD §3.2（原文行 `#L131`）。
    本地以 L1 事实件收录：`kb/view/3_措辞表达库/L1-facts/ref-content-review-kb-plan-v2-5.md:84`。
  ruling_overrides_prd: >
    ★ **执行口径不是 PRD 原文那一句**：Owner 2026-10-08 的题注裁定
    「两侧命中的**逐字片段有重叠** ⇒ 算同一条」。两处不同**必须看得见** ——
    「位置相同 + 类目相同」与「逐字片段有重叠」不是同一句，实现按裁定走。
  root_cause: >
    三条叠在一起（全部实测复现）：① **判据要的那格数据里没有** ——
    `tools/agent/dual_track.mjs::sameOrigin` 比的是 `f.excerpt ?? f.matched_term`，
    而库侧条目**两条来路都不写这个字段** ⇒ 恒返回「一侧没有逐字命中片段（无从比）」；
    ② **判据被实现收窄** —— 只认 `ea === eb`，而库侧给**命中词**（`最好`）、模型侧给**逐字原句**
    ⇒ 永不相等；③ **库侧手上只有正则** —— 收据印的是 `最\s*(好|佳|…)`，拿它和原句比等于没接；
    真实命中文字在 `kb/l5/p0_fastpath.py --json` 的 `findings[].matched[].{line_text,span}` 里。
  change: >
    `tools/agent/dual_track.mjs` / `agent.mjs` / `tools.mjs` 共 7 处：
    `sameOrigin` 按裁定字面恢复（一方的片段**完整包含**另一方即算重叠，下限 2 字挡单字噪声；
    类目族不同不拦，照旧在卡上留注）；新增 `p0MatchedMap` / `excerptFromLocation`，
    从 matched 的 span+line_text 切出真实命中文字；正则路径给条目挂 `excerpt`（取不到为 null，**不编**）；
    结构化路径的 `exc` 挂回条目；`tools.mjs` 让 P0 返回对象带出 `p0_findings`
    （只搬不算、不加判据、不改版式）；`agent.mjs` 接线
    `kbFindingsOf(res?.answer, res?.engine, res?.p0_findings)`。
  verified: >
