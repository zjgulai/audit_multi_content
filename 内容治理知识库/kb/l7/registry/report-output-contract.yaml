# 第十四轮：每条问题之间加分隔线（2026-10-17）
# ══════════════════════════════════════════════════════════════════════════════
fix_20261017_round14_divider_between_issues:
  date: '2026-10-17'
  trigger: 'Owner：「每个问题之间能空一行吗？现在看起来还是好密集」。'
  diagnosis: >-
    实测真件：条目之间只有 **1 个空行、而且不一致**（第 1、3、4、5 条前 1 个，第 2 条前 2 个 ——
    取决于条目字符串末尾那个 `\n` 与 `L.push('')` 叠不叠）。飞书再把连续空行折一次
    ⇒ 七条问题看上去是一整块。**空行在飞书里靠不住，分隔线才靠得住。**
  changed:
  - file: tools/agent/merged_report.mjs
    what: >-
      **每条问题后面**一条 `---`（不是前面）—— 这样组标题 `### P…` / `#### 维度` 永远跟在一条线之后，
      不会出现「标题下面顶一条横线」，也不会在组边界出现两条线。
      原先那条「组与组之间加线」的逻辑同时撤掉（每条之后已有线，组边界自然就分开了）。
  count:
    test_agent: 通过 262 / 失败 0
    dual_track_selftest: 通过 126 / 失败 0
    verify_cards: 通过 347 / 不通过 0
    skeleton: >-
      `1.【…】` → `---` → `2.【…】` → `---` → `### P1 …` → `#### 合规` → `3.【…】` → `---` →
      `#### 消费者安全` → `4.【…】` → `---` …
  honest_limits:
  - >-
    **线的数量会随着问题数线性增长**（7 条问题 = 7 条线）。审计报告里这是标准做法，
    但如果业务侧嫌线多，退路是「只在 P 级分组之间加线、条与条之间用两个空行」—— 那一版在飞书里会被折叠。
  - >-
    **`---` 在飞书 markdown 导入里渲不渲染，本机验不了**。若不渲染，看到的会是空行（等于回到上一版）；
    那时唯一可靠的替代是把每条问题的标题行加粗。

