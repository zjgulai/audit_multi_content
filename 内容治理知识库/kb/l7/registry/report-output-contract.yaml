    selftest: '`node tools/agent/dual_track.mjs --selftest` ⇒ **26/0** ＋ 抽取 **7/0**（新增 ⑩/⑪/⑫ 三组）'
    mutation: 拆掉三条 `kb` 判据 ⇒ **3 条精确变红**（含「期望 BLOCK 实得 REVIEW」= 今天的原病）
    suites: '`test_agent` **119/0** ｜ `verify_cards` **269/0** ｜ `review_publish.test` **13/0**'
    verify_live:
      when: 2026-10-07 16:19–16:22（重启后第一单，**真飞书侧**）
      why_restart_needed: 'Node **只在进程启动时加载模块** ⇒ 改盘上的 `dual_track.mjs` / `agent.mjs` **不影响已运行的进程**。 实测：守衡 PID 16320 启动于 **15:17:13**，两文件改于 **16:08** ⇒ 16:16 那一单仍是旧行为（`REVIEW/2`）。 库里的闸门 `tools/restart_shouheng.sh --check` 独立读出「**重启会生效：3 个被 import 的模块在启动后被改过**」。 重启**只许** `launchctl kickstart -k`（`kill -TERM` ⇒ 退出码 0 ⇒ launchd 判为正常停机、**不再拉起**）。 已走闸门：先读一次（写 300 s 一次性凭证）→ `--yes --why=…` ⇒ **PID 16320 → 50192**， 台账 `PMO/logs/restart-ledger.jsonl`（mode=restart / ok=true）。

