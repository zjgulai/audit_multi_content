fix_20261010_l0_entry_url_keyerror:
  date: '2026-10-10'
  severity: ★ 卡死真实链路（不是样式问题）
  symptom: 全链在「③ 出结论」停住：`review_run.sh` 报「引擎输出无法解析 / 引擎退出码 2」
  root_cause: '`kb-content-review/scripts/review.py:1392` 抛 `KeyError: ''l0_entry_url''`。**判据与取值各写一遍，必然漂移**：判据 = `f.get("l0_entry_url") or (f.get("verbatim_source") or {}).get("entry_url")`（带 get + 回落，宽松）；取值 = `f[''l0_entry_url'']`（直取第一个来源，严格）。⇒ 当 **`l0_entry_url` 这个键本身不存在**、而 `verbatim_source.entry_url` 有值时：**判据放行、取值 KeyError**。'
  why_latent: '`write_report` 只在 **findings ≥ 3** 时被调用（`review.py::main()` 的 `len(res["findings"]) >= 3 or a.report_dir`）⇒ **1–2 条问题的单子走不到那一行**。实测：同一段文案 2 条时正常、**加一句变 3 条就崩**。所以它藏了很久 —— 本库跑过 560+ 单真评审都没踩到。'
  fix: '**取一次、判一次，同一个变量**（海象表达式），判据与取值不再各写一遍。'
  regression_test: '`kb/l7/review-engine/tests/test_review_report_robustness.py`（4 条）。★ 该组判据**必须用 ≥3 条 findings 构造** —— 否则它自己也会「走不到那一行」。变异自证：把取值改回直取 ⇒ `test_missing_l0_entry_url_key_does_not_crash` **精确变红**（`KeyError: ''l0_entry_url''`，1 failed / 3 passed）。'
  verification:
    before: '3 条问题的单：`KeyError: ''l0_entry_url''` ⇒ 全链 exit 2'
    after: 3 条问题的单：正常出 `【审查结论：BLOCK】共发现 3 处必须修改。`
    end_to_end: 全链 exit 0、`published=true`、真文档链接与表行都落上
    workflow_smoke: ★ `kb/l8/workflow_smoke.py` **exit 0 全绿**（S1–S5）
    engine_tests: 81 passed
  who_found_it: '**没找到它的原因值得记**：`workflow_smoke.py` 是**契约级**冒烟（只读、不跑链），按它自己的边界声明「不替代端到端验收」⇒ 这类「跑起来才炸」的 bug **它抓不到**。本次是**真跑全链**（目标 20 的端到端验证）才撞出来的。⇒ 结论：契约级冒烟与端到端实跑**两把都要**，缺一把就会漏这一类。'
