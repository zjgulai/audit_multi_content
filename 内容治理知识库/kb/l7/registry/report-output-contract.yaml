    regex_probe: "`conclusionOf` 旧判据（取全文**第一个**三态词）的三个反例，**全部抠成 `PASS`**：\n  · 「库侧未参与 ⇒ 本条**不得当 PASS 依据**。结论：REVIEW。」\n  · 「本次没跑到引擎，所以**不能当 PASS**；请重试。」\n  · 「链没跑成，结论未知（不是 PASS，也不是 REVIEW）。」\n"
