  scope: 守衡侧**审查报告**（投飞书云文档那一份 ＋ 卡片逐条块共用同一渲染函数）
  trigger: >-
    Owner 拿着白板来定格式，原话：「目前守衡侧输出的审查报告格式不行（逻辑不变，按照 prd 问题数量 ≥3 个时
    才输出审查报告），按照审计报告的模式」。白板标题逐字「**审计报告不是模板（V1）**」，左侧主干为
    `审计报告 → 结构 → 总（state + 1句话）→ 分（P0 → G1/G2/G3 → rule1 out ｜ P1 → rule2 out ｜
    Pn → rule3 out）→ 执行 @`；居中一个圈写判定规则 `P0 ≥ 1 → Block` ｜ `P1 ≥ 1 且无 P0 → review` ｜ `Pn ……`。
