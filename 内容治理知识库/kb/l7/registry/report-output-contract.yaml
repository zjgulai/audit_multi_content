# 2026-10-16（第 3 件）：模型侧「能引什么」只列美国来源
# ══════════════════════════════════════════════════════════════════════════════
fix_20261016_model_side_us_sources:
  at: 2026-10-16
  owner_ruling_verbatim: >-
    Owner 追问：「**目前模型侧是按照下面的美国区来跑的吗？**」并列出了美国联邦
    （FDA S11/S12/S13、FTC S14）与美国平台政策（Amazon S1–S6、Google S9/S10、Meta S7/S8、TikTok S17）。
  prd_verbatim: >-
    PRD 第一阶段范围 = **美国市场**（模型侧提示词第 7 条即由此而来，2026-10-14 加）。
  case: >-
    **规矩与菜单打架。** 提示词第 7 条写的是「**不得援引非美国市场的合规要求** —— 中国《广告法》
    与极限用语、医疗器械广告审查批准文号、GB 国标、**英国 MHRA / ASA-CAP**、欧盟法规等，
    **都不是本项目的判据**」；而同一段提示词的**来源菜单**（`ext_basis.sourceMenuLines()`）
    把登记表 **17 条全列**——其中 **`S15` = MHRA（英国）**、**`S16` = ASA/CAP（英国）**。
    即：**禁止援引的东西，被原样递到了它面前**（模型只能从菜单里挑 id）。
    实测（当时）：写回台账 `PMO/logs/lark_writes.jsonl` 里 `"S15"`/`"S16"` **0 次**；
    80 行表内与报告里 `MHRA` / `CAP Code` **0 命中** ⇒ **还没被引用过**（隐患，不是已发生的错）。
  root_cause: >-
    来源登记表（`research/kb/外部标准库-v1.json`）**没有辖区字段** —— 17 条里 2 条域外来源
    与 15 条美国来源在结构上长得一样，菜单只能"全列"。实测只有 `S11`/`S14` 的
    `适用范围声明` 里**碰巧写了**「监管辖区为美国」「管辖为美国联邦层面」，其余 15 条要读机构名才看得出。
  fix:
  - file: research/kb/外部标准库-v1.json
    rule: >-
      `sources[]` 逐条加 **`辖区` / `辖区层级` / `辖区备注`**（**数据层**，不在代码里写死 id 名单）：
      `US` × 15（联邦监管 4 = S11–S14；平台政策 11 = S1–S10、S17）、`UK` × 2（S15/S16，
      备注写明"按提示词第 7 条不得作为本项目判据"）。备份 `/tmp/ext_v1.bak-pre-jurisdiction-20261016.json`。
  - file: tools/agent/ext_basis.mjs
    rule: >-
      新增 `usSourceChoicesOf()` / `nonUsSourceChoicesOf()` / `nonUsSourceChoices()`；
      `sourceMenuLines()` 改为**只列 `辖区 === 'US'`**（菜单 **17 → 15**）。
      ⚠️ **`resolveSourceId()` 一个字没改**（仍认全部 17 个 id）：历史引用不受影响，
      也不把模型已经写下的依据**静默抹掉**（"界面里看不见"与"数据里不存在"是两回事）。
  count: >-
    实测提示词里递出去的菜单 **15 条**（打印过：S1–S14 ＋ S17，**没有 S15/S16**）；
    `ext_basis --selftest` **25/25**（新增 6 条：菜单=15、被排除的恰是 S15/S16、菜单与"美国子集"同源、
    菜单里不出现非美国 id、**每条来源都带辖区**、以及**两条反向对照**）；
    `test_agent` **247/0**｜`workflow_smoke.py` **rc=0**｜`check_agents_md_drift.py` **rc=0**。
  mutation: >-
    把 `usSourceChoicesOf` 的判据改成恒真（回到"全列"）⇒「菜单只列美国来源 ⇒ 15 条」与
    「菜单里不出现非美国 id」**精确变红**；把 `S15` 的辖区改回 `US` ⇒ 反向对照那条红
    （证明挡住它的是辖区、不是"没读进来"）。
  honest_limits:
  - >-
    **库侧没有同样的问题**（已核）：L4 canonical **123 条条款 `jurisdiction` 全部 = `US`**，
    没有第二个值；外标准库 v0 的条款号（E-…）也来自同一批美国来源。
  - >-
    **没有州级覆盖**：全表 80 行与写回台账里 `California` / `Prop 65` / `CCPA` / `加州`
    命中 **0** ⇒ 「美国区」在本项目里 = **美国联邦 ＋ 美国平台政策**，不含州法。
  - >-
    **模型本身不在美国**：它调的是 DeepSeek 云 API（`tools/agent/config.mjs`：
    `baseUrl=https://api.deepseek.com`、`model=deepseek-flash`，可用 `SHOUHENG_LLM_BASE_URL` 覆盖）
    ——「美国」只体现在**判定口径**上，不是部署区域。
  - >-
    **平台文本是"全球版"**：Amazon / Google / Meta / TikTok 的政策页面是全球政策文本
    （页面内另有 Country / Market-specific 分节），本项目按**美国站**适用 —— 这一点写进了
    `sources[].辖区备注`，但**没有**做"按站点抽分节"的机器处理（那需要另一件事）。

