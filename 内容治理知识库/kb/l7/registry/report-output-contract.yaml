correction_20261005_review_run_heredoc:
  what_happened: '`applied_20261005_stop_agent_rewriting_feishu` 的 `defects_found_and_fixed_this_round.d2` 写「夹具E 已能正常渲染」—— **那只验证了被抽出来的代码块，没验证脚本本身**。 实际脚本当时是坏的：我用 python 替换模板时，`s.index("PYEOF", start)` 命中的是 **开头那行 `<<''PYEOF''` 里的 PYEOF**，于是新模板与**旧模板死代码**被拼接在一起， 中间留下一个 `PYEOF''`（多一个引号、不是合法定界符）⇒ heredoc 一路吃到文末的真 PYEOF， python 读到 `PYEOF''` 直接 **SyntaxError**，模板**从未渲染过**。

    '
  evidence:
  - agent 自己诊断出来的（round8b 链接单）：『`kb/l8/review_run.sh` 的 python heredoc 坏了：第一个定界符写成了 `PYEOF'`』
  - round8c 链接单：模板打出「不可解析」分支，agent 同样如实标注「这是脚本缺陷、不是引擎失败」
  consequence_for_round8_numbers: '**round8 那三单的提速不是模板带来的**（模板当时根本没跑通）， 而是手册新增的两条硬规则（「飞书表那一步不是你的活」/「没拿到结论时怎么办」）带来的。 这点必须写清，否则等于把功劳记在没生效的改动上。

    '
  actually_fixed:
  - 删掉 `PYEOF'` 与旧模板死代码（23 行），脚本现在只有 136 开 / 190 闭两个定界符
  - 解析改三重兜底：纯 JSON / 前置日志行 / 后随日志行 / 前后都有 —— 四种形态逐一验过
  - 解析失败时打印「引擎 stdout 头 300 字」，让下次失败自带诊断（不再需要靠 agent 回头报缺陷）
  lesson: '**替换代码块后必须执行一次真实调用验证，而不是只验证被抽出的片段。** 这一条与本库既有的「不改被测物 / 用同一把尺子」同类：**片段测试不等于成品测试**。

    '
  files:
  - kb/l8/review_run.sh
  rollback:
  - kb/l7/_backups/review_run.sh.bak-heredoc-broken（坏版本的现场）
