applied_20261014:
  remove_verdict_field:
    owner_ruling: 'Owner 2026-10-14 原话：「按照 prd 5.3 要求，输出的字段是没有『判定：REVIEW』，只有【审查结论：REVIEW】；修改所有的落库规则去掉『判定』这个字段，包括文案/图片/视频，修复后落库，其他不动。」三问三答的口径：**两条路都不再输出任何「判定」行**（含逐条里的 `判定：事实/推断`）／**授权改守衡仓**／**只重渲染原地覆盖，不重跑审查**。'
    prd_basis: 'PRD §5.3.2 / §5.3.3 的**逐条模板只有 `原因` / `依据` /（BLOCK 才有）`建议`** —— 三态只出现在**结论行** `【审查结论：X】` 一处（`kb/.work/prd.md:169-243`，逐字）。逐条再挂一个「判定」，同一张卡上就有两个「判定」，业务侧分不清哪个是结论。'
    what:
      - '`kb/l7/review-engine/core/review_engine.py`：`render_summary` 的逐条渲染删掉 `**判定**：{fact}｜置信度：{conf}` 一行。**数据一个字节没动** —— `fact_or_inference` / `confidence` 仍随 risk_items 进 JSON 与台账。'
      - '`kb/l7/skills/kb-content-review/scripts/review.py`：回执版式与报告版式各删一行 `判定：…｜置信度：…`（两处）。'
      - '`kb/l5/p0_fastpath.py`：`_prd_block`（回执）与 `_doc_block`（云文档）各删一行；`_item_fields()` 的 `verdict` 那一格**整格去掉**（grep 证实**没有任何下游读它**，只被这两处渲染点读）。'
      - '`kb/l7/review-engine/core/with_kb_evidence.py`：覆盖缺口说明里那句 `判定：REVIEW（**不是 PASS**）` 删掉；该单结论仍是 REVIEW（抬头 `【审查结论：REVIEW】` 就是它），`state` / `issue_count` / `severity` / `fails_closed` 一字未改。'
      - '守衡仓 `tools/agent/dual_track.mjs`：`renderMergedItem` 的补充行 `**判定**：${verdict}` 删掉（**卡片与报告同源** —— `merged_report.mjs` 逐条也调它）；`renderMerged` 拒答支路的 `判定：REVIEW` 删掉（那一支抬头本来就是 `【审查结论：NEEDS_INPUT】`，两个三态同卡打架）。'
      - '夹具与模板同步：`kb/l7/output_template.md`、`kb/l7/selftest_a_block.md`、守衡 `dual_track.mjs` 自证夹具 3 处、`tools/verify_cards.mjs` 的 J11 夹具。'
    gates_updated:
      - '`kb/.work/l7_integrity.py`：两条判据里去掉 `判定`（`逐条分流(1-2)` 的补充行白名单收窄为 锚点/source_sha256；`逐条块含引用三要素`→`两要素`，它原先把 `判定：…置信度：` 当引用契约的一部分，**那不是引用契约要的东西**）；`BLOCK 逐条四要素` 的引擎侧正则同步收窄。'
      - '★ **每处都补了反向对照**（否则「删了判定行」这件事没有任何失败信号）：`kb/.work/l7_integrity.py` 加 `夹具里不再有 判定 行` 与 `BLOCK 逐条块无 判定 行`；`kb/l5/p0_fastpath.py` 自证 ④ 加一条断言；守衡 `tools/test_agent.mjs` W9 加**打在生产者的**反向对照（真调 `renderMerged` 渲染一次）。'
    fixed_parasitic_gate: '★ 顺带修掉一处**寄生判据**：`test_agent.mjs` 与 `verify_cards.mjs` 原先拿 `/^ *\*{0,2}判定\*{0,2}：/gm` **当"条目数"计数器**（每条恰好一行 `**判定**：`）。字段一删它们会**静默数出 0 条** —— 红的原因变成「计数器坏了」，红得对不上病。⇒ 新增 `dual_track.countRenderedItems()`（数逐条块的**行首编号**，与排版无关），8 处计数点全部改用它。'
    kept_on_purpose: '`tools/agent/review_publish.mjs::conclusionOf` 的认读清单里**保留** `判定：X` —— 那是**读**旧回答的兼容（历史卡片 / 重放 / 老补发队列），不是产出；删了会让存量数据抽不出结论。'
    not_touched: '`kb/l5/p0_fastpath.py` 里 `判定对象（逐字）：…` 那一格**没动** —— 它说的是「审的是哪段素材」，不是三态结论，与本次裁定无关。`review.py` 的 `fact_or_inference` 取值、`severity`、`issue_count`、报告门槛、卡片类型收敛逻辑，一个字未改。'
    measured:
      engine_pytest: '101 passed'
      p0_selftest: '通过 39 / 失败 0（含新增 ④「逐条块不再出现 `**判定**` 行」）'
      l7_integrity: 'template_conformance PASS ｜ template_from_engine PASS（两条新反向对照都在这两段里）'
      dual_track_selftest: '自证 93/0 ＋ 抽取自证 37/0'
      test_agent: '通过 220 / 失败 1 —— 唯一那条是 `真实群里用户消息解析出姓名`，它打真飞书群，**与本次改动无关**（实测 `listMembers` 正常返回三人，是历史消息里某条发送者不在当前成员表 ⇒ 解析出空串）'
      verify_cards: '通过 304 / 不通过 0'
      workflow_smoke: 'S1/S2/S3/S5/S7 全绿；S4 报「缺飞书直链 2 份」= 既有红（那两份是 2026-10-05 的旧报告，与本次改动无关，见同日交付记录里同一条既有红）'

