    dual_track:
      B: P0 快路 8.4s，命中 H05+H06 ｜ 库侧 **2 条** ✅ ｜ 合并 BLOCK/5
      C: P0 快路 8.6s，命中 H06+H07+H09 ｜ 库侧 **0 条** ❌（真实 3 条）｜ 合并被改写成 **REVIEW/2**
      A: 链 126.6s ｜ 库侧 0 条（**拒答**）｜ 合并 REVIEW/1
      D: 链 417.3s ｜ 库侧 0 条（**真判 PASS**）｜ 合并 REVIEW/1
      E: 链 124.8s ｜ 库侧 0 条（**拒答**）｜ 合并 REVIEW/3
    row_vs_card: 5/5 表行与回话卡不一致（C 最严重：表 BLOCK/3 ／ 卡 REVIEW/2 —— **红线在表里是 BLOCK、在人手里是 REVIEW**）
  root_cause_code: '`tools/agent/dual_track.mjs::kbFindingsOf()` 只认逐条行 `/^\s*\d+[.、]\s*【…】/`； 而 PRD §5.3.3 规定**问题数 ≥3 时库侧只出分类汇总、不出逐条** ⇒ **库侧 ≥3 必被读成 0 条**。 **复现（真引擎输出喂该函数）**：P0 命中 **3 条 ⇒ 抽出 0 条**；命中 2 条 ⇒ 抽出 2 条。 后果链：库侧 0 条 ⇒ 旧 `mergedState` 只看「合并条目里有没有 BLOCK」⇒ **BLOCK 被降级 REVIEW**。

    '
  fix:
    structured_read:
      file: tools/agent/dual_track.mjs
      rule: '新增 `kbSideOf(res)`：结论与条数**一律读结构化字段** —— P0 快路取 `res.p0_fastpath.rule_codes` + `res.issue_count`（结论恒 BLOCK，PRD §6.6）； 评审链取机读旁挂 `res.review`（`state` / `issue_count` / `refusal`）。 文本抽取**降级为只补逐条明细**，抠不全时**必须看得见**。

        '
    monotonic_state:
      rule: '`mergedState({…, kb})` 三条：① 库侧**拒答** ⇒ `NEEDS_INPUT`（不许出三态结论）； ② **单调性**：库侧 BLOCK 或合并里出现 BLOCK ⇒ BLOCK（**只许保持或升级，不许降级**）； ③ 库侧 REVIEW ⇒ REVIEW。**不给 `kb` 时逐字退回原判据**（有 ⑫ 反向对照守着）。

        '
    refusal_is_a_state:
      rule: '拒答是**独立状态**、不许折算成「0 条」：`renderMerged` 遇 NEEDS_INPUT 渲染**披露块** （「知识库侧未判 ＋ 不得当通过依据，也不得当拦截依据 ＋ 先恢复库侧再重审」）， 不再伪装成一张 REVIEW 卡。

        '
      extra: '顺带修 `agent.mjs` 汇总列：原先只在 `refusal.reason_code` 存在时才写「未能得出结论」， 而**超期拒答的 `refusal` 里没有 reason_code、只有中文 `reason`**（实测 E 单） ⇒ 那类拒答掉进「链已跑完…结论原文见对话与报告」的兜底话术。现在认 `refusal` 本身。

        '
      self_correction_20261007: '⚠️ **当天自查发现判据过宽，已收紧**：第一版写成「`refusal` 存在 ⇒ 拒答」， 于是把引擎**故意给 REVIEW** 的**覆盖缺口**也改判成 NEEDS_INPUT。 引擎对覆盖缺口的形状是 `state = REVIEW` ＋ `refusal.state = NEEDS_INPUT`（后者是**依据侧**的状态）， 而 `with_kb_evidence.py:439` 的注释是明确的：「★ 这里如实写 REVIEW： **下游（飞书落表 / 守衡转述）读的是这个字段**」。 ⇒ 现在**只认顶层 `state`**；`refusal` 降为出处/原因码；覆盖缺口额外标 `coverageGap` 并在卡里加一行「库对该题材没有可依据的条款 ⇒ 转人工看覆盖，**不是发现了内容问题**； 也不得据此当 PASS（未命中 ≠ 合规）」。 实测触发：素材「这条展会物料能不能发：M6 吸奶器附赠收纳袋与备用阀门，支持洗碗机清洗。」 （Owner 当天发的，卡里当时显示 `NEEDS_INPUT: 库侧拒答（coverage_not_covered），未判`）。 判据：自证 ⑪c/⑪c2/⑪c3；**变异（放宽回 `|| !!ref`）⇒ 三条精确变红**。

        '
    row_card_same_source:
      file: tools/agent/agent.mjs
      rule: '表行结论**与卡同源**：卡里出的是双轨合并结论时表行跟它走（`拒答` 落表写 `NEEDS_INPUT`）； 卡里回落到链条那一段时仍用链的结论。原先表行取 `conclusionOf(res.answer)`（链的结论）、 卡里写合并结论 ⇒ 5/5 对不上。

        '
      numbers: '「问题数量」**仍按库侧机器读数**记（有口径、可回源）；卡里那个总数是**并集上限** （库侧 ≥3 只出汇总 ⇒ 重叠未判）—— 两者不同不是错，但**必须看得见**，故在「问题分类汇总」列写明。

        '
  verify:
    repro: '**已复现**：真引擎输出喂 `kbFindingsOf` ⇒ 3 条读成 **0 条**（对照 2 条读成 2 条）'
    replay: '用**今天的真实输入**重放新判据：B `BLOCK/5`（不变）｜**C `REVIEW/2` → `BLOCK/5`**（红线不再降级）｜ **E `REVIEW/3` → `NEEDS_INPUT` ＋ 披露**（拒答不再伪装）

