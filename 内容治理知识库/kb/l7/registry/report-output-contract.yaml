fix_20261012_confidence_into_run_ledger:
  what: '台账补**引擎置信度**字段（`confidence`）—— #11 第②步（两侧一致性）与自标定的**前置**'
  why: >
    置信度原先**只活在跑批那一刻的引擎 JSON 里**：实测 `source=review_machine` **1306 行带它的 0 行**
    （`verdict` 只有「STATE ｜ issue_count=N」）。⇒ 事后**按单回捞不到置信度**，
