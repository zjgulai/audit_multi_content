  task_ref: 任务拆解 10/12–10/16 行 · 目标 11（PRD §6.6 置信度与分流策略）
  what: PRD §6.6 三档分流落进代码。任务拆解 目标 11 的现状原文是「**无**」—— 三档策略在代码里**没有任何位置**。本批新增 `kb/l7/review-engine/core/confidence_flow.py`（唯一口径；自证 28/28）并接进裁决侧：≥0.90 直接出结论 ｜ 0.70–0.89 出 REVIEW +「建议人工确认」｜ <0.70 出 REVIEW +「不确定，建议人工重点看」｜ **P0 命中不适用分流**。阈值**从政策文件读**（`kb/l7/registry/confidence-policy.json`），不在代码里硬编码第二份。
  safety_decision: ★ `route()` 里的 **P0 override 是安全闸**：若拿掉它，一个 P0 命中 + 低置信度会被压成 REVIEW ⇒ **红线降级**，与 PRD §15「P0 层漏报率 = 0」直接冲突。判据 `tests/test_tiering.py::test_p0_hit_is_never_downgraded_by_confidence` 钉着；变异自证：拿掉 override ⇒ ②a/②a2/②b/⑤c **精确变红**（4 条）。
  wired_into:
    裁决侧: '`review_engine.py::decide()` → `decision_trace.confidence_route`（含 `thresholds_source`）＋ `decision_before_confidence_flow`（分流压过结论时**原结论必须看得见**）'
    依据侧: '`review.py::_to_report_memory_input()` 的 `decision_trace` 补 `confidence_route`（**说明去向**）与 `tier_trace`（四层命中计数）'
  not_in_this_batch: ★ **阈值标定不在本批**。0.90 / 0.70 是 **PRD 政策值**，不是从数据标定出来的；引擎置信度仍是启发式（`confidence_status = heuristic_not_calibrated`）。把未标定的数按三档切开，切得再准也只是**把猜测分了类**。标定需金标集（11/30 那行的 100 条人工标准答案）。
  measured_20261010:
    band_reachability: 三档在现有启发式下**实际是否可达**（真测，不是推断）
    direct: 可达 —— PASS 0.99 / BLOCK 0.97、0.93
    confirm: 可达 —— 非 P0 的 REVIEW 0.78 / 0.73
    focus: ★ **当前不可达** —— 非 P0 单的置信度最低只到 0.73，掉不到 0.70 以下。策略是对的（模块层判据覆盖），但**没有实单会落进这一档**。这是**标定问题**，不是策略问题。
    guard: '`tests/test_tiering.py::test_engine_non_p0_confidence_never_reaches_focus_band` 把这件事**钉成判据**：哪天启发式改了、真有单掉进 <0.70，该用例变红。'
  evidence:
    tests: 引擎单测 **77 passed**（本批前 69）
    selftest: '`confidence_flow --selftest` **28/28**'
    wiring_selftest: '`tiering --selftest` 29/29 ｜ `kb_rule_dimensions --selftest` 35/35 ｜ `citation_integrity --selftest` 11/11'
