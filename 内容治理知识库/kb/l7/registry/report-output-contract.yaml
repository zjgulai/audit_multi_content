    - id: CLAIM-C2
      defect: --take-over 在跨会话分支被无条件 return 3 吃掉（参数被接受但从不生效）
      cause: take_over 只在 `same`（同 BASE 且 同 pid 或 同 session）分支被消费；跨会话分支直接拒
      impact: 「上一会话崩了 → 新会话接手」正是它唯一有意义的场景，却永远走不进 same 分支 ⇒ 文档承诺的恢复路径不存在（此前只能 release --force）
