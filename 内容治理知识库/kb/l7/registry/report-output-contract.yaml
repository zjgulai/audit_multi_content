gaps_standing_rule: '★ 下列各条**只登记、不修**。任何一条要动代码前，必须先有人判定「这是缺陷」， 并另行开单。本条依据原交接单的边界：「不许把疑似缺口/假 PASS 当成已定论的缺陷去改代码」。

  '
gaps_unresolved:
- id: GAP-RO-1
  title: REVIEW 无修改建议（BLOCK-only 闸门）
  status: 待人工判
  evidence: review.py:654；W-1.47 / W-1.43 实测（见 measured_outputs.suggestion.case_20261002）
  impact: PRD §5.3.2 / §5.3.4 要求 REVIEW 报告含修改建议 ⇒ 现状不满足
  open_question: 「只有 BLOCK 才给改法」是**有意设计**（REVIEW 交人工判断）还是**实现缺口**？
  do_not: 在未判定前删/改 :654 的闸门
- id: GAP-RO-2
  title: 数值置信度不在 review.py 路径上
  status: 待人工判
  evidence: review.py:968 明写不调 decide()；数值只在 review_engine.decide()
  impact: PRD §6.6 要求数值置信度；只跑依据侧时该字段无值 ⇒ 线上表「置信度」列空
  open_question: 该由哪一侧产出并写入表：依据侧合成、裁决侧回填、还是入口串联？
  do_not: 在未判定前让 review.py 去调 decide()（那是用户红线）
- id: GAP-RO-3
  title: 逐条置信度恒为「中」（authority 全库为空）
  status: 待人工判
  evidence: 1018/1018 条规则 authority 为空；review.py:680 依赖 authority=='expert'
  impact: 逐条 高/中/低 实际退化为常量「中」，无区分度
  open_question: authority 是**未回填**还是**本形态无源**（参见 ledger-read-contract.yaml 的 clause 形态裁定）？
  do_not: 在未判定前批量回填 authority
- id: GAP-RO-4
  title: ★ 接桥把「拒答」吃成 PASS（fail-open）
  status: 待人工判
  severity_note: 本条风险最高 —— 方向是**漏放**（该拒答却给 PASS）
  evidence: "2026-10-02 实测：同一段文案 D「Momcozy 吸奶器采用轻音设计，夜间不吵醒宝宝」 经 `with_kb_evidence.py`：\n  · evidence_meta.state = **\"拒答\"**（依据侧确实拒答了）\n  · evidence_meta.findings = 0\n  · decide() → decision = **\"PASS\"**，confidence = **0.99**\n  · decision_trace.reasons = [\"no_known_blocking_or_review_risk\"]\n对照：C（真 PASS，state=\"PASS\"）输出 **完全相同**（PASS / 0.99）。 ⇒ **「库不认识这个主题」与「确实没问题」在输出上不可区分。**\n"
  inversion: '更刺眼的是标定方向反了：全 7 题里 **0.99 是最高置信度**， 而 D 恰恰是**依据最空**的那一题（findings=0 且依据侧拒答）。 工具在自己知道得最少的地方最自信。

    '
  contradicts: '与库内既有判据方向相反：review.py 覆盖信号分支明写「两者都没有 → 拒答 （无命中不等于合规）」；with_kb_evidence.py 自己的 docstring 也警告过 「只跑裁决侧 → decide() 倾向 PASS（**漏放**）」。

    '
  open_question: 'decide() 是否需要接收「依据侧 state=拒答」并**继承拒答**？这属裁决侧输入契约， 不是一处小改 —— 必须人判。

    '
  do_not: 在未判定前改 decide() 或让它继承 state
- id: GAP-RO-5
  title: ★ 层前置只有文字约束，没有代码级阻断（强度低于新鲜度前置）
  status: 主体已落地（2026-10-03：CLI 默认要求 ＋ API 等效留痕已部署）；**遗留一问**：API 侧是否也改成「不带 BASE 即 409」（现在默认放行但留痕 `waived_by_api`）—— 那需要飞书/守衡侧先传 BASE
  evidence: "2026-10-02/03 全库会话扫描（5938 个会话，只读）：\n  · 本工作区 26 个人工会话里，L4–L7 层 skill 只被 skill 工具加载过 **1 次**；\n  · 跑过评审引擎 with_kb_evidence.py 的 36 个会话里，**12 个没加载任何评审层 skill**；\n  · 全库只有 **7 个**会话真带 --invoked 跑过 kb_pipeline，其中 **4 个**是\n    \"传了 --invoked 却没加载任何层 skill\"（申报代替实调）；\n  · 账本 656 行里 via-skill 的 85 行：registry_echo 20 / agent_reported 62 /\n    layer_stamps_observed 仅 3。\n对照先例：新鲜度前置原先也只是文字，后落成 review_freshness_gate.py 的代码级阻断 （review.py 与 kb_api.py 都调，超期 ⇒ 退出码 3 / HTTP 409）。\n"
  impact: 「每次都调 L4–L7」在没有代码阻断时会被绕过 —— 历史实测已绕过数月
  open_question: '阻断点放哪？候选：(a) with_kb_evidence.py 加 --require-layer-preflight，先 opt-in 后默认； (b) review.py 侧；(c) kb_api.py 侧；(d) 把 skill_invocation_audit 接进放行自检。

    '
  do_not: '在未判定前把 with_kb_evidence.py 改成**默认** fail-closed —— 机器入口（kb_api.py / 守衡） 加载不了 skill，会全线断（那属"拿错误的尺子量对的流程"）。

    '
- id: GAP-RO-6
  title: 「内容 ID」的**语义**与 PRD §5.4 相反（ID 随内容变、版本反而是常量）
  status: '**已裁定并落地（2026-10-03）**：① **行口径** = 每次审查新增一行（见 `applied_20261003.row_per_review`）； ② **ID 形态**（发布侧）= **PRD §5.4 业务编号 `AD-YYYYMMDD-NNN`**（见 `applied_20261003.content_id_business_number`）。 残留：引擎 JSON 的**内部** `content_id` 仍为 `AUTO-<sha12>`（同一审查存在两个 ID）—— 见下 `residual_after_fix`。'
  registered_at: 2026-10-03（用户提问「飞书中的内容ID，你是如何输出id号的？先检查需求prd」触发）
  evidence: 'PRD §5.4：`content_id = "AD-20260922-001"`（业务编号）、`content_version = "v1"`（人工版本号）。 实现：`content_id` = 待审文本 sha256 前 12 位（**内容一变，ID 就变**）； `content_version` = 全文 sha256；而飞书表「送审版本」列 = `--version` 默认 **常量 v1.0**（与内容无关）。

    '
  impact: '① 同一条素材改一个标点 ⇒ 新 ID ⇒ 表里**多一行**，第 1 版与第 2 版不再被同一 ID 串起来， 与 §10「审核记录绑定内容版本」相悖；② 完全相同文本重发 ⇒ 命中同一 ID ⇒ upsert 同一行 —— 那是「同文去重」，不等于「同一条内容多轮」；③ ID 不可读（`AUTO-b390adfd37ff` 看不出是哪条素材、哪次送审、谁提交的）。

    '
  what_is_actually_good: '「同文去重」这个幂等本身对批量扫描有用 —— 但那是 **content_version** 的职责， 不该占 **内容 ID** 的位。

    '
  open_question: '「同一条内容」的判定键是什么（SKU ＋ 渠道 ＋ 素材类型 ＋ 提交人 ＋ 日期？还是由提交方直接发号）？ PRD 未定义、库内也没有 —— **这条不定，PRD 口径的内容 ID 就落不了地**。

    '
  already_done_20261003: '**只统一了前缀**（见 prd_contract.content_id.kb_side_after_20261003），**没有动编号规则**。

    '
  known_leftover: '`kb-content-review/scripts/review.py:1051` 仍生成 `text-<sha12>`。那是依据侧**内部**字段 （不进本件 payload、不进飞书表），且该 skill 在库内与 `~/.dsh/skills/` 有两份**字节相同**的镜像 （运行时用后者）—— 要一并统一须同时改两份，否则 skills_check 第 3 类「副本不一致」会红。 故本次**未动**，只登记。

    '
  do_not: '⚠️ **本条已过期，勿据以行事（2026-10-03 用户已裁定）**：原文「在判定前不要改 `content_id` 的生成算法、 也不要批量改写历史行的「内容 ID」」。现状：**算法已按用户裁定改掉**（发布侧改为 PRD §5.4 业务编号 `AD-YYYYMMDD-NNN`，见 `applied_20261003.content_id_business_number`）； **但「不要批量改写历史行」这半条仍然有效** —— 历史行一律不动，不迁移、不重编号。

