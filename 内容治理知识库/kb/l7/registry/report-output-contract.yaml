      '
    root_cause: "`feishu_publish.l0_locate` 的 glob 写死成 `l0/*/*<rec>.json`（**两层 + 带前缀**）， 而 L0 件有两种真实并存的**文件名形态／目录深度**：\n  · `l0/<分类>/feishu_bitable_record__<base>__<rec>.json`（带前缀，两层，1536 份）\n  · `l0/records/<表名>/<rec>.json`                       （纯 rec 名，三层，1813 份）\n⇒ 第二种那 1813 份**永远返回 None**。（卡片侧走的是另一个函数 `_l0_entry_url`， 两种形态都找得到 ⇒ 于是「**卡片有链接、报告没有**」，与「图片/文案」无关。）\n"
    fix:
      file: kb/l7/review-engine/core/feishu_publish.py
      rule: '`l0_locate` 改用 `rglob("*%s.json" % rec)` —— **前缀通配 + 任意深度**， 并**优先非归档件**（`_archive/` 是 superseded 旧副本，直链可能指向已删记录）， 没有活件才退用归档件。

        '
      note: '前缀通配是**防御性**的：实测全库**没有**「只以带前缀形态存在」的记录 （每条都有纯名孪生件）⇒ 单写 `rglob("<rec>.json")` 在今天也够； 留着通配是为了将来只落一种形态时不会又断一次。

        '
