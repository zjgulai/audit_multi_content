  - '★ `canonical_consumer` 只认**活代码**（`kb/l7/**`、`kb/l8/**`）+ `.py/.mjs/.js/.sh`。**人手从 `.md` runbook 里抄命令读某个 canonical 文件，本判据管不住。**'
  - '★ 本件**不写任何 L0–L7 数据**；要关掉 E1 的红，唯一正当做法是**真的接一条路**（写规则，或写一个消费者）—— 改声明没用（声明由判据机械复核）。'
  - '★ `.mjs/.js/.sh` 的复核只到「非整行注释」这一精度（`.py` 走 AST）；已在文件头明说。'
  open_questions:
    AQ-E1: '这 2780 条「已发号未定稿」的真条款谁来抽查签字？（`promotion_rule` 要求**人工抽查**，本人不能自签）'
    AQ-E2: '`kb/l3/registry/l7.json → vocabulary.categories` 里的 `product-info` 与 `citation_contract.libraries` 里的 `product_desc` **不是同一个键名** —— 两处口径要不要统一？本件不代人裁。'

fix_20261010_prd_scope_exclusion_l3_gap:
  date: '2026-10-10'
  severity: '★ 高 —— **已声明排除的内容会在下游变成可引用依据**，而当时的判据看不见'
  what_happened: >
    目标 23 落地时声明「`rule_eligible=false` ⇒ 留在库里可读，但**不许成为规则或依据**」，
    判据是 `check_source_readonly.py` 的 **C8**。实测：C8 复验通过（53 个单元全部翻成 false）。
    **但 C8 只量 `kb/l2/units.jsonl`** —— 那是它声明的范围，不是缺陷；
    **缺陷是没人量 L3**：那 3 份红人 Brief 在 `kb/l3/candidates/scoped_clauses.jsonl` 里
    产出 **94 条候选**，**全部已拿到 E-1 条款号**（E-1.1275 / E-1.2103 / E-1.2382 / E-1.2480 …），
    正文就是 Brief 本身（`MOMCOZY · CREATOR CONTENT BRIEF …`）。
  how_found: >
    我 17:5x 按「让 L3 消化那次 L2 改动」去核**自己的推荐**，先问了一句
    「L3 蒸馏到底读不读 `rule_eligible`」⇒ `grep` 实测 **`l3_distill_run.py` 零命中**
    ⇒ **我的推荐前提是错的**（重跑 L3 什么都不会变）。顺着这条继续查「那 53 个单元在 L3 有没有留痕」，
    才查出这 94 条。**这是「先质疑自己的推荐」查出来的，不是照着计划做出来的。**
  root_cause: >
    `rule_eligible_overrides.how` 列了两条生产者（`ingest_l0_new_records.py` 写 L1 manifest、
    `l2_split_run.py` 切分时落 L2 单元）—— **L3 蒸馏器是缺的第三条**。
    候选 → 定稿 → 被消费者读，才成为依据；只堵 L2 等于在下游留了一个口子。
  fix:
    code: '`kb/l8/l3_scope.py::exclusion_of` 加一道门：`u.get("rule_eligible") is False` ⇒ 返回 `("rule_eligible_false", …)`，并登记进 `CODES`。**放在这把共用尺子上**（两个引擎都 import 它）⇒ 拒绝台账重建也会看到同一口径，不会又分家。'
    judge: '`kb/l8/check_external_standard_supply.py` 加判据 **E4「排除项不得在下游回潮」** —— 真源现读 `kb/l7/registry/source-readonly.yaml → prd_scope_exclusions`（**fail-closed**：读不到 / 空清单 ⇒ 拒判，不许恒绿），把 **L2 与 L3 两层一起量**。'
    real_data_proof: '★ 先算出来再验：拿真库 14647 个 L2 单元，**逐条**跑新旧判据 —— 加这道门前进 5839 / 加之后进 5786 ⇒ **新增剔除正好 53**，且逐资源 18+18+17 = 那 3 份 Brief、`kb_type` 全是 `external_standard`。**零误伤。**'
  not_done:
