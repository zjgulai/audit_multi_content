      why: 登记 `pull_failed` ⇒ 健康色 GREEN 是对的（不冤枉管线）；**但登记 ≠ 无害** —— 实测 `专家修订汇总表` 的 L0 副本停在 09-23（395 条，**10.4 天前**）、`内容公式` 停在 09-24（7 条，**9.5 天前**），而它们**仍是评审链的溯源终点**。原来只报「拉不到」、不报「因此已经多旧」⇒ 静默陈旧。
      verified: 重生成日报实测：新列输出 `⚠️ 395 条 ｜ 最新 10.4 天前` 与 `⚠️ 7 条 ｜ 最新 9.5 天前`，并带「二选一：解锁 ／ 在报告里标明是旧快照」的说明。
    fix3_api_decision_owner:
      what: '`kb_api.py`：`ReviewReq` 加 `decision_owner`（中文装载目录名）与 `allow_no_decision_owner`；`do_review()` 三层口径 —— ① 申报 ⇒ `mode=declared_by_api`（带 `cannot_verify` 诚实标注）② 显式豁免 ⇒ `waived_by_api` ③ **带了 BASE 却没申报也没豁免 ⇒ HTTP 409**；响应体加 `decision_owner` 留痕。'
      why: CLI 侧已把「判定主体缺席」挡成 NEEDS_INPUT，而机器入口原先**只有层前置**（实测 `grep -c decision_owner kb_api.py` = 0）⇒ bot 那条路**绕过防线2**。现在两侧**同一强度**。
      verified: 重启服务后实测三分支：① → **409**（detail 说明自相矛盾）② → **200** ＋ `declared_by_api`（含「本接口核不了该 skill 有没有被真的加载」）③ → **200** ＋ `absent_by_api` ＋「不得当通过依据」。
    fix4_autorun_lock_leak:
      what: '两侧一起改：`kb_pipeline.py` 装 `SIGTERM → SystemExit` 处理器（让 `finally: release_lock()`（:958）能跑到）；`review_freshness_gate.py` 的 autorun 由 `subprocess.run(timeout=)` 改成 `Popen` ＋ **超时先 SIGTERM**（`AUTORUN_TERM_GRACE=20s`）**再 SIGKILL**，并在 `finally` 里核一次锁、把「本次 autorun 留下锁」写进台账（**不自动撬锁** —— 库规要求先 `--check` 再删）。'
      why: '`subprocess.run(timeout=)` 超时直接 **SIGKILL** ⇒ `finally` 跑不到 ⇒ 锁留在 `kb/.work/.kb.lock`。实测代价：2026-10-03 18:53:13 漏下 `run_id=20261003-185311-autorun` 那把锁，**挡停了随后的一次日更**（`L1 写档 → exit=2`，「遇红即停」）。'
      verified: 语义对照实测（独立复现）：装处理器 ⇒ `kill -TERM` 后 **finally 跑、锁释放** ✅；不装 ⇒ **锁残留** ❌。★ 集成侧（`kb_pipeline` 自己的 `finally`）由**代码审读**确认（:958），**没有**拿真 `--apply` 去 SIGTERM —— 那正是库里警告的「崩在中途」场景，不做。
