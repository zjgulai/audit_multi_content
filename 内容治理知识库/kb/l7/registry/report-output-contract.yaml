      - '`--report-ref <url>`：把**真链接**填进回执那一格（重渲染；纯确定性函数，同输入同输出）'
      - '`_item_blocks()` / `_provenance()`：把逐条块与边界节**抽成回执与报告共用**的两份'
      - '`_write_report()`：**先写临时件、再 `/bin/cp`** —— python 直写会带 **4096 字节信封**（宿主读成 binary）'
      - '`_md_cell()`：表格单元格转义 `|`（见下方 bug ①）'
      - 判据 `⑥d`：表格行里**未转义的 `|` 恰好 3 个**；变异测试证过（去掉转义即红）
