# ledger-read-contract.yaml —— 三本追加式台账的**读侧取用键与 keep_rule** 登记
#
# 谁读它：人（评审/新成员）与 `kb/l7/scripts/daily_health.py` 一类巡检；**不是**给闸门复算用的
#         （本文件不含可复算数字，故无对应 checker —— 这点如实写明，不假装有闸门在管）。
#
# 为什么要有这份登记（批次11 · C-3，2026-10-02）：
#   「同键取行序最靠后」这个取法**项目里早就在用**（`kb/.work/l5_prep.py:183`、
#   `kb/.work/l5_export.py:58`、`kb/.work/l4_integrity.py:116-117`，并由
#   `kb/l3/registry/l3.json` 的 `dedup.wording_last_wins` 登记在案），
#   但 **L0/L1/L3 三本主台账各自的取用键与 keep_rule 从没登记过** ——
#   只有 `sample_case` 有 `keep_rule`（且写的是「最靠前」）。
#   后果：写入侧各自无条件追加、读侧各自默认取最后一行，**没有任何一处声明它们是同一套契约**，
#   于是「台账每跑一遍就翻一倍」既没人拦、也说不清算不算违背契约。
#
# 与既有惯例的关系：**不另立一套**。字段名沿用 `l3.json:dedup.wording_last_wins`
#   （file / key / rule / row_order_is_version_order / why / existing_consumers）。
#
# 纪律（与 `l3-known-drift.yaml`、`l0-expected-diffs.yaml` 同一套）：
#   * 这里登记的是**读侧口径**，不是豁免；原始行数一律照打，不抹掉。
#   * 登记之后，「同键取最后一行」就是**有据可依的契约**，
#     写入侧据此才敢只在**内容真变**时追加（见 `kb/kb_ledger.py` 与 `kb/l8/l0_ledger.py`）。

meta:
  file: kb/l7/registry/ledger-read-contract.yaml
  created_at: "2026-10-02"
  batch: "批次11 · C-3"
  owner: 刘华丽
  checker: null
  checker_note: "本文件登记的是读侧口径，不含可复算数字，故无闸门消费它（如实写明，不虚构 checker）"
  baseline_measured_at: "2026-10-02（批次11 执行前实测；行数为当时值，随台账增长而变）"

# ── 三本主台账 ────────────────────────────────────────────────────────────
contracts:

  l1_manifest:
    file: kb/l1/manifest_l1.jsonl
    layer: L1
    key: resource_key
    rule: "每个 resource_key 取【行序最靠后】的那一行（后写覆盖先写）"
    row_order_is_version_order: true
    why: >-
      该文件是跨层 append-only：初抽取 → OCR 回填 → 失效标记 → 重抓刷新，
      每次都是「同一 resource_key 再追加一行表达新状态」。
      追加顺序即状态演进顺序，故取最后一行 = 取当前状态。
    why_not_earliest: >-
      取最靠前会读到初抽取时的状态，把后续的 invalidated / 刷新结果全部丢掉。
    existing_consumers:
      - "kb/l8/extract_l1_new_resources.py:85-88（l1_latest[...] = r）"
      - "kb/l8/extract_pdftext_full.py:193-195（lat_l1[...] = r）"
      - "kb/l8/l2_staleness_audit.py:89-91（l1_status[resource_id] = status）"
      - "kb/l8/l2_align_current.py:77-78"
      - "kb/l8/l2_gap_reconcile.py:98-99（注释明写「同 resource_id 取文件顺序最后一行」）"
      - "kb/l8/align_l1_manifest.py"
      - "kb/l1/index/rebuild_l1_index.py"
      - "kb/l7/scripts/l1_status.py（只读全列，不合并状态）"
      - "kb/l7/scripts/media_status.py"
      - "kb/l7/scripts/l2_gate.py:192-198（C5 上游可溯：只取 resource_id 集合，与行序无关）"
    baseline:
      measured_at: "2026-10-02（批次11 前）"
      rows: 6351
      unique_keys: 2449
      duplicate_rows: 3902
      note: "重复组里 517 组仅时间戳不同；910 组有非时间戳差异（涉 status/status_reason/source_sha256 等，属真实状态演进）"

  l3_manifest:
    file: kb/l3/manifest_l3.jsonl
    layer: L3
    key: rule_id
    rule: "每个 rule_id 取【行序最靠后】的那一行（后写覆盖先写）"
    row_order_is_version_order: true
    mixed_log_warning: >-
      本文件是**混合日志**：规则行有 `rule_id`，later 批次追加的 sample_case 行只有 `id`。
      取用时必须先判 `rule_id` 是否存在，否则会崩（`kb/l8/l3_distill_run.py:414-417` 已按此处理）。
    why: >-
      跨层 append-only：L3 蒸馏写 provisional 行 → L5 前置（l5_prep.py）追加带
      rule_kind/authority/p_level 的富化副本。追加顺序即版本顺序。
    existing_consumers:
      - "kb/l8/l3_distill_run.py:409-417（prev[rule_id]，幂等比较用）"
      - "kb/.work/l5_prep.py:195-196（latest[rule_id]）"
      - "kb/l8/l3_clause_distill.py"
      - "kb/l7/scripts/daily_health.py:69-70（只做 mtime 新鲜度，不取内容）"
    baseline:
      measured_at: "2026-10-02（批次11 前）"
      rows: 11470
      unique_keys: 633
      duplicate_rows: 10837
      note: >-
        633 个键里 509 个组的 `distiller_version` 序列是
        ('l3-0.1','l3-0.2','l3-0.2',…) —— 即版本升级那一行之后全是同内容重复，
        仅 `observed_at` 在变。这是本批 C-2 去重收益最大的一本。

  l0_manifest:
    file: kb/l0/manifest.jsonl
    layer: L0
    key: resource_key
    rule: "每个 resource_key 取【行序最靠后】的那一行（后写覆盖先写）"
    row_order_is_version_order: true
    why: >-
      跨脚本 append-only：认领新记录 / 补记附件 / 核验 URL / 落附件字节，
      各脚本各追加一行表达该资源的最新状态。
    existing_consumers:
      - "kb/l8/align_l0_feishu.py:113-122（man_latest[resource_key]；另计 man_rows 总行数）"
      - "kb/l8/extract_l1_new_resources.py:75-81（l0_latest / l0_active / l0_gone 全按它取）"
      - "kb/l8/ingest_l0_new_records.py:162-166"
      - "kb/l8/verify_l0_urls.py:51-55"
      - "kb/l8/store_l0_attachments.py:54-58"
      - "kb/l8/audit_l0_duplicates.py:37-43（专门审行重复）"
      - "kb/l7/scripts/l2_gate.py:83（L0_MANIFEST 路径常量；用于 input_set 判定）"
      - "kb/l7/scripts/daily_health.py:75（只做 mtime 新鲜度）"
    dedup_impl: >-
      **本台账已有专门的去重写入器** `kb/l8/l0_ledger.py:append_changed()`（2026-09-30 补）：
      未变的行不追加，只刷新 sidecar `kb/l0/registry/last_seen.json`（保住「这轮还看见它」，
      使「失踪」与「没查」分得清）。批次11 把绕过它的两个写入点（
      `emit_l0_manifest_reconcile.py`、`ingest_l0_new_records.py`）之一改回走它。
    baseline:
      measured_at: "2026-10-02（批次11 前）"
      rows: 7020
      unique_keys: 2167
      duplicate_rows: 4853
      note: >-
        重复组里 `change` 字段在 2164 组中的 1978 组发生变化，但
        `status` 序列多为 ('registered','registered') 这类**同值重复** ——
        即大量行连业务状态都没变，只是又被登记了一遍。

  # ── 第 4 本（2026-10-08 补登记）：L3 逐单元拒绝台账 ──────────────────────────
  # ★★ 为什么它迟了 6 天 —— 这一条本身就是本文件抬头那句话的**实例**：
  #   本文件在 2026-10-02 就写下了这个病的确切形状：
  #     「写入侧各自无条件追加、读侧各自默认取最后一行，**没有任何一处声明它们是同一套契约**，
  #       于是「**台账每跑一遍就翻一倍**」既没人拦、也说不清算不算违背契约。」
  #   但那一批只登记了上面三本主台账 —— **`kb/l3/rejected.jsonl` 不在其中**。
  #   ⇒ 它继续每跑一遍翻一倍（4 版 × 8050 行），直到 2026-10-08 被撞上才补登记。
  #   **教训**：写下判据 ≠ 覆盖到每一本账。补登记时必须按「库里有几本 append-only 台账」逐本核，
  #   不能按「上次登记了哪几本」顺延。
  l3_rejected:
    file: kb/l3/rejected.jsonl
    layer: L3
    key: unit_id
    rule: >-
      同 `unit_id` 取【行序最靠后】的那一版；
      **无 `rebuild_note` 的行是「原始行」，不参与版本比较**（它们不属于任何版本，单独保留、不并入取值）。
    row_order_is_version_order: true
    why: >-
      本文件是**快照被写进了事件流**：重建脚本每跑一遍就把「当前全量拒绝集」整份追加一次。
      追加顺序即版本顺序，故取最后一行 = 取当前口径。
    why_not_earliest: >-
      最靠前那版用的是**已被证伪的理由**（`sample_only_no_verdict`，见
      `rejected_ledger_scope_change.code_reference`）—— 取最靠前会把排查引到错方向。
    why_not_max_string: >-
      ★ **不许按 `rejected_at` 字符串 `max()` 取版本**：本库 RUN 有两种形态
      （`20261008-1500-scope-fix` 与 `daily-20261007-1605-L3`），字典序里 `'d' > '2'`
      ⇒ 字符串 max **恒选中旧的 daily 版**。2026-10-08 真踩过：幂等判断因此把刚写好的正确版
      当成「上一版」，又追加了一遍（+8103 行）。**判据 = 该版最后一次出现的行号。**
    mixed_kinds_warning: >-
      本文件是**混合台账**，取用前必须先判 `rebuild_note` 在不在：
        · 有 `rebuild_note` = 重建行（带 `unit_id`，多版）；
        · 没有         = 20260929-1300 事故后的**资源粒度原始行**（多数无 `unit_id`）。
      **直接 `len(全部行)` 得到的是虚高约 6 倍的数**（实测 51017 vs 最新版 8103）。
    gate_code_semantics: >-
      `gate_code`（2026-10-08 加）回答的是**「它进没进门」**，与 `reason`（为什么没成规则）分开：
        · `out_of_scope_kb`    —— kb_type 不在 L3 蒸馏范围；
        · `out_of_scope_table` —— `internal_sample` 只收「专家修订汇总表」，本单元来自别的表；
        · `metadata` / `metadata_unknown_field` —— `unit_type=entry` 且 heading_path 不是内容字段；
        · `quality_flag`       —— 上游标了 `content_quality_flag`；
        · `null`               —— **进了门**，但未产出规则（这才是「蒸不出来」）。
      它与活引擎**共用同一把尺子**（`kb/l8/l3_scope.py::build_scope().exclusion_of`，
      两个引擎都 import 它），故不会分叉。
    read_only_entry: "kb/l7/scripts/l3_rejected_status.py（2026-10-08 新增；默认打四个数 + 最新版 gate 分布）"
    existing_consumers:
      - "kb/l7/scripts/l3_rejected_status.py（本文件登记后新增的读侧入口）"
      - "kb/.work/l3_report.py:35（L3 落章引擎）—— **它读的是 `len(RJ)` = 总行数，虚高**；见 `known_consumer_overcount`"
      - "kb/l8/l3_reject_ledger_rebuild.py（写入者自身；幂等比较取行序最后一版）"
    known_consumer_overcount:
      consumer: "kb/.work/l3_report.py:35 与 kb/l7/scripts/l3_status.py"
      symptom: "打「拒收（内部）51017 行」—— 比可办事的数字（最新版 8103）**高约 6 倍**"
      status: "**未改**（2026-10-08 只登记，不改历史脚本与落章引擎）"
      correct_reading: "要「有多少条被拒」请读 `l3_rejected_status.py` 的**最新一版条数**，不读总行数"
    baseline:
      measured_at: "2026-10-08（补登记时实测）"
      rows: 51017
      original_rows: 2611
      rebuilt_rows: 48406
      versions: 6
      latest_version: "20261008-1510-idempotent-check"
      latest_rows: 8103
      latest_gate_distribution:
        metadata: 2932
        进了门未产出规则: 2220
        quality_flag: 2278
        out_of_scope_table: 535
        metadata_unknown_field: 127
        out_of_scope_kb: 11
      note: >-
        6 版 = 4 版旧日更（各 8050，**理由已被证伪**）+ 2 版 2026-10-08 修正版（各 8103，
        内容全等；第 2 版是**字符串 max 那个坑造成的重复**，如实登记、**未删除**）。
    write_side_fixed:
      at: "2026-10-08"
      what: >-
        `kb/l8/l3_reject_ledger_rebuild.py` 加**幂等闸**：与本台账最新一版逐 (`unit_id`,
        `reason`, `gate_code`) 比，全等 ⇒ 不追加（并落一份 `idempotent: true` 的留痕报告）。
      verified: "重跑实测 51017 → 51017（收敛）；且幂等路径也写留痕（否则「跑过无变化」与「没跑」分不开）"
      does_not_fix_history: "**幂等只止住往后；已有 6 版一律不动**（红线：不删台账行）。"
    why_history_not_deleted: >-
      **不删**。① 本项目明文红线：`kb/l3/rejected.jsonl` 是有覆盖事故前科的文件，
      「不许删台账行让闸门变绿」；② 那 4 版旧理由**本身就是证据** ——
      它记着「当时账上写的是什么」，正是 `sample_only_no_verdict` 这条假理由骗过人的凭据。
      ⇒ 「作废」用**追加**表达（本节即该声明），不用删除表达 ——
      与 `kb/l2/_archive` / `rules-superseded-*.jsonl` / `retired`/`invalidated` 行同一套既定做法。

