# ── observed_at 语义变化登记（批次12 · 第0块裁定②）──────────────────────────
observed_at_semantics:
  registered_at: "2026-10-02"
  batch: "批次12 · 第0块"
  the_change: >
    批次11 给三本台账加了写入侧去重（同键且除运行元数据外全等 ⇒ 不追加）之后，
    台账里某一行 `observed_at` 的含义**变了**：
      改前 = 「**最后一次被看到**」      改后 = 「**最后一次内容变化**」
    这不是 bug，是去重的必然推论：内容没变就不追加，那一行当然停在上次变化的那一刻。
  why_it_matters: >
    任何把 `observed_at` 当**新鲜度**读的地方，从此会把「一直没变」误判成「很久没查」。
  ruling: >
    用户批次12 第0块裁定②给了二选一（补 sidecar ／ 不补但必须逐个点名消费点），
    并要求「不许两不做」。**本库选「补 sidecar」**。
  chosen: sidecar
  chosen_impl: "kb/kb_ledger.py:refresh_last_seen()（批次12 新增）"
  isomorphism: >
    **与 `kb/l8/l0_ledger.py:append_changed()` 同构，不另造一套**（用户同一条纪律）。
    实测字段对照：
      l0_ledger 条目字段 = [run, sha256, sha256_input, status]
      kb_ledger 条目字段 = [observed_at, run, sha256, source_sha256, status]
      共同字段 = [run, sha256, status]
    差集是各自台账有意义的量（L0 有 sha256_input；L1/L3 行没有它，但有 observed_at /
    source_sha256）。共同字段完全一致，故为同构而非分叉。
  sidecars:
    - kb/l0/registry/last_seen.json   # 既有（l0_ledger 写，2026-09-30 起）
    - kb/l1/registry/last_seen.json   # 批次12 新增（apply_ocr_to_l1 / extract_l1_new_resources 写）
    - kb/l3/registry/last_seen.json   # 批次12 新增（l3_distill_run / l5_prep 写）
  audit_of_observed_at_consumers:
    method: "grep -rn 'observed_at' --include=*.py kb/ | 排除 _backups | 再筛 days/age/stale/now/delta/新鲜/陈旧/距今"
    finding: >
      **全库把 `observed_at` 当新鲜度计算的消费点：0 处。**
    evidence:
      - kb/l7/scripts/daily_health.py:142-145 → 新鲜度用的是 `os.path.getmtime`（**文件 mtime**），不读 observed_at
      - kb/l8/l2_staleness_audit.py:150 → `"l1_observed_at": art.get("observed_at")` 只是把值抄进报告，**不比较、不判龄**
    honest_note: >
      ⇒ **本 sidecar 补的是「信息保全」，不是修一个正在发作的 bug。**
      `observed_at` 的语义变化**当前不造成任何误判**（因为没人拿它算龄）。
      之所以照裁定补，是因为它便宜、且能把「失踪 vs 没查」这个区分保住 ——
      将来谁想用 observed_at 算龄时才不会踩空。这一点如实写明，不夸大成"修了一个缺陷"。

