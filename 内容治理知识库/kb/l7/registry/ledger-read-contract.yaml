# ── 批次18 · 4-3：继承清单的**机械产出**（判据需分层）────────────────────────
inheritance_list_mechanical:
  registered_at: "2026-10-02"
  batch: "批次18 · 4-3"
  why: >
    批18 我**手工**把继承字段从用户给的 8 个补到 10 个。用户指出
    「手工加会漏第 11、12 个」⇒ 要求给一条**机械产出**的命令。
  command: >
    python3 -c "
    import json,glob,os,collections;
    CAND=\x7b'wording_entry':'kb/l3/candidates/rules.jsonl',
    'wording_revision_pair':'kb/l3/candidates/rules.jsonl',
    'sample_case':'kb/l3/candidates/sample_cases.jsonl',
    'scoped_clause':'kb/l3/candidates/scoped_clauses.jsonl',
    'clause':'kb/l3/candidates/external_standard.jsonl'\x7d;
    ck=collections.defaultdict(set);
    [ck[n].update(json.loads(l)) for f in glob.glob('kb/l4/canonical/*.jsonl')
     for n in [os.path.basename(f)[:-6]] for l in open(f,encoding='utf-8') if l.strip()];
    cd=collections.defaultdict(set);
    [cd[k].update(json.loads(l)) for k,v in CAND.items() for l in open(v,encoding='utf-8') if l.strip()];
    print(sorted({x for k in ck for x in ck[k]-cd[k]}))"
  raw_result: >
    跨件并集 = **16 个键**：
    `authority, authority_source_table, baseline_date, cite_check, distiller_version,
     effective_from, half_life_days, kb_version, never_resets_on_regeneration, p_level_basis,
     promoted_at_run, promoted_from, promotion_basis, risk_evidence_records, rule_kind, valid_until`
  ★ layering_required: >
    **16 个不能一律继承** —— 必须分两层（否则会**冻住**重推本该刷新的字段）：
      A) **必须继承**（治理/权威值，重推**不产生**）= 11 个：
         `authority, authority_source_table, baseline_date, distiller_version, effective_from,
          half_life_days, never_resets_on_regeneration, p_level_basis, risk_evidence_records,
          rule_kind, valid_until`
      B) **重推无条件重算**（继承会冻住它 ⇒ **不继承**）= 5 个：
         `cite_check, kb_version, promoted_at_run, promoted_from, promotion_basis`
         （判据 = 它们出现在 `fix_l4_repromote.py` 的 `triple()` 返回里）
  verdict_on_hand_list: >
    我手工的 10 个**全部落在 A 层**，未漏任何「必须继承」的字段。
    机械清单多出的 7 个里：`baseline_date` 属 A（**机械产出确实补出了它** ——
    A 层 11 = 我的 10 + `baseline_date`），其余 6 个里 5 个属 B、`kb_version` 亦属 B。
    ⇒ **用户「会漏第 11、12 个」的担心方向正确**（确实补出了 `baseline_date`），
    但「一律机械并入」会误伤 B 层 ⇒ **判据分层后机械产出才可用**。
  recommend: >
    下一批把 `INHERIT_FIELDS` 改为**从本命令的 A 层结果生成**（而非手工列表），
    并加一条断言：A 层 11 个必须 ⊆ `INHERIT_FIELDS`。**本批未改代码**（预算）。

