# ── 批次21 · 第0块②：E2 的「假绿」登记（**必读，否则会再把那次当绿**）────────────
e2_green_is_vacuous_when_layers_underclaimed:
  registered_at: "2026-10-02"
  batch: "批次21 · 第0块②"
  the_case:
    run_id: "20261002-1525"
    claimed_layers: ["L5"]          # ← extra.layers 实测只有 1 层
    claimed_layer_count: 1
    skill_evidence: registry_echo
    stamps_found: >
      L0「（无）」｜ L1「（无）」｜ L2「（无）」｜ L3「（无）」｜ L4「（无）」
      ｜ **L5「有」**（`kb/l5/runs/20261002-1525.json`）｜ L6「（无）」
    e2_red: 0
    why_it_judged_green: >
      `skill_invocation_audit.stamp_of()` 只对**该 RUN 声称走到的层**（`extra.layers`）逐层查落章
      （见 `skill_invocation_audit.py:254-270` 的 `for lid in lids:`）。
      该 RUN 声称 **只 1 层**，而 L5 **恰好有 1 份落章** ⇒ 查一层、中一层 ⇒ **E2 红 0**。
  why_it_is_vacuous: >
    ★ **E2 = 0 只在「声称的层数覆盖了全部应查层」时才可信。**
    该 RUN 声称层数（1）**远少于**库内应查层数（L0–L6 共 **7** 层，L7 属跨层闸门豁免）
    ⇒ 它「没红」是因为**根本没去查另外 6 层**，不是因为那 6 层有证据。
    **这是「判据范围被声称值缩小」造成的空泛绿**，与「登记在撒谎」同族：
    数字本身没错（那 1 层确实有落章），**但它被当成了「逐层都调了」的证据**。
  counter_example_that_exposed_it:
    run_id: "20261002-1953"
    claimed_layers: ["L0","L1","L2","L3","L4","L5","L6","L7"]
    claimed_layer_count: 8
    stamps_found: "L0–L6 **全 0**；L7 有 1 份（编排器自己的记账，已豁免）"
    e2_red: 7
    reading: >
      **同一套判据**，只因为新账**如实声称走了 8 层**，E2 立刻从 0 变 **7**。
      ⇒ 证明 `1525` 的 0 是**声称范围小**造成的，不是证据充分。
  correct_reading:
    - "**不许**把 `20261002-1525` 的 `E2=0` 当作「逐层都调了」的证据 —— 它只证明了 L5 那一层。"
    - "**不许**把两次的 `E2` 直接相减说成「退步」—— 两次的**判别范围不同**，不可比。"
    - "要判「七层都调了」，必须让该 RUN 的 `extra.layers` **覆盖全部应查层**，再看 E2。"
    - "`E1` 与 `E2` 要**一起**读：E1=0 且 E2=0 且**声称层数 == 应查层数**，才算逐层有证据。"
  general_warning: >
    ★ **通用警告**：「E2 = 0 只在『声称的层数覆盖了全部应查层』时才可信；
    声称层数少于实际应查层数时，E2 的绿是空泛的。」
    读 E2 前**先读 `extra.layers` 的条数**；两者对不上，绿不算绿。
  no_backfill: >
    **未回填** `20261002-1525`（纪律 4）。本条只是**登记读法**，不改任何历史产物。

