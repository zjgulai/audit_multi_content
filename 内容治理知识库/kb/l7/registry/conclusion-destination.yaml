# conclusion-destination.yaml —— 内容治理 · **验证结论的填写去向**登记
#
# 这条登记只回答一件事：**评审链出的三态结论，人应当填到哪里**。
# 它与 kb/l7/registry/ 下的三张姊妹表互补：
#   * skills.yaml                    答「有哪些成员」
#   * layers.yaml                    答「链路怎么跑」
#   * routes.yaml                    答「这句话该谁接」
#   * conclusion-destination.yaml    答「结论填到哪」（本表）
#
# 边界（写清楚，免得被误用）：
#   · 本件是**去向声明件**，不被任何 gate 读取，也没有自动对账器（checker: null）。
#   · **KB 侧只登记去向，不在 KB 内改写结论。** 结论正文仍由评审链各自产出
#     （kb-content-review / kb-review / brand-* 专项），写进飞书表是**填写动作**，
#     不是 KB 的写库动作。
#   · 本件**不参与** L0–L7 数据链路，不改变任何层的 inputs / outputs，
#     也不改变任何判据。新增或变更去向时人工维护本文件。
#
# 登记时间 2026-10-02（首次登记）。

