# PRD §5.3.3「输出字数与格式硬约束」—— **唯一真源**
#
# 取数：飞书 PRD（docx `PXfBdjTwFokEQixtmTscqm7knNh`）§5.3.3 正文，
#       拉取时刻 2026-10-19 ｜ revision **248**。逐字如下（核过，见 `verbatim`）。
# 两侧共用：守衡 `agent/prd533.mjs` 读它；知识库 `kb/l8/prd533_check.py` 读它。
meta:
  prd_ref: '§5.3.3'
  source: '飞书 PRD 正文（不是内嵌表）'
  fetched_at: '2026-10-19'
  revision: 248

# Owner 对守衡输出的实施覆盖值（2026-10-21）。`verbatim` 保留上游 PRD 原文；
# 守衡执行/校验使用 `fields` 中的 60 字上限，避免伪称上游文档版本已同步。
runtime_override:
  decided_at: '2026-10-21'
  decided_by: 'Owner（本会话明确指示）'
  advice_limit: 60
  reason: '卡面实际建议 30 字截断了免责声明，具体改法没有显示；改为 60 字并将免责声明从建议格剥离。'

verbatim: |
  5.3.3 输出字数与格式硬约束
  - 单条问题：描述 ≤50 字，原因 ≤50 字，修改建议 ≤30 字。
  - 位置：必须精确到"图 N 第 X 处"、"视频 00:12"、"正文第 X 段"。
  - 依据：必须写"《文档名》第 X 条"或"规则 ID"，禁止写"相关法规"。
  - 语言：客观、指令式。禁止"可能"、"建议可以考虑"等废话（除非是 REVIEW 的边界说明）。

counting:
  rule: visible_no_url          # 与 §17 同一口径：去链接、去 markdown 标记、去空白
  note: 'PRD 只写「≤N 字」，未写怎么数；沿用 prd17-limits.yaml 已定的口径，两处一致'
  # ── ★★ Owner 2026-10-19 定义计数口径；2026-10-21 将运行上限调整为 60 ──
  #    `advice` 这一格的字数 = **实词字数**：标点不计入上限。
  #    例：`删「最」字，改为「更」；补一行日期` —— 字符 18、**实词 11** ⇒ 算 11 字。
  #    ⚠️ 只对 `advice` 生效（Owner 说的是「修改建议」）；描述 / 原因仍按 `visible_no_url`。
  #    ⚠️ 不扩到 §17 的**整卡**字数（那是一条独立指标：≤100/≤200 是整张卡的预算）。
  advice_no_punct: true
  advice_punct_class: '[，。、；：！？…—～·「」『』（）【】《》〈〉“”‘’,.!?;:''"()\[\]{}<>]'
  advice_punct_note: >
    只去**标点**：`-` `/` `_` `&` `%` 不在此列 —— `best-selling` 里的连字符是**词的一部分**，
    算成标点会让英文建议凭空少 1 字。唯一真源：守衡 `tools/agent/prd533.mjs::countAdviceChars`
    ↔ 本库 `kb/l8/prd533_check.py::count_advice_chars`（两侧必须逐项相等）。
  # ── ★★ 2026-10-20（Owner 逐字）：「修改建议上限，标点不算字数」──────────────
  #    这是对上面 2026-10-19 那条的**再次确认 + 扩用范围**：
  #    · 2026-10-19 定的是「**怎么数**」（量的时候不算标点）；
  #    · 2026-10-20 点的是「**怎么截**」—— 渲染层的 **clip 也必须按实词数**。
  #      实测病灶：kb 侧 `kb/l5/advice_book.py` 按 `len(text)` 逐字符量（连标点算），
  #      守衡 `dual_track.mjs::renderMergedItem` 的 `_clip` 同样按字符数截 ⇒
  #      一句「18 字符、11 实词」的合规建议会被**提前截断**，而一句 30 实词 + 标点的建议
  #      会被**误截成半句**（截出来不是动作，是残句）。
  advice_clip_no_punct: true
  advice_clip_note: '截断与度量**同一把尺**：先 `advice_chars` 数，≤60 原样给；>60 才截，截完仍按实词复核。'

# ── 每题逐字段上限 ────────────────────────────────────────────────────────────
fields:
  - {key: description, label: 问题描述, limit: 50}
  - {key: reason,      label: 原因,     limit: 50}
  - {key: advice,      label: 修改建议, limit: 60}

# ── 位置：必须落在下列模式之一 ────────────────────────────────────────────────
location:
  patterns:
    - {id: figure, regex: '^图\s*\d+\s*第\s*\d+\s*处$', sample: '图 1 第 2 处'}
    - {id: video,  regex: '^视频\s*\d{1,2}:\d{2}$',      sample: '视频 00:12'}
    - {id: text,   regex: '^正文第\s*\d+\s*段$',          sample: '正文第 3 段'}
    # ── ★★ 2026-10-20（Owner 逐字）：「位置：图 1 ==〉你要写上尽详细具体位置，比如：
    #    **图片顶部，图 1 第 3 处**（这里第x处你如何判定的？）」──────────────────────
    #    这是**后令**：2026-10-20 早前那条「写法逐字照抄、不许加括号补充」管的是
    #    **括号补语**（`图 1 第 4 处（奖品说明句）`），不是**区域词**。区域词是「具体位置」
    #    的一半，Owner 明确要它 ⇒ 新增这条形态，原来的 figure 仍然有效（不写区域也合规）。
    #    ⚠️ 区域词只许这 6 个：顶部/中部/底部/左侧/右侧/整图 —— 开放式写法会把
    #      `图 1 第 3 处（随便写）` 也放进来（那正是上一轮禁掉的括号补语）。
    - {id: figure_area, regex: '^(?:图片)?(?:顶部|中部|底部|左侧|右侧)[，,]\s*图\s*\d+\s*第\s*\d+\s*处$', sample: '图片顶部，图 1 第 3 处'}
    # ── ★★ 2026-10-22（Owner 裁定：「给面板形态开口子」）────────────────────────────
    #    真单驱动：10:49 那张图单的 3 条发现写成「图 1 上方面板 / 图 1 下方面板 / 图 1 主视觉」，
    #    被出口闸（material_evidence_gate R3）判成「证据对不上本单素材」。而这三条是**画面面板**
    #    上的发现 —— 它们没有「图内文字块阅读顺序行号」可写，硬编一个「第 X 处」等于**编造读数**。
    #    ⇒ 新增 `figure_panel` 形态：**面板名**闭集（上方面板/下方面板/左方面板/右方面板/主视觉/整图），
    #    可选区域前缀（与 figure_area 同一份区域词表）。
    #    ⚠️ 双向边界（两条都有反向对照）：
    #      ① 面板形态**不许**再带「第 X 处」（面板上没有可复核的文字行号 ⇒ 那是编出来的）；
    #      ② 面板名是**闭集**，`图 1 随便写` 一个字都不许进（开放集等于把闸门关掉）。
    - {id: figure_panel, regex: '^(?:(?:图片)?(?:顶部|中部|底部|左侧|右侧)[，,]\s*)?图\s*\d+\s*(?:上方面板|下方面板|左方面板|右方面板|中间面板|主视觉|整图)$', sample: '图片顶部，图 1 上方面板'}
  strict: true
  note: '`全文` 不在模式内；括号补充（「正文第 4 段（…）末句」）也不在。区域词只许 顶部/中部/底部/左侧/右侧，且必须在「图 N 第 X 处」**前面**、用逗号隔开。**面板类发现**（画面面板，没有文字行号可复核）走 `figure_panel`：面板名闭集，且不许带「第 X 处」。'
  # ── 「第 X 处」到底怎么判定（Owner 当场问：「这里第x处你如何判定的？」）──────────
  figure_index_basis: '图内文字的**阅读顺序行号**（自上而下、同一行自左而右，从 1 数）—— 即素材块 `【图 N 内文字｜M 行】` 里的**第 X 行**。X 必须能被该行文字复核：声称第 3 处，引文就要落在第 3 行里（判据 `kb/l8/report_conformance.py::R3b`）。'
  figure_index_status_20261020: >-
    **现状不合格，如实记**：报告的 X 现在是**模型自报**（守衡 `model_side.mjs:129`
    「X=该图上的第几处，从 1 数」），**没有区域锚点**，也没有和素材块行号对齐 ⇒
    今天「第 3 处」**不可复核**。钉住它的判据是 `report_conformance.py::R3b`（素材在手时判，
    素材不在就报「未测」，不判绿也不判红）。

# ── 依据：必须是《文档名》第 X 条 或 规则 ID；禁「相关法规」 ──────────────────────
basis:
  patterns:
    - {id: doc_article, regex: '《[^》]+》\s*第\s*[0-9A-Za-z.\-]+\s*条', sample: '《措辞表达库 v0》第 W-1.18 条'}
    - {id: material_quote, regex: '送审素材原文[：:（(]', sample: '送审素材原文：「thefirst 6months」'}
    # ⚠️ 规则 ID 在本库有**三种**形状，都要认（漏一种就会把合规的判成不合规）：
    #    ① `W-1.18` / `S-1.209`（条款号形态）② `H02` / `M03` / `V01`（模式码形态）
    #    ③ `r-37b49ead…` / `p-755f9ff3…`（哈希 ID）
    - {id: rule_id,     regex: '\b(?:[A-Z]{1,3}-[0-9][0-9.\-]*|[A-Z]{1,2}[0-9]{2,3}|[rp]-[0-9a-f]{8,})\b', sample: 'W-1.18 / H02 / r-37b49ea…'}
  forbidden: ['相关法规', '相关法律法规', '有关规定']
  no_basis_allowed: '可以**如实**写「无库内依据」，但必须**同时给出替代出处**（外部标准名或「独立复核判断」），不许只说「无依据」'
  # ── ★★ 2026-10-20（Owner 逐字）：「**依据文档链接中不要写【问题要点】**，字数超过 prd
  #    限制了」──────────────────────────────────────────────────────────────────────
  #    病灶（真单核对，逐字）：那一格印成
  #      `《内部正负样本库》第 S-1.195 条 ← 命中「【原则性错误】图片 图1 【终审-@吴礼芳 】…
  #        【问题要点】 1. … 2. … 3. …」｜原始出处：…`
  #    ① 把**源记录自己的分节标记 `【问题要点】`** 连同它下面 1/2/3 条要点一起抄进了依据格；
  #    ② 那一格实测 **181 字**，而 §17 对「逐条」的单条预算是 200 —— 依据一格吃掉 90%，
  #       位置/描述/原因/建议四格再写就必超。
  #    ⇒ 依据格 = 「《库名》第 X 条 ← 一段命中片段（≤60 字）｜原始出处：链接」。
  #      分节标记与它下面的清单**不是命中片段**，不许进这一格；要写就写进「问题描述」。
  forbidden_fragments: ['【问题要点】', '问题要点', '【原则性错误】']
  forbidden_fragments_note: >
    这是**源记录的排版标记**，不是依据内容。任何库（正负样本/外部标准/规则）的 `reason_analysis`
    都可能带它 —— 取摘录时要按它切段，不许整段抄（切段实现：`review.py::case_excerpt`）。
  max_chars: 60
  max_chars_note: >
    **解释，不是 PRD 原文**（PRD §5.3.3 只给「《文档名》第 X 条 或 规则 ID」的形态，没给字数）。
    60 的来路：§17 逐条预算 200 减去 PRD 五格（描述 50 + 原因 50 + 建议 30）已占的 130，
    剩 70 给「位置 + 依据标签」；依据的**引文部分**取 60 才不会把整条顶穿。
    取不到出处时宁可短，不许把整段记录塞进这一格。

# ── 语言：禁止的废话 ──────────────────────────────────────────────────────────
language:
  forbidden:
    - {word: 可能,        why: 'PRD 点名'}
    - {word: 建议可以考虑, why: 'PRD 点名'}
    - {word: 或许,        why: '同类推测词'}
    - {word: 大概,        why: '同类推测词'}
  exception: 'REVIEW 的**边界说明**允许（PRD 原文「除非是 REVIEW 的边界说明」）'

