    kb_side: {chars: 16, limit: 50, ok: true}
    model_side: {chars: 71, limit: 50, ok: false, over: 21}
  reason:
    kb_side: {chars: 57, limit: 50, ok: false, over: 7}
    model_side: {chars: 80, limit: 50, ok: false, over: 30}
  advice:
    kb_side_real: {chars: 372, limit: 30, ok: false, over: 342}
    fallback_book: {chars: 16, limit: 30, ok: true}
  location: '`全文` / `正文第 4 段（…）末句` / `素材正文 第三段末尾（…）` 都不匹配三个模式'
  basis: '有库内依据的写成 `《措辞表达库 v0》第 W-1.18 条 ← 命中「…」` ⇒ **匹配**（多出的部分是命中片段，不是违规）'
  language: '真单这两条文本里 0 次命中禁词；但模型侧长文里出现过「可能被平台判为站外引流」这类推测句'

# ── 与 Owner 既有裁定的**直接冲突**（必须 Owner 裁，不许我自选）─────────────────────
conflicts:
  - id: X1
    rows: '修改建议 ≤30 字'
    vs: 'Owner 2026-10-17 裁定「修改建议**都写全**」（当时明确取消了 120 字截断）'
    measured: '真单建议 **372 字** vs 上限 30（超 342）'
    options:
      - '卡上只放 ≤30 字的**动作句**，全文留报告（与 §17 逐条 ≤200/条 也能同时满足）'
      - '放弃 §5.3.3 的 30 字，按 §17 的 ≤200/条（两条 PRD 内部冲突，选后者）'
      - '30 字只约束「兜底改法表」那种自动生成句（`advice_book.MAX_CHARS=30` 已经是这样）'
    # ★★ 2026-10-19 的 30 字执行决策已被 Owner 2026-10-21 的明确调整覆盖。
    #    上游 PRD 原文保留在 `verbatim`；守衡实际执行 60，卡面与报告同一把尺。
    resolution:
      decided_at: '2026-10-19'
      decided_by: 'Owner（内容治理）'
      owner_quote: '审查报告中，修改建议你写了200多字，修改建议 ≤30 字'
      choice: '历史决策：30 字，卡面与报告同一个上限；已由 runtime_override 调整为 60'
      scope: '卡面 `renderMergedItem` 的 `head` 与报告分支（`layout === "report"`）两处**同时**生效'
      supersedes: 'Owner 2026-10-17「修改建议都写全」—— **仅限这一格**；不许再把该格改回全文'
      where_enforced:
        - 'tools/agent/dual_track.mjs :: renderMergedItem（ADVICE_MAX 从本 registry 读取）'
        - 'tools/agent/advice.mjs :: SYSTEM 规则 0（源头与渲染共用 ADVICE_MAX）'
        - 'tools/agent/model_side.mjs :: 提示词 4b（模型侧 `suggestion` 上限）'
      preserved:
        - '全文留在结构化 JSON 与本地留底 `merged-*.full.md`（搬是搬、砍是砍）'
        - '「改法参考了什么」的标注挪到**标题行末尾**（`· 改法参考库内反例`）—— 防「把模型写的改法读成库规原文」'
      judges:
        - 'tools/test_agent.mjs :: Z49f（报告格 ≤30 ＋ 反向对照：整段长建议不许出现）'
        - 'tools/test_agent.mjs :: Z59（卡面与报告同一把尺）'
        - 'tools/test_agent.mjs :: Z26（报告里标注仍在，且修改建议 ≤30）'
      reverse_control: '把报告的 `sugShort` 改回 `sugFull` ⇒ Z49f / Z59 变红'
      lock: 'owner-fix-locks.yaml::L20'

  - id: X2
    rows: '原因 ≤50 字'
    vs: '库侧 `reason` 是**库规原文**（reasons 常 50~90 字），压到 50 就得改写库内文本'
    measured: '库侧 57（超 7）、模型侧 80（超 30）'
    options:
      - '卡上原因压到 ≤50，原文留报告（`reasonLine` 原样进 JSON）'
      - '允许库侧引原文超限（口径：引用不算废话）'
  - id: X3
    rows: '位置必须落在三个模式之一'
    vs: '现行 `location` 常带括号补充（便于人找），且整篇命中的写 `全文`'
    measured: '`全文` / `正文第 4 段（…）末句` 等都不匹配'
    options:
      - '规范化：卡上只印 `正文第 4 段`，括号补充挪进报告'
      - '为 `全文` 增加第四个模式（需 PRD 改口径）'
