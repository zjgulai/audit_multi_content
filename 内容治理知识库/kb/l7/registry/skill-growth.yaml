# ────────────────────────────────────────────────────────────────
# 明确的**不做**
# ────────────────────────────────────────────────────────────────
not_doing:
  - 不自动改 SKILL.md（连那一节的正文也不改）—— 指针节由人过一次，之后脚本**只校验它还在**
  - 不自动发号 / 不自动写 kb/l0…l7 —— 那条要 write-gate 凭据，是人的动作
  - 不自动装到别的装载位（`~/.agents/skills/` 本项目不装）
  - 一轮出现任何一条指针回验不过 ⇒ **整轮不写**（不做半批）
