      —— 它的 REVIEW **不是因为识别到了内容问题**，而是"库对该题材没有可依据的条款"才转人工。
      逐字含 `it actually increased her milk supply`，而 H02 只认 `your` ⇒ 真漏放被覆盖缺口**兜住**。
      改后 H02 命中 ⇒ `coverage_gap` 转 False、`refusal_reason` 清空、`unbacked 1 → 0`
