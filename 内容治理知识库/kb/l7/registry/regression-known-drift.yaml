# regression-known-drift.yaml —— 回归基线里**已登记、且属预期**的漂移（只做降级，不给豁免）
#
# 谁读它：kb/l8/regression_gate.py（`_known_drift()`）。
#
# 规则（与 l0-expected-diffs.yaml / l3-known-drift.yaml / l5-known-drift.yaml 同一套纪律）：
#   * 只有**写清"为什么这是预期改变"**的条目才降级为「黄」；**漏登记 = 判红**。
#   * 登记不等于"以后都可以变" —— 它是**一次性**的：下一次重采基线后本文件应清空。
#   * 原始读数一律照打（闸门会把漂移逐条带出来），不抹掉。
#
# ★★ 这一类与「已知漂移」在本库其他登记件里的用法**有一处不同，说清楚**：
#   别的登记件登的是「**判据本身过期**」（永远红、去修判据）；
#   这里登的是「**判据没错，是这次改动本来就要改这一条**」——
#   即「改动单说好了的预期行为变更」。所以条目里必须能指到那张改动单。

