    blast_radius: "同上；本条正是这次改动的**起因**。"

  RC-11b8f1e6a2c7:
    recorded: "PASS → BLOCK"
    why_expected: >
      **这是红线漏放的修复**，不是回归。素材逐字含
      `designed to follow a baby-like natural sucking rhythm`，
      而 H09（拟真吸吮 / 模仿婴儿，`W-1.1`，PRD §7.3 七类红线之一）的词表
      **只覆盖 `mimics baby's natural nursing` 与 `baby-like suckling`**，
      对这一种英文变形**三条路全不中** ⇒ 整段 P0 快路 hit=False ⇒ 顶层只出一条 P3 ⇒ **PASS**
      （历史报告判 BLOCK ⇒ 该拦没拦）。
    evidence: >
      改前实测：`p0_fastpath.py --text <素材>` ⇒ `hit=False matched_patterns=0`；
      反向对照 `mimics your baby's natural nursing rhythm` ⇒ `hit=True H09/BLOCK`
      ⇒ 不是快路失灵，是这一种变形没进表。
      改后实测：同一素材 ⇒ `hit=True matched=1 state=BLOCK`。
    what_changed: >
      `kb/.work/l5_export.py` 的 `VARIANTS["H09"].regex` 加一条
      `\bbaby[\s-]*like\b[^.]{0,24}\bsuck(?:ing|ling)\b`（**走 regex 不走 synonym** ——
      `sucking` 这个写法源里没有逐字，塞 synonym 会造出「P0 命中却拿不出逐字原文 ⇒ 被契约丢弃」，
      与 H06 `FDA-approved` 同一个教训）。
      重建：`python3 kb/.work/l5_export.py h09fix-20261012-1130 --apply`
      （旧表留档 `kb/l5/runs/h09fix-20261012-1130.p0_patterns.superseded.jsonl`）；
      台账同步：`kb/l8/build_p0_legal_signoff_ledger.py --apply`。
    blast_radius: >
      **全 100 条回归素材里只有这 1 条受影响**（按新正则逐条预筛：命中 1 条，实测漂移也是 1 条）
      ⇒ 不是"整批变严"，是**这一种说法**从漏变成拦。
    owner_action: >
      **本轮已重采基线**（`regression_run.py --rebaseline --from kb/.work/regression-20261012-h09fix.jsonl`）
      ⇒ 本条此后是**历史记录**，不再影响裁决。
      重采前它确实起过作用，实测形状是：**判定 GREEN ＋ 理由行里逐字打出
      「已知漂移（登记件里有）：RC-11b8f1e6a2c7 PASS→BLOCK」**——
      即**不判红、但仍然看得见**（与 `l5_gate.py` 对基线类判据的处置同一套：
      `✅ 过（基线项异常已登记）`）。**只有未登记的漂移才会红。**

