  - id: L46
    for: fix_20261023_coverage_anchor_same_source
    trigger: >
      **不是 Owner 直报** —— 守衡「回归集：三态漂移（对基线）」的非阻断告警把我引到回归集，
      自查全量 100 条时量出：5 条素材从 **REVIEW（覆盖缺口 ⇒ 转人工）** 翻成 **PASS**（fail-open）。
      Owner 原话口径另有两条与之相干（PRD §6.3「未命中 ≠ 合规」、
      `report-output-contract.yaml::fix_20261007_no_reading_no_pass`「库侧没有读数不许落 PASS」）。
    invariant: >
      覆盖判据不许被「锚点同名」骗过 ——
      ① `direct` 支路要**锚点相同 且 `source_sha256` 相同**（= 同一份文档里的同一锚点）；
      ② `same_source` 支路只认**带记录 id** 的锚点，页面位置型（`#l.<n>-<m>` / `#h.<标题>`）不算同源；
      ③ 位置型锚点既不能单独撑覆盖，**也不能把案例层挡掉**（RC-53a4e85faf9b 就是这么丢的 3 条依据）；
      ④ 门限（`bm25_raw_min=8.0` / `coverage_bm25_min=16.0`）与三态形状、报告字段**一字不动**。
    judges:
      - {file: 'kb/l7/skills/kb-content-review/scripts/selftest_coverage.py',
         ids: ['B8 ★ 反向对照', 'B10 反向对照', 'B11 ★ 反向对照', 'B9 同名且同文档', 'B12 带记录 id']}
      - {file: 'kb/l7/skills/kb-content-review/scripts/review.py',
         ids: ['rule_cited_anchor_shas', 'anchor_has_identity', 'cited_shas']}
      - {file: 'kb/l8/regression_gate.py', ids: ['known']}
    reverse_control: >
      把 `coverage_judge` 的 `direct` 还原成「只比锚点名字」⇒ **B8 变红**（同名不同 sha 又算覆盖）；
      去掉 `same_source` 里的 `anchor_has_identity` ⇒ **B11 变红**（位置型锚点又算同源，
      RC-2694cc2ea7e0 回到 PASS）；把 `cited_shas` 参数删掉 ⇒ B8/B10/B11 三条同时变红。
      （改前实测形状：`selftest_coverage.py` 22 通过 / 8 失败且**没有** B8–B12 这五条。）
