  # ══════════════════════════════════════════════════════════════════════════
  # L20 —— 2026-10-19 第二轮：Owner 把同两条意见**再报了一次**，因为上一轮
  #         （L13 + L19）都**修在了错的层/错的介质**上。这一条锁的是**真因**。
  # ══════════════════════════════════════════════════════════════════════════
  - id: L20
    for: fix_20261019_dup_link_envelope_and_report_advice30
    owner_quote: >
      「1.卡片上的清单链接有两个，去掉上面的，保留下面的
        2.审查报告中，修改建议你写了200多字，修改建议 ≤30 字」
    why_repeated: >
      **两条都是「修在了错的层/错的介质」**，所以 Owner 验的时候还在：
      ① 链接：上一轮在 `dual_track.renderMerged` 里加去重，而**第二条链接是信封层
         （`reply-cards/envelope.mjs::applyReportLink`）在它之后插进去的** ⇒ 去重看不见它。
         真因是那两处「块里已经有了吗」判断**绑死了旧措辞** `查看完整问题清单与修改建议`，
         而当天为 PRD §17 字数把卡面措辞改成了 `→ 完整清单：` ⇒ 认不出 ⇒ 又补一条。
      ② 建议：上一轮只压**卡面**（`sugCard`），报告仍用 `sugFull`；而 Owner 看的是**报告**。
      ⇒ 教训写进不变量：**判据要盯「人真正看到的那个介质/那一层」**，不是盯同名的邻居。
    invariant: >
      ① **一张卡上清单链接行恰好 1 条** —— 判定**认形状**（`→` ＋ 完整清单/查看完整问题清单与修改建议 ＋ 冒号），
         **两种措辞都认**；块里已有就不再补，块里没有才补（补的是短措辞 `→ 完整清单：`）。
      ② **报告**里每条问题的 `**修改建议**` ≤30 字（与卡面同一个上限，PRD §5.3.3）；
         全文不丢（结构化 JSON ＋ 本地留底 `merged-*.full.md`）。
      ③ 「改法参考了什么」的标注**不许随压缩丢失** —— 挪到标题行末尾（`· 改法参考库内反例`）。
    judges:
      - {file: 'tools/verify_cards.mjs', ids: ['J15a', 'J15a2', 'J15b']}
      - {file: 'tools/test_agent.mjs', ids: ['Z49f', 'Z59', 'Z26']}
      - {file: 'tools/reply-cards/envelope.mjs', ids: ['hasReportLinkLine', 'REPORT_LINK_LINE_RE']}
      - {file: 'tools/agent/dual_track.mjs', ids: ['ADVICE_MAX', 'adviceSrcTag']}
    reverse_control: >
      把 `insertLinkAboveAction` / `applyReportLink` 的判据改回
      `.includes('查看完整问题清单与修改建议')` ⇒ **J15a 精确变红**（实测「实际出现 2 次」，
      就是 Owner 那张卡的样子）；把报告的 `sugShort` 改回 `sugFull` ⇒ Z49f / Z59 变红。
    measured:
      link_lines_before: 2        # 块里 `→ 完整清单：` ＋ 信封补的 `→ 查看完整问题清单与修改建议：`
      link_lines_after: 1
      report_advice_before: 372   # Owner 贴回来的那条（真单）
      report_advice_after: 28     # ≤30
    deployed_note: '改完必须重启守衡才生效（pid 会变）；只看文件 mtime 不算上线。'

  # ══════════════════════════════════════════════════════════════════════════
  # L21 —— 2026-10-19 **第三次**报同一族。Owner 那句问句本身就是要锁的东西：
  #        「**字数限制问题，为什么反复修？**」
  #        答案不是"哪一处又没修好"，而是**从来没有东西在出厂那一刻核整张卡**。
  # ══════════════════════════════════════════════════════════════════════════
  - id: L21
    for: fix_20261019_card_conformance_gate
    owner_quote: >
      「字数限制问题，为什么反复修？原因 ≤50 字是 prd 要求，现在都 90 多字了；
        建议中「（全文见报告）」这里都没有报告，没有的东西不要说；
        依据：必须要提供依据，为问题做支撑」
    why_repeated: >
      **每一轮修复都只落在某一个渲染分支上，而没有任何东西核"成品那张卡"。**
      「原因压了」只证明 `reasonCard` 那一行在压；「指针条件化」只证明那个 if 生效；
      而卡里还有别的路能印出同样的字。这就是本库反复吃的「散文没有失败信号」，
      只是这次长在卡面上。⇒ 本轮不是再修一个分支，而是**在出厂那一刻对整段文本核四条口径**。
    invariant: >
