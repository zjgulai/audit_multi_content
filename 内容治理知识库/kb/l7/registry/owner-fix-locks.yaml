# Owner 报过的每一处 → 锁在哪把尺上 —— **防重复修复 / 防被改回去**
#
# 为什么要有这个文件（Owner 2026-10-19：「你上面的修复问题要落库，**避免重复修复**」）：
#   同一个问题被报两次，本库已发生过多回（「分类汇总怎么又复现了」「未归类 5 个」）。
#   每次的修复都写进了 `report-output-contract.yaml`，但那份是**流水账**（98 条、按日期堆）；
#   没有人能一眼看出「这条 Owner 意见现在由哪把尺守着、那把尺还在不在」。
#   ⇒ 本文件是**索引与销账**：一条 Owner 意见 = 一条锁 = 至少一把判据 + 一条反向对照。
#   `kb/l8/owner_locks_check.py` 会**机械核对**：判据文件在不在、判据 ID 还在不在正文里、
#   今天的修复有没有漏挂锁。判据被删/被改名 ⇒ 这里当场变红。
meta:
  owner_quote: '你上面的修复问题要落库，避免重复修复'
  purpose: 'Owner 意见 → 锁（判据＋反向对照）；判据消失即红'
  coverage_since: 'fix_20261019'

locks:
  - id: L01
    for: fix_20261019_card_prd_fields
    owner_quote: '卡片信息必须按照 prd 字段执行（去掉锚点、L0 逐字；必须给建议）'
    invariant: '卡面逐条只留 PRD §5.3.3 的字段；不出现「锚点」「L0 逐字」行；建议不许是占位句'
    judges:
      - {file: 'tools/test_agent.mjs', ids: ['Z48c', 'Z49c', 'Z48d']}
      - {file: 'tools/agent/dual_track.mjs', ids: ['⑱c', '⑱d']}
    reverse_control: '把锚点行或「L0 逐字」加回逐条块 ⇒ Z48c/Z49c 变红'

  - id: L02
    for: fix_20261019_card_summary_per_line
    owner_quote: '按照下面的格式优化，目前是写的一行（每类一行）'
    invariant: '≥3 时分类汇总**每类一行** `· <类>类问题：N 个`，不空行、固定 12 类次序'
    judges:
      - {file: 'tools/agent/prd53_format.test.mjs', ids: ['②b', '②b3']}
