# ── 测量过程本身的教训（我犯的，两条都留痕）────────────────────────────────
measurement_hygiene:
  do_not_trust_counts:
    what: 不要拿「判决计数」当证据
    why: 渲染件抖动会污染计数（见 collateral）；核心结论必须**按 key 集合**算差集
  overwrote_canonical_artifact:
    what: 第一次"验证跑"用了**与日更同名**的 RUN（`daily-20261013-0330`），
      产物直接写回 canonical 路径
    outcome: 事后核对**逐字节相同**（sha `6dd96ffa…`）⇒ **无实际损失**；
      但当时我并不知道这一点，一度在对话里把对照结论说错了（自认假绿）
    lesson: 验证跑**一律用独立 RUN 名**，不许复用日更 RUN（本件的 after_fix 用的就是 `vfyfix-*`）
  ran_before_edit:
    what: 第一次"验证跑」是在**代码改动之前**起的（后台排队），所以它必然复现基线
    outcome: 它给出的 `same 78` 被误读成「修复无效」，实际是「跑的还是旧代码」
    lesson: 起长任务前先确认**改动的落盘时刻**早于进程启动时刻
  unified_two_buckets:
    what: 第一版把渲染分支的 `render_empty` 也并进 `probe_empty`
    outcome: 与「不许动输出格式」冲突 ⇒ **已收回**（见 fix.scope_limit_20261013）
    lesson: 改一个桶，别顺手统一看起来一样的另一个桶

