  created_at: "2026-10-01"
  checker: kb/l7/scripts/kb_pipeline.py（`--write-gate <id>`）
  note: >
    本表只管**驱动层**（--via-skill）的写档开闸。编排器**自己**带 --apply 跑引擎那条老路
    仍走 `SYNC_ALLOWED` + `--allow-beyond-policy`（未改动，见 kb_pipeline.py:270 / :540-546）。

