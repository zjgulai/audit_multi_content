      - "lark-base 本地副本 frontmatter version 1.2.23 高于 lark-cli 侧 1.2.22（超前，非落后）"
      - "lark-cli skills list 报 28 个、而 ~/.agents/skills/ 下有 30 个 lark-* —— 2026-09-29 已查明并结案：多出的 2 个是 lark-approval-shortcut 与 lark-approval-two-step，属本地封装的便捷版（「审批两个高频动作」「两步直连封装」），不在 CLI 官方列表中；官方有而本地缺 0 个。这不是计数口径差异，CLI 同步（official 28）也不会管理这 2 个。"
