    note: "**kb-retriever 的并入说明**：原 kb-retriever（面向本地知识库目录的检索问答，含 references/pdf_reading.md、excel_reading.md、excel_analysis.md 与 scripts/convert_pdf_to_images.py）已于 2026-09-29 **并入本 skill**，其触发语与分层导航流程全部迁到这里；kb-retriever 在 skills.yaml 里的 status 改为 **废弃**，安装位副本移入 kb/l7/_skill-backups/（源仍在 ~/.agents/skills/kb-retriever/，可回滚）。**解释器硬约束**：必须用 kb/kbpy —— 受管 external-tools python 缺 numpy / fastembed，而 kb/l6/retriever.py:245 np.load(matrix.npy)、:249 from fastembed import TextEmbedding 两者都要。**已知限制不许夸大**（照抄 l6.json）：跨语言只有弱对齐（不等价于翻译级召回）；同义改写受限；规避型表述（拼音 / 拆字 / 谐音 / 符号分隔 / 小语种）召回受限；无重排；**无命中阈值**（一律返回 Top-N，融合分 RRF 恒为 1/(k+1)=0.016393，不能当阈值用）；覆盖不是全量（分母看 l6.json → scope.usable_units）。因此写结论时用「**候选**」不用「命中」，且必须带 unit_id + 锚点 + source_sha256。"
