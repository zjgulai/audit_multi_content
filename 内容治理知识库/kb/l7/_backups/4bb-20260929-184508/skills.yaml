# skills.yaml —— DSH 宿主 skill 登记表（静态真源）
#
# 这份表回答三件事：哪些 skill 装到了 DSH 宿主、是哪一版、缺什么。
# 它与 kb/l7/registry/l7.json 互补：l7.json 管「引用契约 / 检索门限 / 裁决规则」，
# 本表管「消费侧 skill 的编目与安装状态」。l7.json 已有的字段不在本表重复定义。
#
# 三条口径：
#   1. 本表是**静态真源**——不写死任何安装状态。装没装、落后没落后，
#      由 kb/l7/scripts/skills_check.py 运行时扫描 ~/.dsh/skills/ 算出来。
#   2. `scope: 本项目` 才参与「应装未装」判定；`宿主通用` 只登记归属，不参与。
#   3. `not_for` 必填非空——触发条件写错最常见的形式是「该不触发的时候触发了」。
#
# 装载位（两套，别混）：
#   A. ~/.dsh/skills/    —— DSH 宿主扫描的唯一装载位；本项目所有 skill 只装这里
#   B. ~/.agents/skills/ —— 另一套（lark-cli 的约定目录 + 少量通用 skill），本项目不装这里

meta:
  file: kb/l7/registry/skills.yaml
  companion: kb/l7/registry/l7.json
  checker: kb/l7/scripts/skills_check.py
  kb_root_marker: KB-ROOT.json
  install_target: "~/.dsh/skills/"
  other_load_slot: "~/.agents/skills/"
  scope_enum: [本项目, 宿主通用, 非skill]
  status_enum: [生产, 候选, 规划, 参考, 工作副本, 废弃, 非skill]
  status_enum_note: "方案原枚举为 生产/候选/参考/工作副本/废弃/非skill；本表按任务书第三批补入 `规划`（尚无目录、计划新建）。"
  scan_note: >
    第一批（已装在 ~/.dsh/skills/）的行数 = 现场扫描结果，不是任何文档里的数字。
    扫描时刻 2026-09-29：33 个目录；同日阶段 2 装入 14 个候选 skill（kb-retriever + 13 个 brand-*）后为 47 个，
    与 skills_check.py 的现场扫描一致（33 + 14 = 47）。
    skill 目录是活的（当天 14:16:57 归档 4 个、14:53 新增 5 个 lark），
    行数对不上时以 skills_check.py 的实时扫描为准。
  layer_enum_note: "layer 落 L0–L7 之一；不涉及库分层的填 `—`（U+2014）。"
  path_base: "所有相对路径字段（source / selftest / output_path / depends_on_engine）一律**相对于库根**（含 KB-ROOT.json 的那一层，即 kb/）；绝对路径用 ~ 或 / 开头。"
  dump_convention: >
    本表**可被 YAML 工具重排**（2026-09-29 补丁 A）：内置降级解析器（无 PyYAML 时启用）
    已支持跨行引号串 / 跨行单引号串 / 跨行裸标量，重排之后仍读得出来。
    但**重排后必须跑一次 skills_check.py 确认无回归**（--verify-parsers 比两条解析路径，
    --no-yaml 单跑降级路径）；已知可读的档位：safe_dump 默认 / indent=1,4 /
    width=40,60,200,1000 / allow_unicode=False（含 \xNN 转义与行尾反斜杠续行）。
    仍建议优先保留 `>` 块标量写法：可读性更好、diff 更稳。
    仍读不了的重排形式：default_flow_style=True（整份文档变成流式映射 {..}），会明确报错。
  dangling_ref_convention: >
    「悬空相对引用」统计算法（2026-09-29 定口径，避免复核来回打架）：
    范围 = ~/.dsh/skills/ 下 5 个 lark 副本（lark-doc/drive/wiki/base/shared）；
    样本 = 这些副本内所有 *.md 与 *.py 里的 markdown 链接 ](path)，且 path 以 ./ 或 ../ 开头、
    扩展名为 md/py/json/yaml/yml/sh/csv/txt；按所在文件目录解析为绝对路径，目标不存在即计「悬空」。
    实测 = 611 条引用 / 19 条悬空（若放宽为「不限扩展名的 ](path)」= 612 / 20）。
    19 条分布：lark-sheets 8 / lark-whiteboard 4 / lark-markdown 4 / lark-meeting 1 / lark-okr 1 / lark-apps 1，
    全部为「相关能力」软链接、0 条为「前置条件」。按本算法复核，不要用「粗计」等其他口径替代。
  engine_packages:
    - id: review-engine
      path: l7/review-engine
      purpose: 消费链（13 个 brand-*）的可执行引擎包；此前只装了说明书、引擎留在桌面源仓库，导致整条链空转
      source: ~/Desktop/skill/skills/brand-content-review-agent/
      installed_at: 2026-09-29
      copied: [core, contracts, knowledge-base, tests, evaluation, samples, PLAN.md]
      files: 58
      size: 376K
      excluded:
        - snapshots/   # 24M 归档快照，不进权威库
        - skills/      # 13 个 SKILL.md 的源目录；已在装载位，再进会变成第三份副本
        - .DS_Store
      acceptance: 引擎自带 12 个测试全部通过（11 个可直接跑；test_rule_engine.py 需 core 在 import 路径上，源仓库同样如此 —— 属既有条件，非搬运引入）
      runtime_note: 运行引擎/测试需要 PYTHONPATH 指向 l7/review-engine（core 是包）；命令示例：PYTHONPATH=<kb>/l7/review-engine /usr/bin/python3 tests/test_rule_engine.py
      pending: 13 个 SKILL.md 里写死的 ../../core/*.py 与 ../../contracts/* 引用**尚未改**（本轮只做搬运+登记）；改编引用并入 4B 同批处理，因为那会同时牵动 3 份副本
  known_issues:
    _note: >
      本阶段只登记、不修（属后续阶段）。这些不是 skill 行，放在 meta 里以免污染 skills 列表；
      skills_check.py 不判定这些项，改动它们也不在本阶段范围内。
    items:
      - "L6 只覆盖 1899 个可用单元（l6.json scope.usable_units = 1899），全量 9469 的分母按方案口径；article_no 覆盖 0/1899"
      - "派生视图 view/_meta/index-status.yaml 写着 search_backend_ready: false（本视图没有独立检索后端，kb_search 走加载器内的机械匹配）"
      - "L4 晋升状态是「机器晋升 · 人工抽查未做」"
      - "l7.json 的 self_test_refs 里 A/B/D/E 四份自测都在（l7/selftest_{a_block,b_refusal,d_paraphrase,e_trigger}.md），C_acceptance 不存在（l7/acceptance/ 目录本身不存在）——本阶段已复核确认"
      - "kb-content-review-fix 已被删除；2026-09-29 全盘查找（库内 + 两个装载位）无残留。若日后发现残留，只报告、不恢复"
