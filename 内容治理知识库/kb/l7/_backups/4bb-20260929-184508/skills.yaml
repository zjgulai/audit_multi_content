  # ============================================================
  # 第一批 · 已装在 ~/.dsh/skills/（scope: 本项目 · status: 生产）共 14 个
  # ============================================================
  - id: kb-content-review
    scope: 本项目
    status: 生产
    purpose: "用 Momcozy 内容治理知识库（L0–L6）为**已经给出的判定**产出可核对的**依据**（库名 + 版本 + 条款号 + 锚点 + source_sha256 + 逐字摘录）——2026-09-29 起降级为**评审链的链内组件**，不再是入口；入口是 kb-review"
    trigger_keywords: ["为什么判 BLOCK", "依据是哪条规则", "条款号", "知识库怎么说", "三态结论的依据", "审查依据", "逐字摘录", "锚点在哪", "source_sha256", "判定出处", "引用契约", "kb-content-review"]
    not_for: ["用户刚开始送来待判内容、问它该不该拦（走 kb-review）", "一批素材的发布前全流程（走 brand-content-review-agent）", "13 个专项成员各自的活（由 kb-review 的让位表分派）", "单独查某条规则的条款号 / 定稿了没有（走 kb-canonical-lookup）", "是不是 P0 / 命中哪些 P0 模式（走 kb-p0-check）", "召回单元 / 查资料 / 检索（走 kb-recall）", "跑知识库链路 / 同步知识库（走 kb-pipeline）；只对账 L0（走 kb-l0-feishu）", "知识库体检 / 跑闸门（走 kb-check）；闸门没过的修复（走 kb-repair）", "这几个 skill 怎么分工 / 注册表 / 路由（走 kb-manage）", "问知识库本身怎么建的（L0–L6、锚点、索引、规则来源等设计讨论）", "工程操作类问题（文件在哪、索引怎么重建、跑哪个脚本）", "没有判定意图的通用写作 / 翻译 / 润色", "纯业务闲聊（育儿话题讨论、产品咨询）"]
    layer: L7
    idempotency_key: "引用契约键 article_no + anchor + source_sha256（l7/registry/l7.json → citation_contract；锚点绑定见 l1/registry/l1.json → anchor_sha256_binding）"
    depends_on_engine: ["l5/matcher.py", "l6/retriever.py", "l7/registry/l7.json", "l3/candidates/rules.jsonl"]
    depends_on_skills: []
    output_path: "l7/reports/<run>.review.md"
    selftest: "l7/selftest_a_block.md"
    install_target: "~/.dsh/skills/"
    source: "l7/skills/kb-content-review/"
    note: "**2026-09-29 收窄（本轮关键改动）**：description 里**收回 12 个泛化中文触发词** —— 审查 / 审一下 / 合规检查 / 合规审查 / 内容审核 / 能不能发 / 会不会违规 / 能过审吗 / 有没有风险 / 踩线 / 禁用 / 敏感；这 12 个词实测在 195 次判定里抢走 45 次（本 agent 复测 harness：88/195），是 13 个 brand-* 里 7 个未过门槛的**唯一根因**。保留的触发语一律**与「知识库依据」强绑定**（为什么判 BLOCK / 依据是哪条规则 / 条款号 / 知识库怎么说 / 三态结论的依据 / 审查依据 / 逐字摘录）。⚠️ 口径说明：`审查依据` 是任务书明确要求**保留**的绑定短语，它**包含子串「审查」**；因此对 12 个词做逐字子串检查时，「审查」会在该短语上命中 1 次 —— 这是保留清单与禁用清单的**已知重叠**，不是漏删。原 note 保留如下：库内工作副本 = kb/l7/skills/kb-content-review/（含 scripts/review.py，838 行，属引擎）；2026-09-29 实测安装副本与源逐字节一致。用 _find_root() 定位库根，调用 l5/matcher.py 做 P0 确定性匹配、l6/retriever.py 做 BM25 主 + 向量补。自测真源是 l7.json 的 self_test_refs（A/B/D/E 四份），本字段只指向 A（阻断）；C_acceptance 不存在。安装走 shell 写盘，见 kb/l7/install-skill.sh。"
