  gate: "kb/l7/scripts/l4_gate.py（**独立复算档**：从定稿×候选×L2 单元重算 C1 条款号唯一 / C2 正文非空 / C3 证据坐标齐备 / C4 证据可回指 / C5 定稿不改写 / C6 canonical/rules.jsonl 保持 0 字节。C7/C8 要人抽检，闸门明说**不复算**）"
