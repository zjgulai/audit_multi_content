    ★ 归档不在脚本里：旧模式表要**人工**归档成 superseded.jsonl —— 这是覆盖式写入的兜底缺口。
    ★ L2→L5 的边**只经由 l5_prep.py / l5_bench.py**：l5_export.py:31 声明了 L2 常量但全文只 open L3，
    那个 L2 是**死常量**。
    ★ 选取口径：p_level=P0 ∧ rule_kind=atomic ∧ authority∈{expert,legal}（+ code_allowlist=[H06]），
    21 条 P0 → 入选 6 条（kb/l5/registry/l5.json → selection / excluded）。
    ★ 运行时只读器是 kb/l5/matcher.py（--text / --file / --json / --selftest），**不写盘** —— 这是 L5 的「读」通道。

