  idempotency_key: "pattern_id = 'p-' + sha1(f'{EXPORTER_VERSION}|{rule_id}')[:16]（kb/.work/l5_export.py:301；源不变则 id 不变）"
  gate: "kb/l7/scripts/l5_gate.py（**包装+分类档**：原样跑 kb/.work/l5_integrity.py 的 6 项并全打出来，再把「实质 4 项」与「基线 2 项」分开——实质项 FAIL 判红；基线项（frozen_layers / l3_append_only）实测在活库上必然 FAIL，须逐项登记在 kb/l7/registry/l5-known-drift.yaml，漏登记判红）"
  cwd: "~/.dsh/Momcozy知识库"
  python: "${KB_PYTHON}"
  envelope: required
  write_mode: overwrite_with_archive    # p0_patterns / index / registry 均 'w'；旧模式表归档为 runs/<run>.p0_patterns.superseded.jsonl（**归档动作是人工步骤，不在脚本里**）
  dry_run: true                      # l5_export.py / l5_prep.py 已于 P0-3 补 --apply 干跑档（闸门早于 RUN 解析）
  notes: >
    ★ 本层 registry **未声明 idempotency_key**（kb/l5/registry/l5.json 只有 10 个键）；
