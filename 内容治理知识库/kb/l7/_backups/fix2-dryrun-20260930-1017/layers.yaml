# layers.yaml —— Momcozy 内容治理知识库 · L0–L7 层契约表
#
# 这份表回答一件事：**这条链路怎么跑**。它与两张表互补：
#   * kb/l7/registry/skills.yaml  答「有哪些成员」
#   * kb/l7/registry/routes.yaml  答「这句话该谁接」
#   * kb/l7/registry/layers.yaml  答「链路怎么跑」（本表）
#
# 口径（三条，别省）：
#   1. 本表是**静态真源**：依赖 / 引擎 / 输入输出 / 幂等键 / 闸门只在这里定义。
#      改链路先改表，再改代码。层「跑完没跑完」一律运行时算出来（看幂等键 + run_id），
#      **不写回本表**。
#   2. 路径一律**相对 `kb/` 的上一级**（即 `~/.dsh/Momcozy知识库`），写作 `kb/...`；
#      绝对路径用 `~` 或 `/` 开头。
#   3. `dry_run` 是布尔：**本层的写脚本是否具备干跑档**（`--apply` 或缺省即预演）。
#      只读层记 true（天然可预演）。逐脚本的明细见各层 `notes` 与 §「无干跑档脚本清单」。
#
# ⚠️ 真实 DAG **不是线性链**（2026-09-29 实测，逐条带代码位置）：
#   L0 ─┬─▶ L1 ─▶ L2 ─┬─▶ L3 ─┬─▶ L4
#       │              │       ├─▶ L5
#       │              │       └─▶ L6
#       ├──────────────┴─▶ L4   （batch9_canonical.py:21 直读 kb/l2/units.jsonl）
#       ├──────────────┴─▶ L5   （l5_prep.py:40 / l5_bench.py:34,44）
#       ├──────────────┴─▶ L6   （l6_scope_lib.py:70-71）
#       └───────────────▶ L7   （review.py:305 回 kb/l0/records 取逐字原文）
#   另有三条**反向边 / 环**（库内此前未登记，本表如实记录，见 L3/L4/L5 的 notes）：
#     · L3 读 L4（kb/.work/batch7_l3_run.py:25 读 kb/l4/registry/l4.json）→ L3↔L4 成环
#     · L4 写 L3（kb/.work/l4_article.py:168 向 kb/l3/candidates/rules.jsonl 追加 article_no）
#     · L5 写 L3（kb/.work/l5_prep.py 追加 509 行 l3-0.2）
#   所以「L2 扇出到 L3/L5/L6」只是**其真实 4 个下游中的 3 个**（第 4 个是 L4）。

meta:
  file: kb/l7/registry/layers.yaml
  checker: kb/l7/scripts/layers_check.py
  cwd_note: >
    29 个 kb/l8/*.py 用 "kb/..." 相对路径 → **cwd 必须是 kb/ 的上一级**（~/.dsh/Momcozy知识库）。
    每层都写 cwd，就是为它而设。cwd 写错 = 工程错，不是数据错。
  python_note: >
    受管 external-tools python **缺 numpy / fastembed**，而 L6 召回两者都要
    （kb/l6/retriever.py:245 np.load(matrix.npy)、:249 from fastembed import TextEmbedding）。
    唯一合格解释器写在 kb/.kb-python（/usr/bin/python3）。一律用 `kb/kbpy <kb 内相对路径> [args]`，
    或显式 `KB_INTERP_OK=1 /usr/bin/python3 <脚本>`。**不合格就报错退出，不静默降级。**
  envelope_note: >
    信封闸门判据 = 同一路径 **Python os.path.getsize** 与 **node fs.statSync().size**
    差值恒 4096 即为信封态。成因：python 写 .py/.txt/.md 在这台机器上落成 4096 字节信封
    （宿主 Electron 侧 readFileSync 会读成乱码）。规定通道：
    「python 生成内容 → 写到**无扩展名**临时件 → cp 落到目标」。
    每层产物都必须过闸门；kb/l8/envelope_census.py **只扫 .md**，.py/.txt 另用 tools/envelope_gate.py。
  dry_run_note: >
    外层 `dry_run` 是本层**整体**是否可预演。逐脚本口径（2026-09-29 读 argparse / sys.argv 实测，
    同日 P0-3 补齐后更新）：
    **干跑档 = `--apply` 开关**：不带 `--apply` 即预演，一个字节都不落盘。
    **闸门位次判据（P0-3 定稿）**：闸门必须早于本脚本的**第一个副作用** ——
    ① 建目录 ② 下网络/调模型 ③ 写缓存 ④ 写库内文件；干跑的第一承诺是零副作用，预览是第二位的。
    **已有干跑档的库数据写脚本（8 个）**：kb/l8/reconcile_l0_feishu.py、kb/l8/ocr_attachments.py、
    kb/l8/l3_distill_run.py、kb/.work/l4_article.py、kb/.work/l5_prep.py、kb/.work/l5_export.py、
    kb/.work/l6_build.py、**kb/l8/drill_links_2levels.py**（写 kb/l1/sources，P0-3d 补）；另有 kb/l8/l2_split_run.py 等 18 个脚本本就带 --apply（多为对账/补台账类）。
    **只读+只报告、不需要干跑档**：kb/l8/align_l0_feishu.py（写 kb/l8/_stage 快照 + kb/l8/runs 报告，
    docstring 明写「不改 kb/l0 任何文件」）、kb/l8/workflow_check.py（写 /tmp 沙箱 + kb/l8 报告）、
    kb/l8/projection_reconcile.py（只读对账器，仅 --json-out 时写报告）、kb/l8/l2_staleness_audit.py。
    ⚠ **本字段自己出过一次错，留痕**：早前版本把 align_l0_feishu.py 写成「带 --apply」（实测无此开关），
    P0-1 的 P0-3 清单照那条错注释排范围，于是漏掉了真正会写库数据的
    kb/l8/drill_links_2levels.py（写 kb/l1/sources）—— 已于 P0-3d 补齐（现共 8 个）。
    **A3 口径（2026-09-29 收窄）**：`tools/skills_ready_check.py` 的 A3「写操作有干跑档」只对
    **真改库数据**的引擎要求闸门；只写报告/台阶段/沙箱的引擎豁免（豁免理由写进判据 why），
    且「写点无法分类」一律仍按旧口径要闸门（收窄不能顺手放宽）。
    实测：A3 通过 11/24 → 12/24（kb-pipeline 转正），其余 23 个 skill 判定一字未变。
    **零写自证**：tools/dryrun_audit.py（AST 级：闸门须在顶层、闸门体内不得有写调用、
    闸门之前不得有写点）+ tools/applypath_probe.py（把写调用换成内存叠加层，真跑 --apply 分支
    但不落盘，核对写目标与改动前基线一致）。2026-09-29 实测：8 个干跑可达且全库 17,561 文件零变化；
    --apply 分支写目标与改动前基线逐条一致。
  known_checker_defects:
    - "kb/l7/scripts/skills_check.py 第 4/5 类判 depends_on_engine / selftest 路径**不做 expanduser**（第 1001–1002、1018–1019 行）→ 凡 `~` 开头的路径都会被误报「不存在」。这两个字段一律写库根相对路径。"
    - "kb/l8/workflow_check.py 第 ② 段用「权威库未被改动」的**冻结基线** → 活库模式下变红是**合法**的，不等于坏了。"
    - "kb/l8/envelope_census.py **只扫 .md**；.py/.txt 要另用 tools/envelope_gate.py。"

# ──────────────────────────────────────────────────────────────── 层契约
#
# 写法与姊妹表 kb/l7/registry/skills.yaml 一致：`meta:` 头 + `layers:` 列表，每层一条。

layers:

- layer: L0
  depends_on: []                       # 无上游层：上游是**飞书源侧**（外部系统），不是层
  engine:
    - kb/l8/align_l0_feishu.py         # 只读对账：四类差异 same/only_feishu/only_l0/changed
    - kb/l8/align_l0_schema.py         # 结构层对齐（field_id / 名 / 类型）
    - kb/l8/reconcile_l0_feishu.py     # 认领 + 归档（★无干跑档）
    - kb/l8/emit_l0_manifest_reconcile.py
  inputs:
    - "飞书侧（lark-cli，全程只读）：entry Base GnRZbIuXraCzf0sGr2UcmZ62nfc"
    - kb/l8/_stage/feishu-compare/feishu-材料收集.ndjson
    - kb/l8/_stage/feishu-compare/fields-材料收集.json
  outputs:
    - kb/l0/manifest.jsonl
    - kb/l0/index/l0.jsonl
    - kb/l0/registry/kb.json
    - kb/l0/records/<表名>/<record_id>.json
    - kb/l0/snapshots/<resource_key>@<sha256>.md
    - kb/l0/links/graph.jsonl
    - kb/l0/runs/<run_id>.json
    - kb/l0/_archive/**
  idempotency_key: "(resource_key, observed_at)"     # kb/l0/README.md:32
  gate: "kb/l7/scripts/l0_gate.py（**判定档**：读 kb/l7/registry/l0-expected-diffs.yaml，把原始差异分成 预期内 / 真差异，只有真差异才判红；底下的原始事实仍由 kb/l8/align_l0_feishu.py --check 报，不抹掉）"
  cwd: "~/.dsh/Momcozy知识库"
  python: "${KB_PYTHON}"
  envelope: required
  write_mode: append_then_archive    # 台账 append-only；records/*.json 就地覆盖；退役资源整目录移入 kb/l0/_archive/（移动不删除）
  dry_run: true                      # align_l0_schema / emit_l0_manifest_reconcile / verify_l0_* 带 --apply；reconcile_l0_feishu.py 已于 P0-3 补干跑档；align_l0_feishu.py **只读+只报告、没有 --apply**（实测 0 处；不改 kb/l0）
  notes: >
    L0 只做两件事：登记源侧对象 + 算确定性指纹；不解析正文、不切分、不判业务域（kb/l0/README.md:3-5）。
    指纹统一 sha256 但必须写明 sha256_input ∈ {doc_text, record_files, record_fields, file_bytes,
    url_text, structure}；读不到内容时 sha256=null 且写 sha256_state（kb/l0/README.md:49-52）。
    ★ 飞书侧零改动：只有读调用，无 create/update/delete/move/permission 写调用（kb/l0/README.md:43-45）。
    ★ 未核实：L0 没有**单一权威扫描器入口**——实际是 kb/.work/build2.py（建模型）+ kb/.work/emit2.py（写盘）
    两段，另被 batch3_run.py / batch4_run.py / l0_supplement.py 多批覆盖式补跑；哪一支是在产入口，库里没写。
    ★ 无干跑档：kb/l8/reconcile_l0_feishu.py（唯一入参是位置参数 run_id，落盘点 :109 json.dump / :124 shutil.move）。

- layer: L1
  depends_on: [L0]                   # 唯一上游；kb/l0 全程只读（kb/l1/README.md:3）
  engine:
    - kb/l8/extract_l1_new_resources.py    # RUN [--apply]
    - kb/l8/ocr_attachments.py             # ★无干跑档（--purge-images 是更激进的删除开关，不是预演）
    - kb/l8/apply_ocr_to_l1.py             # [--apply]
  inputs:
    - kb/l0/manifest.jsonl
    - kb/l0/registry/kb.json           # field_roles / dir_map / anchor_spec
    - kb/l0/records/**
    - kb/l0/snapshots/<resource_key>@<sha256>.md
    - kb/l1/media/_cache/<sha256>.json # OCR 缓存（复用前须过闸门）
  outputs:
    - kb/l1/{1_外部标准库,2_内部正负样本库,3_措辞表达库,4_产品描述库,9_未归类}/<resource_id>.json
    - kb/l1/media/<resource_id>/img_NN.ext + ocr.json
    - kb/l1/media/<run>.manifest.json
    - kb/l1/index/l1.jsonl
    - kb/l1/sources/<run>.md
    - kb/l1/manifest_l1.jsonl
    - kb/l1/runs/<run_id>.json
  idempotency_key: "(resource_id, extractor_version, source_sha256)"    # kb/l1/README.md:26,56
  gate: "kb/l7/scripts/l1_gate.py（**判定档**：把上面的函数门槛落到真实数据上——遍历 kb/l1/media/_cache/*.json 逐条调用 kb/.work/kb_ocr_gate.py::ocr_cache_reusable；缓存里只要有一条不达标，命中它的图就会把坏 OCR 灌进 L1）"
  cwd: "~/.dsh/Momcozy知识库"
  python: "${KB_PYTHON}"
  envelope: required
  write_mode: append_then_archive    # manifest_l1.jsonl append-only；资源 json 就地覆盖；index/l1.jsonl 全量重建；退役进 kb/l1/_archive/
  dry_run: true                      # extract_l1_new_resources / apply_ocr_to_l1 / fill_drill_failures 带 --apply；ocr_attachments.py 已于 P0-3 补 --apply 干跑档（原先运行即写盘：会下载图片并写 OCR 缓存）
  notes: >
    ★ 写通道坑（本层高发）：kb/l1/** 的 .md 一律不许 python 落盘（会变 4096 字节信封）；
    既有正确写法见 kb/l8/fill_drill_failures.py：「python 写 .md.tmp → /bin/cp → 首字节断言」。
    锚点铁律：锚点必须来自原文物理位置，不得编造；定位不到就进报告清单（kb/l1/README.md:52）。
    anchor 规范版本 anchor-1.0；引用锚点必须同给 source_sha256（kb/l1/registry/l1.json → anchor_sha256_binding）。
    ★ 无干跑档：kb/l8/ocr_attachments.py（只有 RUN 位置参数与 --purge-images）、kb/l8/drill_links_2levels.py。

- layer: L2
  depends_on: [L1, L0]               # 主输入 L1 产物与台账；L0 只读 field_roles
  engine:
    - kb/l8/l2_split_run.py          # RUN [--apply] ← **本仓库唯一「不带 --apply 即预演」的层主引擎**
  inputs:
    - kb/l1/manifest_l1.jsonl        # kb/l8/l2_split_run.py:38
    - kb/l1/{1..4,9}_*/*.json        # :44-50
    - kb/l0/registry/kb.json         # field_roles / field_role_table_overrides（:37）
    - kb/l2/units.jsonl              # 既有单元，只读比对（:41）
  outputs:
    - kb/l2/units.jsonl              # append（'a'，:110）
    - kb/l2/index/l2.jsonl           # append（'a'，:112）
    - kb/l2/manifest_l2.jsonl        # append（'a'，:118）
    - kb/l2/runs/<RUN>.json          # 就地覆盖（'w'，:129）
    - kb/l2/registry/l2.json
  idempotency_key: "(resource_id, source_sha256, splitter_version)"      # kb/l2/registry/l2.json → idempotency.key
  gate: "kb/l7/scripts/l2_gate.py（**独立复算档**：不读 l2.json 自报计数。实测上面那条等式按快照**不可计算**——两个数不同时点；故改判 5 条可证的：台账行可解析 / run 内序列合法 / 账实上下界 / 产物归属 / 上游可溯；unit_count 口径歧义与滞后单列说明项）"
  cwd: "~/.dsh/Momcozy知识库"
  python: "${KB_PYTHON}"
  envelope: required
  write_mode: append_only            # units.jsonl / index/l2.jsonl / manifest_l2.jsonl 全为 open(...,'a')
  dry_run: true                      # 层主引擎 l2_split_run.py 带 --apply；P0-3 后 L0/L1/L3/L4/L5/L6 的库数据写脚本也都有了
  notes: >
    干跑写法：`kb/kbpy l8/l2_split_run.py`（**不带 --apply**）→ 只预演不落盘（:102-108）。
    ⚠️ 脚本打印的「去掉 --dry-run 或加 --apply 即落盘」是**措辞误导**：`--dry-run` 这个字符串
    从未被 argparse 解析，干跑是由「缺 --apply」触发的（它走 sys.argv 判断，没有 import argparse）。
    ★ 并发写入者：实测 kb/l2/units.jsonl 在本 agent 未写的情况下从 10551 行涨到 10650 行 →
    **任何「L2 已跑完」的结论必须带 run_id + 时间戳**，不能只看文件状态。
    ★ 事故留痕：kb/l2/runs/20260929-1754-l2-unscheduled-run.json（一次「意外对照运行」真实改写了 units.jsonl，
    正是本轮补 --apply 的起因）。
    ★ index/l2.jsonl 是**部分投影**（units 10551 行 / index 10100 行 / gap 451，全为 clause 单元，属历史覆盖缺口）。

- layer: L3
  depends_on: [L0, L2]               # 主输入 kb/l2/units.jsonl；L0 取 field_roles
  engine:
    - kb/l8/l3_distill_run.py             # RUN（必填位置参数）★无干跑档
    - kb/l8/l3_reject_ledger_rebuild.py   # RUN [--apply]
  inputs:
    - kb/l2/units.jsonl                   # kb/l8/l3_distill_run.py:37
    - kb/l0/registry/kb.json              # field_roles（:38-39）
    - kb/l3/candidates/rules.jsonl        # 既有候选，幂等比对（:389-396）
    - kb/l3/manifest_l3.jsonl
  outputs:
    - kb/l3/candidates/rules.jsonl        # 'w' 覆盖（:405）
    - kb/l3/candidates/sample_cases.jsonl
    - kb/l3/candidates/scoped_clauses.jsonl
    - kb/l3/rejected.jsonl                # 'w' 覆盖（:408）★事故点
    - kb/l3/index/l3.jsonl                # 'w' 覆盖（:412）
    - kb/l3/manifest_l3.jsonl             # append（'a'，:417）
    - kb/l3/registry/l3.json              # 'w' 覆盖（:470）
    - kb/l3/runs/<run_id>.json
  idempotency_key: "rule_id（不变条件：evidence_digest 未变 → unchanged）"    # kb/l3/registry/l3.json → idempotency
  gate: "kb/l7/scripts/l3_gate.py（**独立复算档**：① 1729 条 evidence_units 逐条回指 L2 单元（unit_id+source_sha256+anchor 三件套）② rejected 台账逐行回指 ③ 注册表自报键必须逐键登记在 kb/l7/registry/l3-known-drift.yaml。上面那条等式实测**不可复算**（台账 2026-09-29 重建后粒度变了），故降为声明项而不是每天报假红）"
  cwd: "~/.dsh/Momcozy知识库"
  python: "${KB_PYTHON}"
  envelope: required
  write_mode: overwrite_in_place_no_archive    # ★ 目标态是 overwrite_with_archive；实测**没有 _archive**
  dry_run: true                      # l3_distill_run.py 已于 P0-3 补 --apply 干跑档（闸门早于 RUN 解析与任何写盘）
  notes: >
    ★★ 唯一必须覆盖式写入的层，也是唯一**没有归档兜底**的层 —— 这正是事故成因：
    2026-09-29 13:10，kb/l3/rejected.jsonl 被本层以 'w' 覆盖，**11,860 行 → 1,053 行，recoverable=false**
    （kb/l3/registry/l3.json → incidents[0]）。修复脚本 = kb/l8/l3_reject_ledger_rebuild.py。
    → **跑 l3_distill_run.py 前必须先归档 rejected.jsonl，跑后按既有口径逐单元重建拒绝台账。**
    ★ 无干跑档（任务书口径正确）：kb/l8/l3_distill_run.py（RUN = sys.argv[1]，无 argparse、无开关）。
    ★ 未登记的反向边：kb/.work/batch7_l3_run.py:25 读 kb/l4/registry/l4.json → **L3 ↔ L4 成环**，
    而该文件 :2 的 docstring 写的是「只读 kb/l0,l1,l2」，这条反向读没被登记进去。
    ★ 两个下游反向写本层：kb/.work/l4_article.py:168（追加 article_no）、kb/.work/l5_prep.py（追加 509 行 l3-0.2）。
    → 所以本层不是纯上游，判「L3 未变」必须看旧行前缀是否逐字节不变，不能只看行数。
    ★ rule_eligible_gate（定义先于产出）：源资源 rule_eligible=false 时不得产出规则类形态。

- layer: L4
  depends_on: [L2, L3]               # 主输入 l3/candidates/*.jsonl；另读 l2/units.jsonl 校验三重证据
  engine:
    - kb/.work/l4_article.py         # RUN —— 条款号分配（article-no-2）
    - kb/.work/l4_integrity.py       # 自检 6 项 + 2 项附加
