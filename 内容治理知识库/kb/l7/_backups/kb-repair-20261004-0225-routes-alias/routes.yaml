# ─────────────────────────────────────────────── 本轮实测（2026-09-29 · 轮 2）

measured_20260929:
  harness: >
    协议 = 冻结基线的**盲测**协议（每条 prompt 交给一个新开 agent，只给提示词，由它自己的
    skill 目录决定加载谁；115 条用例 × 3 轮 = 345 次判定，0 次解析失败）。
    打分 = ~/.dsh/skills/root-skills-eval/scripts/score-trigger-eval.py（门槛 F1 ≥ 0.90）。
    产物 = _eval-kb-manage/blind_before_v2.winners.txt（改动前 65 条）、
           _eval-kb-manage/blind_after_r3.winners.txt（改动后 115 条）。
  before_65cases: "13 个 brand-* 中 **0 个**过门槛（6/65 逐条全轮命中；kb-content-review 抢走 88/195 次）"
  after_115cases: "23 个成员中 **22 个**过门槛；110/115 逐条全轮命中（第 4 轮 · 最终 · 345 次判定 0 失败）"
  by_member:
    kb-manage: 1.000
    kb-pipeline: 1.000
    kb-review: 1.000
    kb-check: 1.000
    kb-repair: 1.000
    kb-canonical-lookup: 1.000
    kb-p0-check: 1.000
    kb-recall: 1.000
    kb-l0-feishu: 1.000
    kb-content-review: 1.000
    brand-content-review-agent: 1.000
    brand-review-intake-router: 1.000
    brand-policy-source-curator: 1.000
    brand-text-compliance-review: 1.000
    brand-product-claim-verifier: 1.000
    brand-image-safety-review: 0.939
    brand-video-safety-review: 0.909
    brand-us-locale-cultural-review: 1.000
    brand-review-decision-engine: 1.000
    brand-review-report-memory: 1.000
    brand-review-evaluation: 1.000
    brand-feishu-review-adapter: 1.000
    brand-ai-provenance-rights-review: 0.440   # ★ 未过（第3轮 0.333 → 第4轮 0.440，仍 < 0.90）
    # 2026-09-30 另修一件**与上面这个分无关**的事：「装了，但任何会话里都选不到」。
    # 两个彼此独立的缺陷叠在同一个 SKILL.md 上：① 缺 frontmatter 起始围栏 `---`（宿主按
    # `missing YAML frontmatter` 整份忽略）；② frontmatter name 里有一个空格（宿主
    # `^[\p{L}0-9]+(?:-[\p{L}0-9]+)*$` 判 invalid skill name）。任一单独存在都足以让它永远不可选。
    # 已改名 `AI溯源与权利审查`（只去空格，触发词里的带空格形态有意保留）。上面 0.440 是**冻结用例集**
    # 上的路由分，本次没动 description、也没改用例，那个分不变、仍代表"路由质量未过门槛"这件事。
    # 证据与复验：kb/l7/reports/20260930-1450-修复-AI溯源成员装了选不到.md
  known_conflict: >
    **I3–I5 与 G3/I1 是冻结用例集自身的歧义**：G3「这条视频的 AI 生成痕迹没标出来要紧吗」期望走
    视频安全审查，I1「这个达人视频是 AI 生成的但没有标识，有风险吗」期望走 AI溯源与权利审查 ——
    两句语义几乎相同却要求两个不同归属，任何 description 都无法稳定区分（实测 G3/I1 都落到视频安全审查）。
    这是**用例集缺陷**，不是 skill 缺陷；要么合并这两条、要么给它们加上可区分的限定语，再复测
    brand-ai-provenance-rights-review。
    **v2 用例修订实验（已执行）**：另出 cases_v2.json（只改 G3/I2，v1 未动），全量重跑 345 次判定 →
    `AI 溯源` **0.222（比 v1 第 4 轮的 0.440 更差）**，其余 22 个成员全过。
    → 结论修正：根因**不只在用例集**，`I` 组有三类缺陷（① I1↔G3 近重复，v2 已解；
    ② **I5↔F5 近重复，未解 —— 这才是主因**；③ I2 欠定义，"补模态"这个处方本身是错的）。
    详见变更记录 §9；**不再继续改用例（避免把测试改到过），也不再调 description（避免过拟合 judge）**。
    第 4 轮我把「按问题路由、不按载体路由」写成硬边界（AI 溯源 + 图片安全审查 + 视频安全审查 三处对齐），
    AI 溯源 F1 从 0.333 升到 0.440、判成 NONE 的次数从 7 降到 5，但**仍未过门槛** ——
    **继续调 description 是过拟合 judge，不是修 skill**。剩下的是**用例边界**问题：
    · `I1` ↔ `G3` 近重复（同一意图、两个归属）；
    · `I2`「这条素材用了 AI 换脸，需要标注吗？帮我审一下」3 轮全判 NONE —— 它没说是文字/图片/视频，
      judge 认为"信息不足"，而用例集要求直接归 AI 溯源。
    **建议**：改这两条用例（合并 I1/G3；给 I2 补上模态），再复测；**不建议**再改这三个 skill 的 description。
