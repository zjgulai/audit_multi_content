    本层两个引擎都归本 skill：`l6_build.py`（建索引）+ `l6_bench.py`（性能验收 ——
    **此前没有任何层 skill 认领，2026-09-30 补齐归属**）。
    解释器硬约束：一律 `kb/kbpy`（受管 python 缺 numpy / fastembed，建索引两者都要）。
    `kb/l6/SCOPE.txt` 是**人工核定白名单**，改它 = 改召回范围。
    跑完回 `kb/kbpy l7/scripts/l6_gate.py`（**只读档**，有 4 项明写没跑 ——
    别把「闸门过」说成「索引全对上」）；完整档要人跑 `kb/.work/l6_integrity.py <RUN>`。
  engine:
    - kb/.work/l6_build.py           # RUN —— 建索引（向量 + BM25）
    - kb/.work/l6_bench.py
    - kb/.work/l6_selftest.py        # **批次5 补登**：A/B 14 查询 × 3 模式自验汇总 → 写
                                     #   kb/l6/selftest.json（freshness.py 逐层关键 data 产物之一）。
                                     #   此前**不在本清单里** → 跑本层声明的引擎永远刷不新它，
                                     #   L6 那条新鲜度红靠跑链路不可能消掉。
                                     #   档位：`[--run=<RUN>] [--apply]`；不带 --apply = 预演，
                                     #   **不写** selftest.json、**不建** kb/l6/_archive，
                                     #   只写 kb/l6/runs/<RUN>-selftest-dryrun.json。
    - kb/.work/l6_report.py          # **L6 落章引擎**（批次4 补登）：`<RUN> --skill <id> [--apply]`，预演写 kb/l6/runs/<RUN>-dryrun.json
                                     #   位次在 l6_selftest.py **之后** —— 它读 kb/l6/selftest.json 做摘要
  inputs:
    - kb/l2/units.jsonl              # l6_scope_lib.py:70-71
    - kb/l2/manifest_l2.jsonl        # 最新 result=invalidated 的资源其单元不进索引
    - kb/l3/candidates/rules.jsonl   # p0_evidence_unit_ids（l6_scope_lib.py:137,140）
    - kb/l0/registry/kb.json         # field_roles
    - kb/l6/SCOPE.txt                # 人工核定白名单
  outputs:
    - kb/l6/bm25/{docs,postings_zh,postings_en,meta}.jsonl
    - kb/l6/vectors/{vectors.jsonl,matrix.npy,meta.json}
    - kb/l6/index/l6.jsonl
    - kb/l6/registry/l6.json
    - kb/l6/benchmark.json
    - kb/l6/runs/build_runs.jsonl    # append（'a'）
  idempotency_key: "双键。向量：(unit_id, segment_index, content_hash, model, dim, quantization)；BM25：(unit_id, content_hash, tokenizer_version)"
  gate: "kb/l7/scripts/l6_gate.py（**只读档**：复算可用单元数==索引行数==l6.json 自报、25600 条向量逐条回指 L2 单元、倒排编号同源、版本纪律（versions.jsonl 只数版本行，注释不算））。**没跑的 4 项明写出来**：③重跑幂等（.work/l6_integrity.py:185 会带 --apply 重跑建索引 → 写档，不进日报）、⑥分段拼接、⑦倒排词频、⑨冻结基线"
  cwd: "~/.dsh/Momcozy知识库"
  python: "${KB_PYTHON}"
  envelope: required
  write_mode: overwrite_in_place_with_guard    # write_if_changed 守卫：内容未变则不重写（l6_build.py:58-65,196-205）
  dry_run: true                      # l6_build.py 已于 P0-3 补 --apply 干跑档（闸门早于 BM25 写、模型加载与向量写）
  notes: >
    ★ 本层落章引擎 = kb/.work/l6_report.py（**有** --apply 档；预演写 kb/l6/runs/<RUN>-dryrun.json）。
    ★★ 批次5 补登 `kb/.work/l6_selftest.py`（2026-10-01）：它是 `kb/l6/selftest.json` 的**唯一写入者**
    （`kb/.work/l6_selftest.py:183`），此前既不在本层 `engine`、也不在别处声明 ——
    后果是「跑本层声明的引擎」**永远不会**刷新 selftest.json，`freshness.py` 的 L6 那条红
    （判据 = selftest.json 的 age）靠跑链路**结构上不可能**消掉（批次4 §4 只侦察未补登，本批补齐）。
    ★ 同一处**行为变更**（明写）：`l6_selftest.py` 此前**运行即写盘**（无任何开关）；
    批次5 起照 `l4_report.py` 样板补 `--apply` 干跑档 —— 不带 `--apply` = 预演，零写入；
    真档要显式 `--apply`。改这一处是为了不让 engine 清单里塞进一个**不可预演**的引擎
    （契约 #3「预演默认」对它此前失效）。
    ★ 预演产物**不叫** `<RUN>-dryrun.json`：那个名字归本层落章引擎 `l6_report.py`，
    同名会互相覆盖、污染 `skill_invocation_audit.py` 的 E2/E3/E5 证据（A-2 撞名硬闸）。
    故本脚本预演写 `kb/l6/runs/<RUN>-selftest-dryrun.json`，且**不带** `skill`/`skills` 键
    （它**不是**落章引擎，落章归 `l6_report.py`）。
    ★★ 本层是**解释器约定存在的原因**：kb/l6/retriever.py:245 np.load(matrix.npy)、
    :249 from fastembed import TextEmbedding —— numpy 与 fastembed 都要，受管 python 全缺。
    一律 `kb/kbpy l6/retriever.py ...`。
    ★ 幂等即干跑证据：registry 记「同一口径重跑得到幂等空操作 —— BM25 本次切词 0 条、索引无变化不重写；
    向量新增/变更 0、复用 2088 段、embedding 调用 0 次」。
    ★ L5→L6 **不是数据边**：l6_build.py:243/390/432 只把 kb/l5/matcher.py 写进说明文本与 registry 字段，
    全文不 open 任何 kb/l5/*；P0 集合实际取自 L3 的 p_level=='P0'。
    ★ 口径与文件分离：registry 写的「kb/l2/units.jsonl 经 L3 口径过滤」指的是**判据**不是读文件；
    L3→L6 靠的是独立的 p0_evidence_unit_ids()。
    ★ self-report 失真已修：SCOPE.txt 原先只有报告器读，真正建索引的脚本不读它 → 2026-09-29 F11
    把读取接进 l6_scope_lib.py:106-120。
    ★ 非常规 run_id：kb/.work/l6_build.py 20260929-F11（**不是** YYYYMMDD-HHMM 形态）。
    ★ 运行时只读器是 kb/l6/retriever.py（--query/--top/--mode/--kb-type/--json/--selftest），不写盘 —— L6 的「读」通道。

- layer: L7
  depends_on: [L0, L3, L4, L5, L6]   # 检索四跳：l5/matcher.py → l3/candidates/rules.jsonl → l6/retriever.py → l0/records；另读 l4 取 article_no
  skill: [kb-check]                  # 跨层统一闸门，不是 L7 的层主
  skill_write: false                 # kb-check 只报不改；要修走 kb-repair
  skill_note: >
    `kb-check` 是**跨层统一闸门**（注册表 layer 记「—」），不是 L7 的层主 ——
    所以「层 ↔ skill 双向一致」判据对它**豁免**，只要求「在注册表登记过 + 已装」。
    L7 是报告/注册表层，无写库引擎；`kb-repair` 是闸门红之后的修复入口（不在自动链路里）。
  engine:
    - kb/l7/scripts/skills_check.py  # 登记表自检（本家族闸门）
    - kb/l8/workflow_check.py        # RUN —— 链路收口核验
    - kb/.work/l7_article_source_refresh.py  # RUN [--apply] —— 刷新 l7.json 的 article_no_source
                                     #   **读取快照**（这个块自带 read_at，语义就是「某时刻读到什么」）。
                                     #   它**不发号**（发号是 L4 的动作），只读 L4 台账 + 候选件现算并如实记账。
                                     #   2026-09-30 加：该快照上次刷新是 2026-09-24 15:20，
                                     #   之后 123 条外部标准规则入库并发号，快照却仍把 E-2 列为
                                     #   reserved_unused —— 而 E-2.1…E-2.123 已发出。L7 是引用契约层，
                                     #   留着一张说 E-2 未启用的表，引用 E-2.x 会被判成无效号。
                                     #   幂等判据 = **实质字段**无差异即零写入（read_at 每次都动，不算差异）。
                                     #   ★ 写的是本层已声明的 outputs 之一（kb/l7/registry/l7.json），
                                     #   不碰 kb/l0~l6，因此不违反 skill_write: false 的边界。
  inputs:
    - kb/l5/matcher.py               # 作为子进程调用（review.py:199）
    - kb/l3/candidates/rules.jsonl   # review.py:230
    - kb/l6/retriever.py             # review.py:295
    - kb/l0/records/<表名>/<record_id>.json   # 按 anchor 回原文逐字核对 + 校验 source_sha256（review.py:305）
    - kb/l4/canonical/*.jsonl        # article_no 来源
    - kb/l6/registry/l6.json         # retrieval_capability（no_silent_degradation 判定）
  outputs:
    - kb/l7/reports/<run_id>.review.md
    - kb/l7/registry/l7.json
    - kb/l7/registry/skills.yaml
    - kb/l7/registry/layers.yaml
    - kb/l7/registry/routes.yaml
    - kb/l7/runs/<run_id>.json
  idempotency_key: "未声明（本层是消费层，以 run_id 记账）；无写回权威库的路径"
  gate: "kb/l7/scripts/l7_gate.py（**独立复算档**：把上面那句话的前置条件跑出来——① 契约库名与 kb/l0/registry/kb.json→kb_types 逐字一致（不得自造库名）② 规则候选 509 条 kb_type 全为 wording 可复算 ③ 六要素（库名/版本/条款号/anchor/source_sha256/逐字摘录）在 1242 条定稿上可物化率 100% ④ 条款号出处存在。运行时引用完整性仍由评审链自己的硬闸门负责）"
  cwd: "~/.dsh/Momcozy知识库"
  python: "${KB_PYTHON}"
  envelope: required
  write_mode: append_new_files_by_run    # 每 run 一个新报告文件，不覆盖；registry 就地覆盖
  dry_run: true                      # 只读层：review.py 只读 kb/l0~kb/l6，只写 kb/l7/reports 与 stdout
  notes: >
    ★ 门限与判据从 registry 读，不写死：bm25_raw_min=8.0 / vector_cosine_min=0.6 / coverage_bm25_min=16.0；
    coverage 未过则拒答，不得输出 PASS。forbid_equal_rrf_default = true。
    ★ 拒答只能在 skill 层实现：L6 实测 B 组三种模式 hit@3 全为 0 却都返回 Top3，索引层没有拒答能力。
    ★ 默认检索模式声明为 bm25_only（实测 bm25_only hit@3=1.0 / p@3=0.958；hybrid 0.875 / 0.542；
    vector_only 0.625 / 0.25）。
    ★ 自验 C（真实内容验收）**未跑**：kb/l7/acceptance_cases.md 不存在，报告明写「不伪造验收数据」。
    ★ approvers 是角色位，configured=false → 输出须保留角色名并标注「未配置」，不写死人名。
    ★ workflow_check.py 第 ② 段用冻结基线 → 活库模式下变红是**合法**的。
