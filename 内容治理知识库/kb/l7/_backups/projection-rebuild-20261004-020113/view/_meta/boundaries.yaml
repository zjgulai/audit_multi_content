# 由 kb/.work/fix_f3_gen.py 生成（修复计划 F3a）—— 顶层键必须在加载器 WIRED_META_KEYS 白名单内，
# 顶层键：boundaries —— 接口级写边界。**缺省一律 false（白名单，不是黑名单）。**
# F3a 口径：取 DEFAULT_BOUNDARIES 等价值。

boundaries:
  canonical_write: false      # 入库能否直写权威树 → ingest() 的 E040 闸门
  ledger_write: true         # 账本必须能写（拒收尝试不许静默消失）
  baseline_write: true       # 条目基线必须能写（否则 E039 发现不了删除）
  meta_write: false           # 治理参数不许 agent 改（声明性）
  provider_call: false        # 不调外部 provider（本库检索是纯本地机械匹配）
  collection_create: false   # 不自动开新子库（E018 盯着）
