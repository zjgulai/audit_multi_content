# report-output-contract.yaml —— 内容治理 · **报告输出契约**（PRD 侧要求 + 实测缺口）
#
# 这条登记回答一件事：**一次审查要「输出什么」，才算满足 PRD**。
# 它与 kb/l7/registry/ 下的姊妹表互补：
#   * skills.yaml                     答「有哪些成员」
#   * layers.yaml                     答「链路怎么跑」
#   * routes.yaml                     答「这句话该谁接」
#   * conclusion-destination.yaml     答「结论填到哪」
#   * report-output-contract.yaml     答「报告要输出什么」（本表）
#
# 边界（写清楚，免得被误用）：
#   · 本件是**契约与缺口登记件**，不被任何 gate 读取，也没有自动对账器（checker: null）。
#   · ★ 本件**只登记，不改代码、不改判据**。下面 `gaps_unresolved` 里的每一条都是
#     **「待人工判」**，**不是已定论的缺陷** —— 不得据此改 review.py / decide() / 任何引擎。
#   · 本件不参与 L0–L7 数据链路，不改变任何层的 inputs / outputs。
#
# 登记时间 2026-10-02。

