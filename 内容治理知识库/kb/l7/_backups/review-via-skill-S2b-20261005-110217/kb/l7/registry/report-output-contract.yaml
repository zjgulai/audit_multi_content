      honest_limit: "**这是 agent 自述档（agent_reported），不是强证据** —— 证明不了「真加载过」，只能证明「申报了」。与 `--invoked` 同一性质，不许当强证据用。"
    exemptions:
      decision: "**不是所有脚本都该要求加载 skill** —— 一刀切只会让链路更重更慢，换不来判定质量。按「它执行的是**知识**还是**机制**」分三类登记。"
      must_load: "产出判定/依据的：13 个判定主体、`kb-content-review` ⇒ 走 defense_2 的 `--decision-owner`。"
      should_load: "编排入口：`kb-pipeline`、`kb-review` ⇒ 不带 `--via-skill` 直接跑整链要显著告警并记 `via_skill=false`。"
      exempt: "尺子/发布件/纯工具：`skill_invocation_audit.py`（尺子）、`feishu_publish.py`（发布件）、`kb_loop_claim.py`（认领）、`lark-cli`（`lark-base` 的 CLI）—— **明确豁免**：要求「尺子也得先加载 skill」会造成**无限套娃**。"
    verified: >-
      2026-10-03 实测：① 直调 `review.py` ⇒ exit 2 + 拒跑说明；带 `KB_ENTRY=selftest` 或 `--i-am-the-entry` ⇒ 正常出结论。
      ② 引擎不给 `--decision-owner` ⇒ `NEEDS_INPUT` / exit 3；给了 ⇒ 正常出 BLOCK / exit 0，
      且行内打印 `判定主体：产品宣称核验（declared）`。
      ③ run 记录 `kb/l7/runs/20261003-124616.json` 的 `extra.decision_owner` 四字段齐。
      ④ 发布件对「后门形状」报告 ⇒ 干净拒发 exit 2；对「有层前置但摘掉判定主体」⇒ 拒发 exit 3。
    rollback: >-
      `review.py` 删 `_entry_gate()` 调用；`with_kb_evidence.py` 去掉 `--decision-owner` 的 fail-closed 分支
      （保留字段与留痕）；`feishu_publish.py` 去掉两处拒发（保留形状守卫，它修的是崩栈）。

  freshness_ledger_fix_20261003:
    trigger: >-
      用户问「为什么拒答」。实测：2026-10-03 08:30 日更**真的跑了全链 `--apply`、体检 GREEN**
      （`daily_sync.py` 日志：「L0对齐 exit=0 ｜ 写档完成 L1,L2,L3,L4,L5,L6 ｜ 失败 无」），
      而 `review_freshness_gate.py` 仍判陈旧、评审链**拒答** ⇒ 再跑日更也没用。
    root_cause: >-
      `layer_freshness.judge()` 需 `change_state` + `input_watermark` 做水位交叉验证，而层引擎落章里
      大多没有这两字段 ⇒ 它转读 sidecar `kb/l7/registry/layer_run_freshness.json`。而 `measure()`
      ——sidecar 的**唯一写入者**——**全库没有任何生产调用点**（只有 `layer_freshness.py` 自己的 CLI
      与 `seed_freshness_sidecar.py` 的注释）。实测：L4/L5/L6 的 sidecar 停在 **10-02 13:22**
      （`provenance=measured`），judge 拿它算年龄 ⇒ **31.2 小时 > 24 小时 ⇒ 永久拒答**。
      `seed_freshness_sidecar.py` 早就承诺「之后每一跑都走 `measure()`，seeded 会被真观测覆盖」
      —— **该承诺从未兑现**。
    defect_4_run_at_run_age:
      what: "`layer_freshness.py` judge(): sidecar 分支**只更新 `run_age`、不更新 `run_at`** ⇒ 同一份输出里 `run_at=当天08:31` 与 `run_age=31.2h` 自相矛盾（排查时把作者本人带偏）。"
      fix: "`run_at` / `run_age` **同源更新**；另加 `run_at_source`（`落章` / `落章文件 mtime` / `sidecar 观测（provenance=measured）`）让时间来源可见。"
    defect_2_time_source:
      what: "judge 无条件采信 sidecar 的 `executed_at`，而 sidecar 的 measured 条目**永不被刷新** ⇒ 旧时间压住新落章。"
      fix_v1_rejected: "第一版改成「落章无条件优先」——**实测不够**：L1/L3/L5/L6 的落章本身停在 10-02 21:02（23.6h），24 分钟后照样翻红（**幂等层跑完不留新落章**）。"
      fix: "改为**取较新者**：落章时间 vs sidecar 时间，谁新用谁；且**只认 `provenance=measured`** 的 sidecar 时间（`seeded_from_disk` 是补记、非观测，见 seed 脚本自述，**不认**）。"
    defect_1_no_measure_caller:
      what: "`daily_sync.py` 逐层写档后**不落新鲜度观测** ⇒ 幂等层跑完不留任何『跑过』的证据 ⇒ 判据拿旧时间判陈旧。"
      fix: "`daily_sync.py` 加 `_freshness()` + `observe()`：每层**测前**取 `output_fingerprint` / `watermark_digest(current_watermark)`，`kb_pipeline --apply` 跑完**立刻调 `measure()`** 落真实观测（`provenance=measured`）。参数取法照 `layer_freshness.py` 自己的 `measure` 子命令（`:521-526`）。失败只告警、不拖垮日更。"
    new_attack_surface:
      what: >-
        **修复2 引入的新信任面**：「取较新者」会**采信 `provenance=measured` 的 sidecar 时间** ⇒
        **任何能写 sidecar 的东西，都能让 8 层瞬间「变新鲜」、绕过整道新鲜度闸门**。
        实证：2026-10-03 20:38:17 有**库外**代码把 L1/L4/L5/L6 的 sidecar 写成 `provenance=measured`，
        note「评审链层前置补观测（本单 REV-202610031826-momcozy-pump）」（**该字符串在库内任何代码里
        grep 不到**），并留备份 `layer_run_freshness.json.bak2-20261003-2038`。
        ⇒ **补记被标成强档**（`measured` 的定义是「包住一次真运行测出来的」）。
      tightening_pending: >-
        **已做（2026-10-03 当日）**：`layer_freshness.py` 新增 `_trace_exists()` —— 采信
        `provenance=measured` 的 sidecar 时间**之前**，先拿它的 `run_id` 去核对一次真运行；
        核对不上 ⇒ **不采信该时间**（退回落章时间），并把 `sidecar_time_rejected` 如实写进 judge 输出。
      tightening_criterion: >-
        认三种**精确**形态：`kb/l7/runs/<rid>.json` ／ `kb/<layer>/runs/<rid>.json` ／
        `kb/l8/runs/<rid>-l0-align.json`。
        ★ **不许用通配**（第一版加过 `<rid>-*.json` 兜底，实测**把洞又打开了**：那条伪造的 `<rid>`
        正好有 `kb/l7/runs/<rid>-L4.json` 这类层记账件 ⇒ 通配一匹配就放行；且它的层侧产物是
        `-dryrun.json` 干跑件，而库规明写「干跑档不算跑过」）。
      tightening_verified: >-
        实测 `_trace_exists`：伪造 rid `REV-202610031826-momcozy-pump` → **False（抓得住）**；
        日更 rid `20261003-2055` → True；旧 `20261002-1330-L4` → False。
        judge 八层仍全 fresh、新鲜度闸门 exit 0；L7 的旧观测被拒后**优雅退回落章**（仍新鲜）——
        `daily_sync.py` 已配套改为用 `_newest_l7_run()` 取**真产物名**当 rid，避免它白落。
    verified: >-
      修复后实测：`judge()` 8 层全 `fresh=True`；`review_freshness_gate.py` **exit 0（放行）**。
      修复1 的效果须**跑一次日更**才可见（本批已触发并在跑后核 `provenance=measured` 是否逐层落地）。
    rollback: >-
      `layer_freshness.py`：把 sidecar 分支还原为「无条件用 `_sc['executed_at']` 覆盖」并去掉
      `run_at_source`；`daily_sync.py`：删 `_freshness()` / `observe()` 及循环内两处调用。

  three_more_fixes_20261003:
    why: "承接 `freshness_ledger_fix_20261003`，按用户裁定把剩下的 2/3/4 三条待办做完（第 1 条的 L0 未对齐已查清并更正 —— 见 `l0_not_aligned_finding`）。"
    fix2_expose_stale_copy_age:
      what: "`daily_health.py` 新增 `l0_copy_age()`；日报第 5 节「已知阻断项」**加一列「L0 副本」**，对 ≥3 天的标 ⚠️ ＋ 追加一段说明。"
      why: "登记 `pull_failed` ⇒ 健康色 GREEN 是对的（不冤枉管线）；**但登记 ≠ 无害** —— 实测 `专家修订汇总表` 的 L0 副本停在 09-23（395 条，**10.4 天前**）、`内容公式` 停在 09-24（7 条，**9.5 天前**），而它们**仍是评审链的溯源终点**。原来只报「拉不到」、不报「因此已经多旧」⇒ 静默陈旧。"
      verified: "重生成日报实测：新列输出 `⚠️ 395 条 ｜ 最新 10.4 天前` 与 `⚠️ 7 条 ｜ 最新 9.5 天前`，并带「二选一：解锁 ／ 在报告里标明是旧快照」的说明。"
    fix3_api_decision_owner:
      what: "`kb_api.py`：`ReviewReq` 加 `decision_owner`（中文装载目录名）与 `allow_no_decision_owner`；`do_review()` 三层口径 —— ① 申报 ⇒ `mode=declared_by_api`（带 `cannot_verify` 诚实标注）② 显式豁免 ⇒ `waived_by_api` ③ **带了 BASE 却没申报也没豁免 ⇒ HTTP 409**；响应体加 `decision_owner` 留痕。"
      why: "CLI 侧已把「判定主体缺席」挡成 NEEDS_INPUT，而机器入口原先**只有层前置**（实测 `grep -c decision_owner kb_api.py` = 0）⇒ bot 那条路**绕过防线2**。现在两侧**同一强度**。"
      verified: "重启服务后实测三分支：① → **409**（detail 说明自相矛盾）② → **200** ＋ `declared_by_api`（含「本接口核不了该 skill 有没有被真的加载」）③ → **200** ＋ `absent_by_api` ＋「不得当通过依据」。"
    fix4_autorun_lock_leak:
      what: "两侧一起改：`kb_pipeline.py` 装 `SIGTERM → SystemExit` 处理器（让 `finally: release_lock()`（:958）能跑到）；`review_freshness_gate.py` 的 autorun 由 `subprocess.run(timeout=)` 改成 `Popen` ＋ **超时先 SIGTERM**（`AUTORUN_TERM_GRACE=20s`）**再 SIGKILL**，并在 `finally` 里核一次锁、把「本次 autorun 留下锁」写进台账（**不自动撬锁** —— 库规要求先 `--check` 再删）。"
      why: "`subprocess.run(timeout=)` 超时直接 **SIGKILL** ⇒ `finally` 跑不到 ⇒ 锁留在 `kb/.work/.kb.lock`。实测代价：2026-10-03 18:53:13 漏下 `run_id=20261003-185311-autorun` 那把锁，**挡停了随后的一次日更**（`L1 写档 → exit=2`，「遇红即停」）。"
      verified: "语义对照实测（独立复现）：装处理器 ⇒ `kill -TERM` 后 **finally 跑、锁释放** ✅；不装 ⇒ **锁残留** ❌。★ 集成侧（`kb_pipeline` 自己的 `finally`）由**代码审读**确认（:958），**没有**拿真 `--apply` 去 SIGTERM —— 那正是库里警告的「崩在中途」场景，不做。"
  l0_not_aligned_finding:
    summary: "用户复查「L0 今天日更后跟飞书对齐了吗」⇒ **未完全对齐，但两个原因都不是管线故障**。"
    only_feishu_10: "**准入规则正常工作**：逐条原因全同 `准入未过：材料审核状态=[] != [\"通过\"]`（飞书侧尚未审核通过）。★ **更正**：作者上一轮说过「自动拉取实际没生效」——**那句是错的**，`auto_apply: true` 生效了，是准入挡的。"
    pull_failed_2: "**2 张表权限不足**，且 `kb/l7/registry/l0-expected-diffs.yaml` 的 **EX-2/EX-3（2026-09-30 登记）**早有：`code 91403`、reason 原文「资源级 ACL：bot 身份（守衡）不在该表的协作者里……**重试 ／ 换身份都没用**」。**要人在飞书侧把「守衡」加成该表的可阅读协作者。**"
    independent_probe: "bot（`cli_aa2243de0438dcd7`＝守衡，profile `dsh-kb`）对该 base **连 `base +table-list`（元数据级）都是 91403**，而对照 base（`GnRZ…`）正常 ⇒ **不是表级限制，是该 base 整体没授权给这个应用**。（用户称「飞书侧本来就加了守衡是编辑权限」⇒ 与实测不符，需在飞书侧核对加的是**应用**还是**人名**、以及是不是**这个 base**。）"
    consequence: "见 `fix2_expose_stale_copy_age` —— 已让「旧到 10.4 天」可见。"

  l0_aligned_resolved_20261003:
    summary: "承接 `l0_not_aligned_finding` 的 `pull_failed_2`：**两张表已拉通，L0 闸门实测转绿（真差异 0）**。用户裁定「先用我的身份拉通，同时我去飞书侧授权」。"
    what: "`kb/l8/align_l0_feishu.py` 加**按表身份回落**：首拉用 `L8_AS`（默认 `bot`）失败后，先删掉可能写了一半的快照，再**只对这张表**改用户身份（`L8_AS_FALLBACK`，默认 `user`）重拉一次；设 `L8_AS_FALLBACK=`（空）即关闭回落。"
    why: >
      为什么不按 EX-2/EX-3 当初写的 `owner_action`（把守衡加成协作者）：那条**至今没做**，
      且 bot 对该 base 是**整库级** `131006`（连 `base +table-list` 都进不去，不是表级）——
      根治要人在飞书侧操作。为什么不干脆全局 `L8_AS=user`：实测 device-flow 输出
      `[WARN] no refresh_token in response` ⇒ 用户令牌**到期不续**，把 10 张表一起吊在一个
      会过期的令牌上，换来的正是本库反复栽的那类「日更成功但 L0 没更新」。所以只在**必须**的表上回落。
    visibility: >
      回落**不许静默**：每张表记 `identity`；回落另记 `identity_fallback{from,to,first_error}`；
      汇总行加「身份回落 N」。★ 已核 `l0_gate.py` 两个正则不受影响：`ROW` 锚定 `\\s*$` 而**表行格式未变**、
      `TOTALS` 用 `.search()` **非锚定**仍能取到 `pf`，且新增的 `[身份回落]` 行不匹配 `ROW`（无 `飞书=`）也不匹配 `FAIL`（非 `[拉取失败]`）。
    fail_loud: "★ 令牌失效**是响的不是哑的**：user 拉不到 ⇒ 该表回到 `pull_failed` ⇒ `l0_gate` 判红。不会退化成静默假绿。"
    declarations: "`kb/l7/registry/l0-expected-diffs.yaml`：EX-2/EX-3 按各自 `reopen_when`（「该表不再报拉取失败」）**移除**；新增顶层 `resolved` 区块，照实记「怎么解决的」（**换身份，不是 ACL 授权**）＋ 残余风险 ＋ 新 `reopen_when`；`meta.latest_run` 更新为本次实测。"
    verified: >
      `align_l0_feishu.py --check`：`专家修订汇总表` 395/395 一致、`内容公式（仅供参考）` 7/7 一致、
      两表 `值变 0`；汇总 `一致 1014 ｜ 飞书多 10 ｜ L0多 0 ｜ 值变 0 ｜ 拉取失败 0（原 2）｜ 身份回落 2`。
      `l0_gate.py` → **结论 ✅ 过（真差异 0）・退出码 0・未声明的差异 0 条**，`expected` 仅剩 EX-1（材料收集 10 → 预期内）。
    residual: "① bot 对该 base 仍无权限 —— 飞书侧授权后回落自然不再触发（**不用改代码**）；② 用户令牌到期需重跑 `lark-cli auth login --profile dsh-kb --domain base --domain wiki`。"
    scope_note: "改的是**对账器**（谁去读源），**没有**放宽任何闸门判据 —— `not_exemptable` 四条一字未动，`only_feishu 10` 仍在原始事实里、由 EX-1 分类，不是被抹掉。"

