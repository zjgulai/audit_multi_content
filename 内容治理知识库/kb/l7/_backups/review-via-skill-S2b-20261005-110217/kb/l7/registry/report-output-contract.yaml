# ─────────────────────────────────────────────────────────────────────
# 一、PRD 契约（逐条摘录，来源见 meta.prd）
# ─────────────────────────────────────────────────────────────────────

prd_contract:

  # §8.2 批量扫描与多维表 —— 15 个字段，与线上表逐字一致
  bitable_fields:
    - 内容 ID
    - 产品线
    - 渠道
    - 内容类型
    - 送审版本
    - Agent 结论
    - 置信度
    - 问题数量
    - 问题分类汇总
    - 报告链接
    - 人工复核人
    - 复核结论
    - sign-off 人
    - 发布时间
    - 状态
  bitable_status_options: [待审, PASS, REVIEW, BLOCK, 已修改, 已发布]
  bitable_note: >
    线上表 tblCXPQVzfFWWCon 的 15 个字段与 6 个状态选项**与本清单逐字一致**
    （2026-10-02 只读核对）。⇒ 表是照 PRD 建的；差错应在**值**，不在字段。
  bitable_target:
    base_token: RY2UbCRjXaeeWwscUPScVN5AnQc
    table_id: tblCXPQVzfFWWCon
    view_id: vewhS7Rwx0
    wiki_token: Lntdw8XqmifewjkdEckcXYH8nOV

  # §5.3.4 + §8.3 报告链接
  report_link:
    trigger: "**问题数量 ≥ 3** 时才生成完整报告并返回链接"
    below_threshold: "问题数量 1–2 个：**逐条输出**（不生成报告链接）"
    content_requirements:
      - "完整问题清单，每条包含：维度、位置、问题描述、原因、依据文档链接、修改建议"
      - "按维度分组展示，便于按类别处理"
      - "支持导出为飞书文档或 PDF"
      - "报告链接有效期 ≥ 30 天，**存于飞书云文档**"
    latency: "问题 ≥ 3 时，报告链接生成 ≤ 30 秒（验收标准表）"
    retention: "所有审查记录保存 ≥ 1 年（验收标准表）"
    threshold_rationale: >
      阈值 3 的依据：单次审查中 3 个及以上问题已超出用户可快速浏览和记忆的范围。
      采用「摘要 + 钻取报告」模式。阈值支持配置，建议保留 3 作为默认值。

  # §6.6 置信度与分流策略 —— 要求的是**数值**
  confidence_routing:
    kind: numeric          # 0–1 的数值，不是高/中/低
    bands:
      - range: ">= 0.90"
        action: "直接输出结论（PASS / BLOCK）"
      - range: "0.70 - 0.89"
        action: "输出 REVIEW，标注「建议人工确认」"
      - range: "< 0.70"
        action: "输出 REVIEW，标注「不确定，建议人工重点看」"
    exception: "P0 层级规则不适用置信度分流，命中即 BLOCK。"

  # §5.3 三态结论输出规范
  three_state_output:
    PASS: "一句话总结，说明未发现已知底线风险；动作：转交对应 sign-off 负责人。"
    REVIEW:
      n_le_2: "逐条输出（维度 / 问题描述 / 原因 / 依据链接）"
      n_ge_3: "只输出分类汇总（各维度问题数量）+ 报告链接 + 转对应团队"
    BLOCK:
      n_le_2: "逐条输出（维度 / 问题描述 / 原因 / 依据链接 / 建议）"
      n_ge_3: "只输出分类汇总（各维度问题数量）+ 报告链接 + 修改后重新提交"
  issue_summary_semantics: >
    「问题分类汇总」按 PRD = **各维度问题数量**（验收标准表：「分类汇总（各维度问题数量）」），
    形如「合规类问题：3 个」。

  version_field:
    field: 送审版本
    prd_defines_format: false
    note: >
      PRD 全文只在两处出现「送审版本」：§8.2 当字段名、§9 当 sign-off 判据
      （「发布版本与送审版本一致」）。**PRD 未定义其取值格式。**
    adopted_rule: "PRD 未定义 ⇒ 从 v1.0 起（用户 2026-10-02 裁定）"

  # §5.4 结构化 JSON 规范 —— 「内容 ID」的口径（2026-10-03 补登记；用户提问触发）
  content_id:
    prd_quote: |
      "review_id": "CR-20260922-0001",
      "content_id": "AD-20260922-001",
      "content_version": "v1",
    prd_defines_format: false
    note: >
      PRD 全文只在两处出现「内容 ID」：§5.4 这个示例 ＋ §8.2 的字段表。**PRD 没有写它怎么生成**；
      但从示例读得出语义分工：`AD-<日期>-<序号>` 是**业务编号（恒定）**，`content_version: v1`
      是**随内容递增的版本号** —— 只有这样 §10「审核记录绑定内容版本」才成立。
    kb_side_before_20261003: >
      实现走的是另一套，且**同一次审查存在两个不同的「内容 ID」**：引擎 JSON =
      `text-<sha256 前 12 位>`（with_kb_evidence.py:210），飞书表行 =
      `AUTO-<content_version 前 12 位>`（feishu_publish.py:334）。两者只共享后 12 位
      ⇒ 按 ID 直接对不上，只能人工比 12 位。
    kb_side_after_20261003: >
      **前缀已统一为 `AUTO-`**：唯一生成规则落成 `with_kb_evidence.py:_auto_content_id()`
      （两处调用点共用，不再各写一份），`kb_api.py` 的字段说明同步。
      ⇒ 引擎 JSON / 报告正文 / 飞书表行三面同值。
    still_open: "ID 的**语义**仍未按 PRD 走 —— 见 gaps_unresolved 的 GAP-RO-6。"

# ─────────────────────────────────────────────────────────────────────
# 二、实测结果：知识库 / 引擎**有没有**这些输出（2026-10-02 实测）
# ─────────────────────────────────────────────────────────────────────

measured_outputs:

  # ── 置信度 ──────────────────────────────────────────────────────
  confidence:
    prd_requires: "数值 0–1（§6.6）"
    kb_side:
      per_issue_field_exists: true
      per_issue_values: [高, 中, 低]
      per_issue_source: "kb/l7/skills/kb-content-review/scripts/review.py:680（`高 if authority=='expert' else 中`）"
      authority_populated: "**0 / 1018 条规则有 authority**（实测全库扫描，0.0%）"
      consequence: "逐条置信度**恒为「中」**——不是「低」，是**降级**，因为判据字段全空。"
    engine_side:
      numeric_exists: true
      where: "kb/l7/review-engine/core/review_engine.py decide()（:147 / :151 / :153 / :155 / :159 / :162）"
      confidence_status: "heuristic_not_calibrated（review_engine.py:196）"
      values_observed_20261002: {A: 0.97, B: 0.78, C: 0.99, D: 0.99, E: 0.78, F: 0.99, G: 0.99}
    why_missing_in_report: >
      **不是没有，是没走到。** `review.py`（依据侧）按设计**不调** decide()
      （review.py:968 注释明写「不调用 review_engine.decide()」），只给逐条 高/中/低。
      数值置信度只由裁决侧 decide() 产出。本轮探针直接跑 review.py ⇒ 数值从未被计算。
      接桥脚本 `with_kb_evidence.py:195` 两条都跑，**经它能拿到数值**（上表即由它实测）。

  # ── 修改建议 ────────────────────────────────────────────────────
  suggestion:
    prd_requires: "报告每条含「修改建议」（§5.3.4 / §8.3）"
    kb_side:
      mechanism: >
        `same_source_advice()` 两个来源：① `rule_allowance()` 从 `rule_text` 正则取
        「豁免：…」/「边界允许：…」；② 规则 `expression_fix_pairs` 的记录级改法。
      availability_1_of_1018:
        rule_text_contains_豁免: 14
        rule_text_contains_边界允许: 2
        expression_fix_pairs_non_empty: 44
        total_rules: 1018
      verdict: "**知识库有，但覆盖率低**：豁免/边界允许合计 16 条（1.6%），改法配对 44 条（4.3%）。"
    engine_side:
      gate: "kb/l7/skills/kb-content-review/scripts/review.py:654"
      gate_code: 'advice, advice_note = same_source_advice(r, excerpt) if sev == "BLOCK" else ("", "")'
      consequence: "**只有 BLOCK 才生成修改建议；REVIEW 一律置空** —— 与库里有没有数据无关。"
    case_20261002:
      - article_no: W-1.8
        severity: BLOCK
        kb_has: true
        emitted: true
        text: "可改为（本规则豁免表达）：FDA cleared, FDA-cleared, FDA registered, FDA 注册"
      - article_no: W-1.47
        severity: REVIEW
        kb_has: true
        emitted: false
        discarded_by: "review.py:654 的 BLOCK 闸门"
        text_that_was_discarded: "可改为（本规则豁免表达）：不能治疗乳腺炎, 不可以治疗乳腺炎, 无法治疗乳腺炎, 不能预防乳腺炎, 不可以预防乳腺炎, 不能治愈乳腺炎, 不是乳腺炎治疗设备, 乳腺炎治疗设备, natural let-down, natural letdown, your natural let-down, your natural letdown, relaxation supports, may help your flow, 自然奶阵, 放松"
      - article_no: W-1.43
        severity: REVIEW
        kb_has: true
        emitted: false
        discarded_by: "review.py:654 的 BLOCK 闸门"
        text_that_was_discarded: "可改为（本规则豁免表达）：treat yourself, doesn't treat, does not treat, do not treat, not intended to treat, not to treat, not a treatment, not a medical device, not intended to cure, doesn't cure, cannot cure, can't cure, 不用于治疗, 不是治疗, 不能治疗, 不可治疗, 不可以治疗, 不能治愈, 无法治疗, 并非治疗, relieve engorgement, relieves engorgement, relieving engorgement, engorgement relief, ease engorgement, eases engorgement, easing engorgement, soothe engorgement, soothes engorgement, soulage les engorgements, soulager les engorgements, reduce the risk of clogged, reduces the risk of clogged, reducing the risk of clogged, reduce the risk of plugged, risk of clogged ducts, risk of plugged ducts, or cure, or treat, cannot treat, can't treat, does not cure, do not cure, won't cure"
      - article_no: W-1.9
        severity: REVIEW
        kb_has: false
        emitted: false
        note: "rule_text 无豁免/边界允许，且 expression_fix_pairs 为空 —— 库里确实没有。"
      - article_no: W-1.4
        severity: REVIEW
        kb_has: false
        emitted: false
        note: "同上，库里确实没有。"
    verdict: >
      **两层原因，缺一不可**：① 代码闸门（BLOCK-only）把库里**已有**的建议丢掉；
      ② 数据缺口（1.6% / 4.3%）让剩下的大多数规则**本来就没有**可给的建议。
      这正是 PRD §5.3.2 要求 REVIEW 报告也含「修改建议」而现状给不出的原因。

