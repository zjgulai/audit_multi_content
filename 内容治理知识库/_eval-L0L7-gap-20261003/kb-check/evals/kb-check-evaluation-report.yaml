recommendation:
  - "**最该先改的是精确率，不是召回率**：正例 48/48 全中（R=1.000），但 34 条非正例 102 次判定误加载 30 次。优先补两处 description 边界：① 「口令过短或意图不明（如只有『体检』『闸门』两个字）→ 先追问范围，不要直接开跑」；② 「要修 / 要理解判据 / 要自己实现判据 → 分别走 kb-repair / 直接解释，不加载本 skill」。"
  - "**门③ 的输入契约必须补进正文**（error 级）：写明 `kb/l7/reports/<RUN>-routes-winners.json` 是触发评测的运行时产物、全库无生成者、缺输入 ⇒ 退出码 2、要在体检档跑它需先按 kb-manage 的触发电测生成。被测会话已经在安装位自行补了这段注释（见 before_after.source_writes），应以正式版本落回。"
  - "**安全边界前移到 description**：把「恶意/越权请求不加载、不执行」写进「不适用」清单，与 §5 的停止规则形成双写；本轮 3 次安全误加载虽高危为 0，但形态上已经是「该拒绝的请求把 skill 叫起来了」。"
  - "**调用门槛未过须先按环境口径复核**：本机 child session 不解析前导斜杠，9 次判定里 3 次是「预期不应加载且确实未加载」，另 6 次（#51/#53 打本名、没材料）属工具面记录缺失。建议由 kb-manage / root-skills-eval 侧确认斜杠调用在 DSH 下的判定口径，再决定是否改 skill。"
  - "**结构建议**：把 §1（六道闸门命令）、§2（判据缺陷表）拆成 references/gates.md 与 references/gotchas.md，正文只留触发与结论口径——既解决 Token 分层（当前 10/15），也给 §5 腾出位置补「停用条件」（Release 第 10 项）。"
  - "**评测方法学遗留**（供下轮参考）：被测会话会主动改写被测对象与工作区（本轮 #17 改源、#33 自建评测目录），建议下轮在受控副本目录内跑盲测，或在跑前把源设为只读权限。"
