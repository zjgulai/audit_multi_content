recommendation: >
  不放行现状装载位 v1.1.0。**但现成 fix v1.2.0 已把握住本轮的实质短板**（分层、可执行预检查、
  安全边界 NEVER/ALWAYS、停用条件），其静态内容质量显著更高（轨道 A 98.3 vs 77.9、轨道 C 裸分 89 vs 78）。
  两版在触发准确性上**测不出差异**（均 F1=1.000），因此「换 fix」的收益全部落在
  Progressive Disclosure / Script Quality / Safety / 维护闭环这四项，而不是触发准确率。
  共同阻断项是**同一个**：裸斜杠 `/kb-check` 不加载（调用门槛 6/9），需要一处很小的正文改动才能过线。
